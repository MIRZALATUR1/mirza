                        exportedAt: new Date().toISOString(), orgId, orgName: org.name,
                        org: { id: orgId, ...org },
                        products: productsSnap.docs.map(d => ({ id: d.id, ...d.data() })),
                        sales: salesSnap.docs.map(d => ({ id: d.id, ...d.data() })),
                        purchases: purchasesSnap.docs.map(d => ({ id: d.id, ...d.data() })),
                        expenses: expensesSnap.docs.map(d => ({ id: d.id, ...d.data() })),
                        returns: returnsSnap.docs.map(d => ({ id: d.id, ...d.data() })),
                        parties
                    };
                    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url; a.download = `${(org.name || 'buildmart').replace(/\s+/g, '_')}_backup_${new Date().toISOString().slice(0, 10)}.json`; a.click();
                } catch (e) {
                    alert('Backup Error: ' + e.message);
                } finally {
                    setBackupBusy(false);
                }
            };

            // Restore — re-writes documents from a backup file using their
            // ORIGINAL ids (so it's safe to re-run; it won't create duplicates,
            // it just overwrites matching records and adds anything missing).
            const handleRestoreFile = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (!confirm('Backup file se data restore karoge? Ye maujooda records ko unke ID se overwrite kar dega (naya data delete nahi hoga). Continue?')) {
                    if (restoreFileRef.current) restoreFileRef.current.value = '';
                    return;
                }
                setRestoreBusy(true); setRestoreMsg('');
                try {
                    const text = await file.text();
                    const backup = JSON.parse(text);
                    const orgRef = db.collection('orgs').doc(orgId);
                    let count = 0;

                    const writeAll = async (colName, docs) => {
                        const chunks = [];
                        for (let i = 0; i < docs.length; i += 400) chunks.push(docs.slice(i, i + 400));
                        for (const chunk of chunks) {
                            const batch = db.batch();
                            chunk.forEach(d => {
                                const { id, ...rest } = d;
                                batch.set(orgRef.collection(colName).doc(id), rest, { merge: true });
                            });
                            await batch.commit();
                            count += chunk.length;
                        }
                    };

                    if (backup.products) await writeAll('products', backup.products);
                    if (backup.sales) await writeAll('sales', backup.sales);
                    if (backup.purchases) await writeAll('purchases', backup.purchases);
                    if (backup.expenses) await writeAll('expenses', backup.expenses);
                    if (backup.returns) await writeAll('returns', backup.returns);
                    if (backup.parties) {
                        for (const p of backup.parties) {
                            const { id, transactions, ...rest } = p;
                            await orgRef.collection('parties').doc(id).set(rest, { merge: true });
                            count++;
                            if (transactions && transactions.length) await writeAll(`parties/${id}/transactions`, transactions);
                        }
                    }
                    setRestoreMsg(`✓ Restore ho gaya (${count} records processed).`);
                } catch (e) {
                    setRestoreMsg('Error: ' + e.message + ' — check ki ye sahi backup file hai.');
                } finally {
                    setRestoreBusy(false);
                    if (restoreFileRef.current) restoreFileRef.current.value = '';
                }
            };

            return (
                <div className="p-6 overflow-auto">
                    <h2 className="text-xl font-bold mb-4">{t(lang, 'nav_settings')}</h2>
                    <form onSubmit={save} className="bg-white p-6 rounded shadow max-w-xl space-y-4 mb-6">
                        <div><label className="text-sm font-bold block mb-1">Business Name</label><input className="w-full border p-2 rounded" value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} required /></div>
                        <div><label className="text-sm font-bold block mb-1">Address</label><input className="w-full border p-2 rounded" value={form.address} onChange={e => setForm({ ...form, address: e.target.value })} /></div>
                        <div><label className="text-sm font-bold block mb-1">Mobile</label><input className="w-full border p-2 rounded" value={form.mobile} onChange={e => setForm({ ...form, mobile: e.target.value })} /></div>
                        <div><label className="text-sm font-bold block mb-1">GSTIN (optional)</label><input className="w-full border p-2 rounded" value={form.gstin} onChange={e => setForm({ ...form, gstin: e.target.value })} /></div>
                        <button className="bg-orange-600 text-white px-4 py-2 rounded font-bold">{saved ? 'Saved ✓' : 'Save'}</button>
                    </form>

                    <div className="bg-white p-6 rounded shadow max-w-xl mb-6">
                        <h3 className="font-bold mb-2">Business Logo (bills/quotations pe dikhega)</h3>
                        {org.logoDataUrl ? (
                            <div className="flex items-center gap-4 mb-3">
                                <img src={org.logoDataUrl} alt="Logo" className="h-16 border rounded p-1" />
                                <button onClick={removeLogo} className="text-red-600 text-sm border px-3 py-1 rounded">Remove Logo</button>
                            </div>
                        ) : (
                            <p className="text-sm text-gray-500 mb-3">Abhi koi logo nahi hai.</p>
                        )}
                        <input ref={logoFileRef} type="file" accept="image/*" onChange={handleLogoUpload} disabled={logoBusy} className="text-sm" />
                        {logoBusy && <p className="text-xs text-gray-500 mt-1">Upload ho raha hai...</p>}
                        {logoErr && <p className="text-xs text-red-600 mt-1">{logoErr}</p>}
                    </div>

                    <div className="bg-white p-6 rounded shadow max-w-xl">
                        <h3 className="font-bold mb-2">Data Backup & Restore</h3>
                        <p className="text-sm text-gray-500 mb-4">Poora data (inventory, bills, khata, sab kuch) ek file me download kar lo — kal agar kuch bhi galat ho jaye, isi file se wapas restore kar sakte ho.</p>
                        <button onClick={downloadBackup} disabled={backupBusy} className="bg-slate-700 text-white px-4 py-2 rounded font-bold mb-4 disabled:opacity-50">
                            {backupBusy ? 'Backup ban raha hai...' : '⬇ Download Full Backup'}
                        </button>
                        <div className="border-t pt-4">
                            <label className="text-sm font-bold block mb-2 text-red-600">⚠ Restore from Backup (sambhal ke use karo)</label>
                            <input ref={restoreFileRef} type="file" accept=".json" onChange={handleRestoreFile} disabled={restoreBusy} className="text-sm" />
                            {restoreMsg && <p className={`text-sm mt-2 font-bold ${restoreMsg.startsWith('Error') ? 'text-red-600' : 'text-green-600'}`}>{restoreMsg}</p>}
                        </div>
                    </div>
                </div>
            );
        };

        // ============================================================
        // 11. KHATA BOOK — Udhar diya (customers) / Udhar liya (suppliers)
        // ============================================================
        const KhataBook = ({ orgId, org, userDoc, firebaseUser, products, sales, lang, isAdmin }) => {
            const [tab, setTab] = useState('customer'); // customer | supplier | directory
            const [parties, setParties] = useState([]);
            const [search, setSearch] = useState('');
            const [openParty, setOpenParty] = useState(null); // party being viewed/paid
            const [txns, setTxns] = useState([]);
            const [payAmount, setPayAmount] = useState('');
            const [payNote, setPayNote] = useState('');
            const [paySite, setPaySite] = useState('');
            const [payDueDate, setPayDueDate] = useState('');
            const [showNewParty, setShowNewParty] = useState(false);
            const [newParty, setNewParty] = useState({ name: '', mobile: '', opening: '', creditLimit: '' });
            const [showReturn, setShowReturn] = useState(false);
            const [returnProdQuery, setReturnProdQuery] = useState('');
            const [returnProd, setReturnProd] = useState(null);
            const [returnQty, setReturnQty] = useState('');
            const [returnBusy, setReturnBusy] = useState(false);
            const [siteFilter, setSiteFilter] = useState('All');
            const [customersList, setCustomersList] = useState([]);
            const [openCustomer, setOpenCustomer] = useState(null);
            const [showAddCustomer, setShowAddCustomer] = useState(false);
            const [customerForm, setCustomerForm] = useState({ name: '', mobile: '', address: '' });
            const [editingCustomerId, setEditingCustomerId] = useState(null);
            const [showDeletedCustomers, setShowDeletedCustomers] = useState(false);

            const customersRef = db.collection('orgs').doc(orgId).collection('customers');

            const partiesRef = db.collection('orgs').doc(orgId).collection('parties');

            useEffect(() => {
                if (tab === 'directory') {
                    const unsub = db.collection('orgs').doc(orgId).collection('customers').onSnapshot(snap => {
                        setCustomersList(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                    });
                    return unsub;
                }
                const unsub = partiesRef.where('type', '==', tab).onSnapshot(snap => {
                    setParties(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                return unsub;
            }, [orgId, tab]);

            useEffect(() => {
                if (!openParty) { setTxns([]); return; }
                setSiteFilter('All');
                const unsub = partiesRef.doc(openParty.id).collection('transactions').orderBy('createdAt', 'desc').limit(200).onSnapshot(snap => {
                    setTxns(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                return unsub;
            }, [openParty]);

            const filtered = parties.filter(p => p.name.toLowerCase().includes(search.toLowerCase()) || (p.mobile || '').includes(search))
                .sort((a, b) => (b.balance || 0) - (a.balance || 0));

            const totalOutstanding = parties.reduce((s, p) => s + (p.balance || 0), 0);

            // Group this party's transactions by "site" so a contractor with
            // multiple sites can be reviewed site-by-site, with an overall total too.
            const siteGroups = useMemo(() => {
                const map = {};
                txns.forEach(t => {
                    const key = t.site || 'General (No Site)';
                    if (!map[key]) map[key] = { site: key, credit: 0, debit: 0, txns: [] };
                    if (t.type === 'sale_credit' || t.type === 'purchase_credit' || (t.type === 'opening_balance' && t.amount > 0)) map[key].credit += t.amount;
                    else map[key].debit += t.amount;
                    map[key].txns.push(t);
                });
                return Object.values(map).sort((a, b) => a.site.localeCompare(b.site));
            }, [txns]);

            const siteNames = ['All', ...siteGroups.map(g => g.site)];
            const visibleTxns = siteFilter === 'All' ? txns : (siteGroups.find(g => g.site === siteFilter) || { txns: [] }).txns;

            const addManualTxn = async (isCredit) => {
                // isCredit: customer -> "Udhar Diya" (+) / supplier -> "Udhar Liya" (+)
                // !isCredit: "Payment Mila/Diya" (-)
                const amt = Number(payAmount);
                if (!amt || amt <= 0) return alert('Sahi amount daalein');
                const sign = isCredit ? 1 : -1;
                const type = tab === 'customer'
                    ? (isCredit ? 'sale_credit' : 'payment_received')
                    : (isCredit ? 'purchase_credit' : 'payment_made');
                await partiesRef.doc(openParty.id).update({ balance: FieldValue.increment(sign * amt) });
                await partiesRef.doc(openParty.id).collection('transactions').add({
                    type, amount: amt, note: payNote || '', site: isCredit ? (paySite || '') : '', dueDate: isCredit ? (payDueDate || null) : null,
                    date: new Date().toISOString(), createdAt: FieldValue.serverTimestamp(),
                    staffUid: firebaseUser.uid, staffName: userDoc.name
                });
                if (isCredit && payDueDate) {
                    await db.collection('orgs').doc(orgId).collection('dueReminders').add({
                        partyId: openParty.id, partyName: openParty.name, partyType: tab, mobile: openParty.mobile || '',
                        site: paySite || '', amount: amt, dueDate: payDueDate, note: payNote || '',
                        resolved: false, createdAt: FieldValue.serverTimestamp()
                    });
                }
                setPayAmount(''); setPayNote(''); setPaySite(''); setPayDueDate('');
            };

            const createParty = async (e) => {
                e.preventDefault();
                if (!newParty.name.trim()) return;
                const opening = Number(newParty.opening) || 0;
                const ref = await partiesRef.add({
                    name: newParty.name.trim(), mobile: newParty.mobile.trim(), type: tab,
                    balance: opening, creditLimit: tab === 'customer' ? (Number(newParty.creditLimit) || 0) : 0,
                    createdAt: FieldValue.serverTimestamp()
                });
                if (opening !== 0) {
                    await ref.collection('transactions').add({
                        type: 'opening_balance', amount: opening, note: 'Opening balance',
                        date: new Date().toISOString(), createdAt: FieldValue.serverTimestamp(),
                        staffUid: firebaseUser.uid, staffName: userDoc.name
                    });
                }
                setNewParty({ name: '', mobile: '', opening: '', creditLimit: '' });
                setShowNewParty(false);
            };

            const setCreditLimit = async (val) => {
                await partiesRef.doc(openParty.id).update({ creditLimit: Number(val) || 0 });
            };

            // ------- Customer Directory: Add / Edit / Delete / Restore -------
            const openAddCustomer = () => {
                setCustomerForm({ name: '', mobile: '', address: '' });
                setEditingCustomerId(null);
                setShowAddCustomer(true);
            };
            const openEditCustomer = (c) => {
                setCustomerForm({ name: c.name || '', mobile: c.mobile || '', address: c.address || '' });
                setEditingCustomerId(c.id);
                setShowAddCustomer(true);
            };
            const saveCustomer = async (e) => {
                e.preventDefault();
                if (!customerForm.name.trim() && !customerForm.mobile.trim()) return;
                if (editingCustomerId) {
                    await customersRef.doc(editingCustomerId).update({
                        name: customerForm.name.trim(), mobile: customerForm.mobile.trim(), address: customerForm.address.trim()
                    });
                } else {
                    await customersRef.add({
                        name: customerForm.name.trim(), mobile: customerForm.mobile.trim(), address: customerForm.address.trim(),
                        totalPurchases: 0, totalSpent: 0, deleted: false, createdAt: FieldValue.serverTimestamp()
                    });
                }
                setShowAddCustomer(false);
                setCustomerForm({ name: '', mobile: '', address: '' });
                setEditingCustomerId(null);
            };
            // Any staff with Khata access can remove a customer from the active
            // list (e.g. duplicate entry) — but only an ADMIN can bring it back,
            // so accidental/careless deletes can always be recovered by the owner.
            const deleteCustomer = async (c) => {
                if (confirm(`"${c.name || c.mobile}" ko directory se hatana hai? Admin baad me restore kar sakta hai.`)) {
                    await customersRef.doc(c.id).update({ deleted: true, deletedAt: FieldValue.serverTimestamp() });
                    setOpenCustomer(null);
                }
            };
            const restoreCustomer = async (c) => {
                await customersRef.doc(c.id).update({ deleted: false, deletedAt: FieldValue.delete() });
            };

            const submitPurchaseReturn = async () => {
                if (!returnProd || !returnQty || Number(returnQty) <= 0) { alert('Product aur quantity chuno.'); return; }
                const qty = Number(returnQty);
                setReturnBusy(true);
                try {
                    const amount = (returnProd.priceBuy || 0) * qty;
                    const batch = db.batch();
                    batch.update(db.collection('orgs').doc(orgId).collection('products').doc(returnProd.id), { stock: FieldValue.increment(-qty) });
                    batch.update(partiesRef.doc(openParty.id), { balance: FieldValue.increment(-amount) });
                    batch.set(partiesRef.doc(openParty.id).collection('transactions').doc(), {
                        type: 'purchase_return', amount, note: `Return: ${returnProd.name} x ${qty} ${returnProd.unit}`,
                        date: new Date().toISOString(), createdAt: FieldValue.serverTimestamp(),
                        staffUid: firebaseUser.uid, staffName: userDoc.name
                    });
                    batch.set(db.collection('orgs').doc(orgId).collection('returns').doc(), {
                        type: 'purchase_return', supplierPartyId: openParty.id,
                        items: [{ productId: returnProd.id, name: returnProd.name, qty, rate: returnProd.priceBuy, total: amount }],
                        totalAmount: amount, date: new Date().toISOString(), createdAt: FieldValue.serverTimestamp(),
                        staffUid: firebaseUser.uid, staffName: userDoc.name
                    });
                    await batch.commit();
                    setShowReturn(false); setReturnProd(null); setReturnQty(''); setReturnProdQuery('');
                } catch (e) {
                    alert('Error: ' + e.message);
                } finally {
                    setReturnBusy(false);
                }
            };

            const returnProdMatches = returnProdQuery.length > 1 ? products.filter(p => p.name.toLowerCase().includes(returnProdQuery.toLowerCase())).slice(0, 6) : [];

            const downloadPartyPDF = () => {
                const doc = new window.jspdf.jsPDF();
                const currentBalance = (parties.find(p => p.id === openParty.id) || openParty).balance || 0;
                doc.setFontSize(14);
                doc.text(`${openParty.name} — Khata Statement`, 14, 15);
                doc.setFontSize(9);
                doc.text(`Mobile: ${openParty.mobile || '-'} · Type: ${tab === 'customer' ? 'Customer' : 'Supplier'}`, 14, 21);
                doc.text(`Current Balance: Rs.${currentBalance.toLocaleString()}`, 14, 26);
                let y = 32;
                siteGroups.forEach(g => {
                    doc.setFontSize(10);
                    doc.text(`Site: ${g.site} — Total Given: Rs.${g.credit.toFixed(2)} | Total Paid: Rs.${g.debit.toFixed(2)} | Balance: Rs.${(g.credit - g.debit).toFixed(2)}`, 14, y);
                    y += 4;
                    doc.autoTable({
                        startY: y,
                        head: [['Date', 'Type', 'Note', 'Amount']],
                        body: g.txns.slice().reverse().map(t => [new Date(t.date).toLocaleDateString(), txnLabel[t.type] || t.type, t.note || '', 'Rs.' + t.amount.toFixed(2)]),
                        styles: { fontSize: 8 },
                        margin: { left: 14 }
                    });
                    y = doc.lastAutoTable.finalY + 8;
                });
                doc.save(`${openParty.name.replace(/\s+/g, '_')}_khata.pdf`);
            };


            const txnLabel = {
                sale_credit: t(lang, 'khata_txn_saleCredit'), purchase_credit: t(lang, 'khata_txn_purchaseCredit'),
                payment_received: t(lang, 'khata_txn_paymentReceived'), payment_made: t(lang, 'khata_txn_paymentMade'),
                opening_balance: t(lang, 'khata_txn_opening'), purchase_return: t(lang, 'khata_txn_purchaseReturn')
            };
            const dueDateLabel = t(lang, 'khata_dueDate');

            return (
                <div className="p-6 overflow-auto">
                    <h2 className="text-xl font-bold mb-1">{t(lang, 'khata_title')}</h2>
                    <p className="text-sm text-gray-500 mb-4">{t(lang, 'khata_subtitle')}</p>

                    <div className="flex gap-2 mb-4">
                        <button onClick={() => { setTab('customer'); setOpenParty(null); }} className={`px-4 py-2 rounded font-bold ${tab === 'customer' ? 'bg-slate-800 text-white' : 'bg-white border'}`}>
                            {t(lang, 'khata_customersTab')}
                        </button>
                        <button onClick={() => { setTab('supplier'); setOpenParty(null); }} className={`px-4 py-2 rounded font-bold ${tab === 'supplier' ? 'bg-slate-800 text-white' : 'bg-white border'}`}>
                            {t(lang, 'khata_suppliersTab')}
                        </button>
                        <button onClick={() => { setTab('directory'); setOpenParty(null); }} className={`px-4 py-2 rounded font-bold ${tab === 'directory' ? 'bg-slate-800 text-white' : 'bg-white border'}`}>
                            📇 Sabhi Customers (Directory)
                        </button>
                    </div>

                    {tab !== 'directory' && (<>
                    <div className={`mb-4 p-4 rounded shadow text-white ${tab === 'customer' ? 'bg-green-600' : 'bg-red-600'}`}>
                        <p className="text-sm opacity-90">{tab === 'customer' ? t(lang, 'khata_toReceive') : t(lang, 'khata_toPay')}</p>
                        <h3 className="text-2xl font-bold">₹{totalOutstanding.toLocaleString()}</h3>

        // ============================================================
        // 12. PROFIT & LOSS
        // ============================================================
        const ProfitLoss = ({ orgId, org, sales, lang }) => {
            const [filter, setFilter] = useState({ from: '', to: '' });
            const [expenses, setExpenses] = useState([]);
            const [expForm, setExpForm] = useState({ category: 'Rent', amount: '', note: '', date: new Date().toISOString().split('T')[0] });

            const expensesRef = db.collection('orgs').doc(orgId).collection('expenses');

            useEffect(() => {
                const unsub = expensesRef.orderBy('date', 'desc').onSnapshot(snap => setExpenses(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                return unsub;
            }, [orgId]);

            const inRange = (dateStr) => {
                const d = dateStr.split('T')[0];
                return (!filter.from || d >= filter.from) && (!filter.to || d <= filter.to);
            };

            const filteredSales = sales.filter(s => inRange(s.date) && !s.voided);
            const filteredExpenses = expenses.filter(e => inRange(e.date));

            // Revenue excludes GST (that's collected on behalf of the government, not real income)
            // and excludes anything returned by customers.
            const grossSales = filteredSales.reduce((s, x) => s + (x.grandTotal || 0) - (x.gstAmount || 0) - (x.returnedTotal || 0), 0);
            const totalDiscounts = filteredSales.reduce((s, x) => s + (x.billDiscount || 0), 0);
            const revenue = grossSales;
            const cogs = filteredSales.reduce((s, x) => {
                const soldCogs = (x.cart || []).reduce((cs, item) => cs + (item.priceBuy || 0) * item.qty, 0);
                const returnedCogs = (x.cart || []).reduce((cs, item) => cs + (item.priceBuy || 0) * (item.returnedQty || 0), 0);
                return s + soldCogs - returnedCogs;
            }, 0);
            const grossProfit = revenue - cogs;
            const grossMargin = revenue > 0 ? ((grossProfit / revenue) * 100).toFixed(1) : '0.0';

            // Expenses grouped by category, standard-statement style
            const expenseByCategory = useMemo(() => {
                const map = {};
                filteredExpenses.forEach(e => { map[e.category] = (map[e.category] || 0) + (e.amount || 0); });
                return EXPENSE_CATEGORIES.filter(c => map[c]).map(c => ({ category: c, amount: map[c] }));
            }, [filteredExpenses]);
            const totalExpenses = filteredExpenses.reduce((s, x) => s + (x.amount || 0), 0);
            const netProfit = grossProfit - totalExpenses;
            const netMargin = revenue > 0 ? ((netProfit / revenue) * 100).toFixed(1) : '0.0';

            const addExpense = async (e) => {
                e.preventDefault();
                if (!expForm.amount) return;
                await expensesRef.add({ ...expForm, amount: Number(expForm.amount), createdAt: FieldValue.serverTimestamp() });
                setExpForm({ ...expForm, amount: '', note: '' });
            };
            const deleteExpense = async (id) => {
                if (confirm('Delete this expense?')) await expensesRef.doc(id).delete();
            };

            const downloadExcel = () => {
                let csv = 'Profit & Loss Statement\n';
                csv += `Period,${filter.from || 'Start'} to ${filter.to || 'Today'}\n\n`;
                csv += `Sales Revenue,${revenue.toFixed(2)}\n`;
                csv += `Less: Cost of Goods Sold,${cogs.toFixed(2)}\n`;
                csv += `Gross Profit,${grossProfit.toFixed(2)}\n`;
                csv += `Gross Margin %,${grossMargin}\n\n`;
                csv += 'Operating Expenses\n';
                expenseByCategory.forEach(e => { csv += `${e.category},${e.amount.toFixed(2)}\n`; });
                csv += `Total Expenses,${totalExpenses.toFixed(2)}\n\n`;
                csv += `Net Profit,${netProfit.toFixed(2)}\n`;
                csv += `Net Margin %,${netMargin}\n`;
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = `PL_Statement_${new Date().toISOString().slice(0, 10)}.csv`; a.click();
            };

            const downloadPDF = () => {
                const doc = new window.jspdf.jsPDF();
                doc.setFontSize(15);
                doc.text(`${(org && org.name) || 'Business'} — Profit & Loss Statement`, 14, 15);
                doc.setFontSize(9);
                doc.text(`Period: ${filter.from || 'Start'} to ${filter.to || 'Today'}`, 14, 21);

                const body = [
                    ['Sales Revenue', '', 'Rs.' + revenue.toFixed(2)],
                    ['Less: Cost of Goods Sold', '', 'Rs.' + cogs.toFixed(2)],
                    ['Gross Profit', '', 'Rs.' + grossProfit.toFixed(2)],
                    ['Gross Margin', '', grossMargin + '%'],
                    ['', '', ''],
                    ['Operating Expenses', '', ''],
                ];
                expenseByCategory.forEach(e => body.push(['   ' + e.category, '', 'Rs.' + e.amount.toFixed(2)]));
                body.push(['Total Operating Expenses', '', 'Rs.' + totalExpenses.toFixed(2)]);
                body.push(['', '', '']);
                body.push(['NET PROFIT', '', 'Rs.' + netProfit.toFixed(2)]);
                body.push(['Net Margin', '', netMargin + '%']);

                doc.autoTable({
                    startY: 26,
                    head: [['Particulars', '', 'Amount']],
                    body,
                    styles: { fontSize: 9 },
                    columnStyles: { 2: { halign: 'right' } }
                });
                doc.save(`PL_Statement_${new Date().toISOString().slice(0, 10)}.pdf`);
            };

            return (
                <div className="p-6 overflow-auto">
                    <div className="flex flex-wrap justify-between items-end gap-4 mb-4">
                        <h2 className="text-xl font-bold">{t(lang, 'nav_profit')}</h2>
                        <div className="flex gap-2">
                            <button onClick={downloadExcel} className="bg-green-600 text-white px-3 py-2 rounded font-bold text-sm">Export Excel</button>
                            <button onClick={downloadPDF} className="bg-red-600 text-white px-3 py-2 rounded font-bold text-sm">Download PDF</button>
                        </div>
                    </div>

                    <div className="flex flex-wrap gap-4 mb-6 bg-white p-4 rounded shadow items-end">
                        <div><label className="text-xs font-bold block">From Date</label><input type="date" className="border p-2 rounded" value={filter.from} onChange={e => setFilter({ ...filter, from: e.target.value })} /></div>
                        <div><label className="text-xs font-bold block">To Date</label><input type="date" className="border p-2 rounded" value={filter.to} onChange={e => setFilter({ ...filter, to: e.target.value })} /></div>
                    </div>

                    {/* Standard-format statement, like a formal company P&L */}
                    <div className="bg-white rounded shadow p-6 mb-6 max-w-2xl font-mono text-sm">
                        <div className="text-center mb-4 font-sans">
                            <h3 className="font-bold text-lg">{(org && org.name) || 'Business'}</h3>
                            <p className="text-gray-500 text-xs">Profit & Loss Statement · {filter.from || 'Start'} to {filter.to || 'Today'}</p>
                        </div>
                        <div className="flex justify-between py-1"><span>Sales Revenue</span><span>₹{revenue.toLocaleString(undefined, { minimumFractionDigits: 2 })}</span></div>
                        <div className="flex justify-between py-1 text-gray-500"><span>Less: Cost of Goods Sold</span><span>(₹{cogs.toLocaleString(undefined, { minimumFractionDigits: 2 })})</span></div>
                        <div className="flex justify-between py-2 border-t border-b font-bold"><span>Gross Profit</span><span>₹{grossProfit.toLocaleString(undefined, { minimumFractionDigits: 2 })}</span></div>
                        <div className="flex justify-between py-1 text-xs text-gray-400"><span>Gross Margin</span><span>{grossMargin}%</span></div>

                        <div className="mt-4 mb-1 font-bold font-sans text-gray-600">Operating Expenses</div>
                        {expenseByCategory.map(e => (
                            <div key={e.category} className="flex justify-between py-0.5 pl-4 text-gray-600"><span>{e.category}</span><span>₹{e.amount.toLocaleString(undefined, { minimumFractionDigits: 2 })}</span></div>
                        ))}
                        {expenseByCategory.length === 0 && <div className="pl-4 text-xs text-gray-400">Koi expense record nahi hai is period me.</div>}
                        <div className="flex justify-between py-2 border-t font-bold"><span>Total Operating Expenses</span><span>₹{totalExpenses.toLocaleString(undefined, { minimumFractionDigits: 2 })}</span></div>

                        <div className={`flex justify-between py-3 mt-2 border-t-2 border-double text-lg font-bold ${netProfit >= 0 ? 'text-green-700' : 'text-red-700'}`}>
                            <span>NET PROFIT</span><span>₹{netProfit.toLocaleString(undefined, { minimumFractionDigits: 2 })}</span>
                        </div>
                        <div className="flex justify-between text-xs text-gray-400"><span>Net Margin</span><span>{netMargin}%</span></div>
                    </div>

                    <div className="bg-white p-4 rounded shadow max-w-3xl">
                        <h3 className="font-bold mb-3">Business Expenses (Rent, Salary, etc.)</h3>
                        <form onSubmit={addExpense} className="flex flex-wrap gap-2 mb-4">
                            <select className="border p-2 rounded" value={expForm.category} onChange={e => setExpForm({ ...expForm, category: e.target.value })}>
                                {EXPENSE_CATEGORIES.map(c => <option key={c}>{c}</option>)}
                            </select>
                            <input type="number" className="border p-2 rounded w-28" placeholder="Amount ₹" value={expForm.amount} onChange={e => setExpForm({ ...expForm, amount: e.target.value })} required />
                            <input type="date" className="border p-2 rounded" value={expForm.date} onChange={e => setExpForm({ ...expForm, date: e.target.value })} />
                            <input className="border p-2 rounded flex-1 min-w-[120px]" placeholder="Note (optional)" value={expForm.note} onChange={e => setExpForm({ ...expForm, note: e.target.value })} />
                            <button className="bg-orange-600 text-white px-4 rounded font-bold">Add</button>
                        </form>
                        <table className="w-full text-sm">
                            <thead className="text-left text-gray-500 border-b"><tr><th className="py-1">Date</th><th>Category</th><th>Note</th><th className="text-right">Amount</th><th></th></tr></thead>
                            <tbody>
                                {filteredExpenses.map(e => (
                                    <tr key={e.id} className="border-b">
                                        <td className="py-2">{new Date(e.date).toLocaleDateString()}</td>
                                        <td>{e.category}</td>
                                        <td className="text-gray-500">{e.note}</td>
                                        <td className="text-right font-bold">₹{e.amount.toLocaleString()}</td>
                                        <td className="text-red-500 cursor-pointer text-right" onClick={() => deleteExpense(e.id)}>x</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                        {filteredExpenses.length === 0 && <p className="text-center text-gray-400 py-4">Koi expense record nahi hai.</p>}
                    </div>
                </div>
            );
        };

        // ============================================================
        // DUE REMINDERS BANNER (visible to everyone, owner + staff both)
        // "Kis customer/supplier se kab paisa lena/dena hai" reminder strip.
        // ============================================================
        const DueRemindersBanner = ({ orgId, org, dueReminders, lang }) => {
            const [expanded, setExpanded] = useState(false);

            const today = new Date().toISOString().split('T')[0];
            const sorted = [...dueReminders].sort((a, b) => (a.dueDate || '').localeCompare(b.dueDate || ''));
            const overdue = sorted.filter(r => r.dueDate < today);
            const dueSoon = sorted.filter(r => r.dueDate >= today && r.dueDate <= new Date(Date.now() + 3 * 86400000).toISOString().split('T')[0]);
            const upcoming = sorted.filter(r => r.dueDate > new Date(Date.now() + 3 * 86400000).toISOString().split('T')[0]);

            if (sorted.length === 0) return null;

            const markCollected = async (r) => {
                await db.collection('orgs').doc(orgId).collection('dueReminders').doc(r.id).update({ resolved: true, resolvedAt: FieldValue.serverTimestamp() });
            };

            const daysDiff = (dateStr) => Math.round((new Date(dateStr) - new Date(today)) / 86400000);

            const remindWhatsApp = (r) => {
                const msg = r.partyType === 'customer'
                    ? `Namaste ${r.partyName}!\n${org.name} ki taraf se yaad dilana tha — ₹${r.amount.toLocaleString()} ka payment ${new Date(r.dueDate).toLocaleDateString()} ko due hai${r.site ? ' (' + r.site + ')' : ''}. Kripya jaldi bhugtan karein. Dhanyawad!`
                    : `Namaste ${r.partyName}, ${org.name} se — humein aapko ₹${r.amount.toLocaleString()} ka payment ${new Date(r.dueDate).toLocaleDateString()} tak karna hai. Confirm kar dein.`;
                sendWhatsApp(r.mobile, msg);
            };

            const Row = ({ r }) => (
                <div className="flex justify-between items-center py-2 border-b last:border-b-0">
                    <div>
                        <span className="font-bold">{r.partyName}</span>
                        <span className={`ml-2 text-xs px-1.5 py-0.5 rounded ${r.partyType === 'customer' ? 'bg-green-100 text-green-700' : 'bg-blue-100 text-blue-700'}`}>{r.partyType === 'customer' ? t(lang, 'due_toReceive') : t(lang, 'due_toPay')}</span>
                        {r.site && <span className="ml-1 text-xs text-gray-400">· {r.site}</span>}
                        <div className="text-xs text-gray-500">{r.note} · {new Date(r.dueDate).toLocaleDateString()} ({daysDiff(r.dueDate) < 0 ? `${-daysDiff(r.dueDate)} ${t(lang, 'due_daysOverdue')}` : daysDiff(r.dueDate) === 0 ? t(lang, 'due_today') : `${daysDiff(r.dueDate)} ${t(lang, 'due_daysLeft')}`})</div>
                    </div>
                    <div className="flex items-center gap-2">
                        <span className="font-bold">₹{r.amount.toLocaleString()}</span>
                        {r.mobile && <button onClick={() => remindWhatsApp(r)} className="text-xs bg-green-100 hover:bg-green-200 text-green-700 px-2 py-1 rounded">📱</button>}
                        <button onClick={() => markCollected(r)} className="text-xs bg-gray-100 hover:bg-gray-200 px-2 py-1 rounded">{t(lang, 'due_done')}</button>
                    </div>
                </div>
            );

            return (
                <div className="no-print bg-white border-b-2 border-red-300 px-4 py-2">
                    <div className="flex justify-between items-center cursor-pointer" onClick={() => setExpanded(!expanded)}>
                        <div className="flex items-center gap-3">
                            <span className="font-bold text-red-700">🔔 {t(lang, 'due_title')}</span>
                            {overdue.length > 0 && <span className="text-xs bg-red-600 text-white px-2 py-0.5 rounded-full font-bold">{overdue.length} {t(lang, 'due_overdue')}</span>}
                            {dueSoon.length > 0 && <span className="text-xs bg-yellow-500 text-white px-2 py-0.5 rounded-full font-bold">{dueSoon.length} {t(lang, 'due_soon')}</span>}
                        </div>
                        <span className="text-xs text-gray-400">{expanded ? t(lang, 'due_hide') : t(lang, 'due_show')}</span>
                    </div>
                    {expanded && (
                        <div className="mt-2 max-h-64 overflow-auto">
                            {overdue.map(r => <Row key={r.id} r={r} />)}
                            {dueSoon.map(r => <Row key={r.id} r={r} />)}
                            {upcoming.map(r => <Row key={r.id} r={r} />)}
                        </div>
                    )}
                </div>
            );
        };

        // ============================================================
        // MAIN APP (post-login, active org member)
        // ============================================================
        const MainApp = ({ firebaseUser, userDoc }) => {
            const [view, setView] = useState('pos');
            const [org, setOrg] = useState(null);
            const [products, setProducts] = useState([]);
            const [sales, setSales] = useState([]);
            const [purchases, setPurchases] = useState([]);
            const [dueReminders, setDueReminders] = useState([]);
            const [lang, setLang] = useState(() => localStorage.getItem('buildmart_lang') || 'en');
            const [isOnline, setIsOnline] = useState(navigator.onLine);
            const orgId = userDoc.orgId;
            const isAdmin = userDoc.role === 'owner' || userDoc.role === 'admin';
            const perms = userDoc.permissions || defaultPermissions();

            const canPOS = isAdmin || perms.pos;
            const canInventory = isAdmin || perms.inventory;
            const canReports = isAdmin || perms.reports;
            const canProfit = isAdmin || perms.profit;
            const canKhata = isAdmin || perms.khata;
            const canDashboard = isAdmin || perms.dashboard;
            const lowStockCount = useMemo(() => products.filter(p => p.stock < 10).length, [products]);

            const changeLang = (l) => { setLang(l); localStorage.setItem('buildmart_lang', l); };

            useEffect(() => {
                const goOnline = () => setIsOnline(true);
                const goOffline = () => setIsOnline(false);
                window.addEventListener('online', goOnline);
                window.addEventListener('offline', goOffline);
                return () => { window.removeEventListener('online', goOnline); window.removeEventListener('offline', goOffline); };
            }, []);

            useEffect(() => {
                const unsubOrg = db.collection('orgs').doc(orgId).onSnapshot(d => setOrg({ id: d.id, ...d.data() }));
                const unsubProd = db.collection('orgs').doc(orgId).collection('products').orderBy('name').onSnapshot(snap => setProducts(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsubSales = db.collection('orgs').doc(orgId).collection('sales').orderBy('date').onSnapshot(snap => setSales(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsubPurch = db.collection('orgs').doc(orgId).collection('purchases').orderBy('date').onSnapshot(snap => setPurchases(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsubDue = db.collection('orgs').doc(orgId).collection('dueReminders').where('resolved', '==', false).onSnapshot(snap => setDueReminders(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                return () => { unsubOrg(); unsubProd(); unsubSales(); unsubPurch(); unsubDue(); };
            }, [orgId]);

            useEffect(() => {
                // If current view isn't accessible (e.g. permissions just changed), fall back to the first one that is.
                const allowed = { pos: canPOS, quotation: canPOS, inventory: canInventory, reports: canReports, profit: canProfit, khata: canKhata, dashboard: canDashboard, users: isAdmin, settings: isAdmin };
                if (!allowed[view]) {
                    const first = Object.keys(allowed).find(k => allowed[k]);
                    if (first) setView(first);
                }
            }, [canPOS, canInventory, canReports, canProfit, canKhata, canDashboard, isAdmin]);

            if (!org) return <div className="min-h-screen flex items-center justify-center">Loading...</div>;

            const hasAnyAccess = canPOS || canInventory || canReports || canProfit || canKhata || canDashboard || isAdmin;
            if (!hasAnyAccess) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-800">
                        <div className="bg-white p-8 rounded-lg shadow-xl w-96 text-center">
                            <h2 className="text-xl font-bold mb-2 text-red-600">Koi Access Nahi</h2>
                            <p className="text-gray-500 mb-6">Admin ne abhi tak aapko koi permission nahi di hai. Unse contact karein.</p>
                            <button onClick={() => auth.signOut()} className="bg-red-600 text-white px-4 py-2 rounded font-bold">Logout</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex h-screen overflow-hidden">
                    <div className="w-64 bg-slate-900 text-white flex flex-col no-print">
                        <div className="p-4 text-center border-b border-slate-700">
                            <h1 className="text-xl font-bold text-orange-500 truncate">{org.name}</h1>
                            {org.address && <p className="text-xs text-slate-400 truncate">{org.address}</p>}
                            <p className="text-xs mt-2 text-green-400">Welcome, {userDoc.name}</p>
                            <div className="mt-1 flex items-center justify-center gap-1">
                                <span className={`w-2 h-2 rounded-full ${isOnline ? 'bg-green-400' : 'bg-red-500'}`}></span>
                                <span className={`text-xs ${isOnline ? 'text-green-400' : 'text-red-400'}`}>
                                    {isOnline ? (lang === 'hi' ? 'ऑनलाइन' : lang === 'mr' ? 'ऑनलाइन' : 'Online') : (lang === 'hi' ? 'ऑफलाइन — bill save honge' : lang === 'mr' ? 'ऑफलाइन — बिल सेव्ह होतील' : 'Offline — bills will save')}
                                </span>
                            </div>
                            <select value={lang} onChange={e => changeLang(e.target.value)} className="mt-2 w-full bg-slate-800 text-white text-xs p-1 rounded border border-slate-600">
                                {Object.keys(LANGUAGES).map(l => <option key={l} value={l}>{LANGUAGES[l]}</option>)}
                            </select>
                        </div>
                        <nav className="flex-1 p-2 space-y-1 overflow-auto">
                            {canDashboard && <button onClick={() => setView('dashboard')} className={`w-full text-left p-3 rounded ${view === 'dashboard' ? 'bg-slate-700' : ''}`}>{t(lang, 'nav_dashboard')}</button>}
                            {canPOS && <button onClick={() => setView('pos')} className={`w-full text-left p-3 rounded ${view === 'pos' ? 'bg-slate-700' : ''}`}>{t(lang, 'nav_pos')}</button>}
                            {canPOS && <button onClick={() => setView('quotation')} className={`w-full text-left p-3 rounded ${view === 'quotation' ? 'bg-slate-700' : ''}`}>{t(lang, 'nav_quotation')}</button>}
                            {canInventory && <button onClick={() => setView('inventory')} className={`w-full text-left p-3 rounded flex justify-between items-center ${view === 'inventory' ? 'bg-slate-700' : ''}`}>
                                <span>{t(lang, 'nav_inventory')}</span>
                                {lowStockCount > 0 && <span className="bg-red-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">{lowStockCount}</span>}
                            </button>}
                            {canKhata && <button onClick={() => setView('khata')} className={`w-full text-left p-3 rounded ${view === 'khata' ? 'bg-slate-700' : ''}`}>{t(lang, 'nav_khata')}</button>}
                            {canReports && <button onClick={() => setView('reports')} className={`w-full text-left p-3 rounded ${view === 'reports' ? 'bg-slate-700' : ''}`}>{t(lang, 'nav_reports')}</button>}
                            {canProfit && <button onClick={() => setView('profit')} className={`w-full text-left p-3 rounded ${view === 'profit' ? 'bg-slate-700' : ''}`}>{t(lang, 'nav_profit')}</button>}
                            {isAdmin && <button onClick={() => setView('users')} className={`w-full text-left p-3 rounded ${view === 'users' ? 'bg-slate-700' : ''}`}>{t(lang, 'nav_users')}</button>}
                            {isAdmin && <button onClick={() => setView('settings')} className={`w-full text-left p-3 rounded ${view === 'settings' ? 'bg-slate-700' : ''}`}>{t(lang, 'nav_settings')}</button>}
                        </nav>
                        <button onClick={() => auth.signOut()} className="p-4 bg-red-600 hover:bg-red-700 m-2 rounded">{t(lang, 'nav_logout')}</button>
                    </div>

                    <div className="flex-1 bg-gray-100 h-full overflow-hidden flex flex-col">
                        <DueRemindersBanner orgId={orgId} org={org} dueReminders={dueReminders} lang={lang} />
                        {view === 'dashboard' && canDashboard && <Dashboard sales={sales} products={products} lang={lang} />}
                        {view === 'pos' && canPOS && <POS orgId={orgId} org={org} products={products} userDoc={userDoc} firebaseUser={firebaseUser} lang={lang} />}
                        {view === 'inventory' && canInventory && <Inventory orgId={orgId} products={products} isAdmin={isAdmin} lang={lang} userDoc={userDoc} />}
                        {view === 'khata' && canKhata && <KhataBook orgId={orgId} org={org} userDoc={userDoc} firebaseUser={firebaseUser} products={products} sales={sales} lang={lang} isAdmin={isAdmin} />}
                        {view === 'reports' && canReports && <SalesReport orgId={orgId} org={org} sales={sales} purchases={purchases} products={products} userDoc={userDoc} lang={lang} />}
                        {view === 'profit' && canProfit && <ProfitLoss orgId={orgId} org={org} sales={sales} lang={lang} />}
                        {view === 'quotation' && canPOS && <Quotation products={products} org={org} />}
                        {view === 'users' && isAdmin && <UserMgmt orgId={orgId} org={org} lang={lang} />}
                        {view === 'settings' && isAdmin && <Settings orgId={orgId} org={org} lang={lang} />}
                    </div>
                </div>
            );
        };

        // ============================================================
        // ROOT APP (auth state machine)
        // ============================================================
        const App = () => {
            const [authLoading, setAuthLoading] = useState(true);
            const [firebaseUser, setFirebaseUser] = useState(null);
            const [userDoc, setUserDoc] = useState(undefined); // undefined = loading, null = no profile
            const [orgNameForPending, setOrgNameForPending] = useState('');

            useEffect(() => {
                const unsub = auth.onAuthStateChanged(u => {
                    setFirebaseUser(u);
                    setAuthLoading(false);
                    if (!u) setUserDoc(undefined);
                });
                return unsub;
            }, []);

            useEffect(() => {
                if (!firebaseUser) return;
                setUserDoc(undefined);
                const unsub = db.collection('users').doc(firebaseUser.uid).onSnapshot(
                    doc => setUserDoc(doc.exists ? { id: doc.id, ...doc.data() } : null),
                    () => setUserDoc(null)
                );
                return unsub;
            }, [firebaseUser]);

            useEffect(() => {
                if (userDoc && userDoc.status === 'pending' && userDoc.orgId) {
                    db.collection('orgs').doc(userDoc.orgId).get().then(d => {
                        if (d.exists) setOrgNameForPending(d.data().name);
                    });
                }
            }, [userDoc]);

            if (authLoading) return <div className="min-h-screen flex items-center justify-center bg-slate-800 text-white">Loading...</div>;
            if (!firebaseUser) return <Login />;
            if (userDoc === undefined) return <div className="min-h-screen flex items-center justify-center bg-slate-800 text-white">Loading profile...</div>;
            if (userDoc === null) return <Onboarding user={firebaseUser} />;
            if (userDoc.status === 'pending') return <PendingApproval orgName={orgNameForPending} />;
            if (userDoc.status === 'disabled') return (
                <div className="min-h-screen flex items-center justify-center bg-slate-800">
                    <div className="bg-white p-8 rounded-lg shadow-xl w-96 text-center">
                        <h2 className="text-xl font-bold mb-2 text-red-600">Access Disabled</h2>
                        <p className="text-gray-500 mb-6">Aapka access admin ne disable kar diya hai. Unse contact karein.</p>
                        <button onClick={() => auth.signOut()} className="bg-red-600 text-white px-4 py-2 rounded font-bold">Logout</button>
                    </div>
                </div>
            );
            return <MainApp firebaseUser={firebaseUser} userDoc={userDoc} />;
        };

        // ============================================================
        // PRINT TEMPLATE GENERATOR
        // ============================================================
        function generateReceiptHTML(data, org) {
            org = org || { name: 'Business', address: '', mobile: '' };
            const isEst = data.billType === 'Estimate';
            const isQuote = data.billType === 'Quotation';
            const isChallan = data.billType === 'Delivery Challan';

            if (isChallan) {
                return `
                    <div class="print-a4">
                        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #333; padding-bottom:10px;">
                            <div style="display:flex; align-items:center; gap:12px;">
                                ${org.logoDataUrl ? `<img src="${org.logoDataUrl}" style="height:48px;">` : ''}
                                <div>
                                    <h1 style="color:#e65100; margin:0;">${org.name.toUpperCase()}</h1>
                                    <p style="margin:0; font-size:12px;">${org.address || ''} ${org.mobile ? '| Mob: ' + org.mobile : ''}</p>
                                </div>
                            </div>
                            <div style="text-align:right;">
                                <h2 style="margin:0; color:#333;">DELIVERY CHALLAN</h2>
                                <p>Challan No: ${data.id.toString().slice(-8)}</p>
                                <p>Date: ${new Date(data.date).toLocaleDateString()}</p>
                            </div>
                        </div>
                        <div style="margin:20px 0; padding:10px; background:#f5f5f5; border-radius:5px;">
                            <strong>Delivered To:</strong> ${data.customer.name || ''}<br>
                            ${data.customer.address ? data.customer.address + '<br>' : ''}
                            ${data.customer.mobile ? 'Mob: ' + data.customer.mobile : ''}
                            ${data.site ? `<br>Site: ${data.site}` : ''}
                        </div>
                        <table style="width:100%; border-collapse:collapse; margin-top:20px;">
                            <thead style="background:#333; color:white;">
                                <tr><th style="padding:10px; text-align:left;">#</th><th style="padding:10px; text-align:left;">Description</th><th style="padding:10px; text-align:center;">Quantity</th></tr>
                            </thead>
                            <tbody>
                                ${data.cart.map((item, index) => `
                                    <tr style="border-bottom:1px solid #ddd;">
                                        <td style="padding:10px;">${index + 1}</td>
                                        <td style="padding:10px;">${item.name}</td>
                                        <td style="padding:10px; text-align:center;">${item.qty} ${item.unit}</td>
                                    </tr>`).join('')}
                            </tbody>
                        </table>
                        <p style="font-size:11px; color:#666; margin-top:10px;">Note: Ye sirf delivery challan hai — rate/tax invoice alag se milega.</p>
                        <div style="margin-top:50px; display:flex; justify-content:space-between;">
                            <div style="border-top:1px solid #000; padding-top:5px; width:40%;">Delivered By</div>
                            <div style="border-top:1px solid #000; padding-top:5px; width:40%;">Received By (Sign)</div>
                        </div>
                    </div>`;
            }

            if (!isQuote) {
                return `
                    <div class="print-thermal">
                        <center>
                            ${org.logoDataUrl ? `<img src="${org.logoDataUrl}" style="height:32px; margin-bottom:4px;">` : ''}
                            <h2 style="margin:0">${org.name.toUpperCase()}</h2>
                            <p style="margin:0; font-size:10px">${org.address || ''}</p>
                            <p style="margin:0; font-size:10px">${org.mobile ? 'Mob: ' + org.mobile : ''}</p>
                            <hr style="border-top: 1px dashed #000; margin: 5px 0;">
                            <h3 style="margin:5px 0">${isEst ? 'ESTIMATE / CHALAN' : 'TAX INVOICE'}</h3>
                        </center>
                        <div style="display:flex; justify-content:space-between; font-size:10px;">
                            <span>Bill: #${data.id.toString().slice(-6)}</span>
                            <span>Date: ${new Date(data.date).toLocaleDateString()}</span>
                        </div>
                        <div style="font-size:10px;">Customer: ${data.customer.name || 'Cash Sale'}</div>
                        ${data.customer.address ? `<div style="font-size:10px;">${data.customer.address}</div>` : ''}
                        <hr style="border-top: 1px dashed #000; margin: 5px 0;">
                        <table style="width:100%; text-align:left; font-size:11px;">
                            <thead><tr><th>Item</th><th style="text-align:right">Qty</th><th style="text-align:right">Amt</th></tr></thead>
                            <tbody>${data.cart.map(i => `<tr><td>${i.name}</td><td style="text-align:right">${i.qty}</td><td style="text-align:right">${i.total}</td></tr>`).join('')}</tbody>
                        </table>
                        <hr style="border-top: 1px dashed #000; margin: 5px 0;">
                        ${data.gstAmount > 0 ? `
                        <div style="display:flex; justify-content:space-between; font-size:10px;"><span>Subtotal</span><span>₹${(data.subtotal || 0).toFixed(2)}</span></div>
                        <div style="display:flex; justify-content:space-between; font-size:10px;"><span>CGST</span><span>₹${(data.gstAmount / 2).toFixed(2)}</span></div>
                        <div style="display:flex; justify-content:space-between; font-size:10px;"><span>SGST</span><span>₹${(data.gstAmount / 2).toFixed(2)}</span></div>
                        ` : ''}
                        ${data.billDiscount > 0 ? `<div style="display:flex; justify-content:space-between; font-size:10px;"><span>Discount</span><span>-₹${data.billDiscount.toFixed(2)}</span></div>` : ''}
                        ${Math.abs(data.roundOff || 0) > 0.001 ? `<div style="display:flex; justify-content:space-between; font-size:10px;"><span>Round Off</span><span>${data.roundOff >= 0 ? '+' : ''}₹${data.roundOff.toFixed(2)}</span></div>` : ''}
                        <div style="text-align:right; font-weight:bold; font-size:14px;">Total: ₹${(data.grandTotal || 0).toFixed(2)}</div>
                        ${data.paymentMethod ? `<div style="font-size:10px;">Paid via: ${data.paymentMethod}</div>` : ''}
                        ${data.site ? `<div style="font-size:10px;">Site: ${data.site}</div>` : ''}
                        ${data.dueDate ? `<div style="font-size:10px;">Payment Due: ${new Date(data.dueDate).toLocaleDateString()}</div>` : ''}
                        ${data.paymentMode === 'Udhar' ? '<div style="text-align:center; font-weight:bold; font-size:12px; border:1px dashed #000; padding:3px; margin-top:4px;">** UDHAR - PAYMENT PENDING **</div>' : ''}
                        ${data.paymentMode === 'Split' ? `<div style="text-align:center; font-weight:bold; font-size:11px; border:1px dashed #000; padding:3px; margin-top:4px;">Paid: ₹${(data.cashAmount || 0).toFixed(2)} · Udhar: ₹${(data.udharAmount || 0).toFixed(2)}</div>` : ''}
                        <center style="margin-top:10px; font-size:10px;">** Thank You Visit Again **</center>
                    </div>`;
            }

            return `
                <div class="print-a4">
                    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #333; padding-bottom:10px;">
                        <div style="display:flex; align-items:center; gap:12px;">
                            ${org.logoDataUrl ? `<img src="${org.logoDataUrl}" style="height:48px;">` : ''}
                            <div>
                                <h1 style="color:#e65100; margin:0;">${org.name.toUpperCase()}</h1>
                                <p style="margin:0; font-size:12px;">${org.address || ''} ${org.mobile ? '| Mob: ' + org.mobile : ''}</p>
                                ${org.gstin ? `<p style="margin:0; font-size:12px;">GSTIN: ${org.gstin}</p>` : ''}
                            </div>
                        </div>
                        <div style="text-align:right;">
                            <h2 style="margin:0; color:#333;">${data.billType.toUpperCase()}</h2>
                            <p>Ref: ${data.id}</p>
                            <p>Date: ${new Date(data.date).toLocaleDateString()}</p>
                        </div>
                    </div>
                    <div style="margin:20px 0; padding:10px; background:#f5f5f5; border-radius:5px;">
                        <strong>To:</strong> ${data.customer.name}<br>
                        ${data.customer.address ? data.customer.address + '<br>' : ''}
                        ${data.customer.mobile ? 'Mob: ' + data.customer.mobile + '<br>' : ''}
                        ${data.customer.gst ? 'GSTIN: ' + data.customer.gst : ''}
                    </div>
                    <table style="width:100%; border-collapse:collapse; margin-top:20px;">
                        <thead style="background:#333; color:white;">
                            <tr><th style="padding:10px; text-align:left;">#</th><th style="padding:10px; text-align:left;">Description</th><th style="padding:10px; text-align:center;">Qty</th><th style="padding:10px; text-align:right;">Rate</th><th style="padding:10px; text-align:right;">Total</th></tr>
                        </thead>
                        <tbody>
                            ${data.cart.map((item, index) => `
                                <tr style="border-bottom:1px solid #ddd;">
                                    <td style="padding:10px;">${index + 1}</td>
                                    <td style="padding:10px;">${item.name}</td>
                                    <td style="padding:10px; text-align:center;">${item.qty} ${item.unit}</td>
                                    <td style="padding:10px; text-align:right;">${item.price || item.priceSell}</td>
                                    <td style="padding:10px; text-align:right;">${item.total}</td>
                                </tr>`).join('')}
                        </tbody>
                    </table>
                    <div style="margin-top:20px; text-align:right;">
                        ${data.gstAmount > 0 ? `
                        <p style="margin:2px 0;">Subtotal: ₹${(data.subtotal || 0).toFixed(2)}</p>
                        <p style="margin:2px 0;">CGST: ₹${(data.gstAmount / 2).toFixed(2)} &nbsp; SGST: ₹${(data.gstAmount / 2).toFixed(2)}</p>
                        ` : ''}
                        <h3 style="margin:4px 0 0;">Grand Total: ₹${(data.grandTotal || 0).toFixed(2)}</h3>
                    </div>
                    <div style="margin-top:50px; display:flex; justify-content:space-between;">
                        <div style="border-top:1px solid #000; padding-top:5px;">Customer Signature</div>
                        <div style="border-top:1px solid #000; padding-top:5px;">Authorized Signatory</div>
                    </div>
                </div>`;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

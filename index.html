                    {pending.length > 0 && (
                        <div className="bg-white p-4 rounded shadow mb-6 max-w-2xl border-l-4 border-yellow-500">
                            <h3 className="font-bold mb-2">Pending Approvals ({pending.length})</h3>
                            {pending.map(u => (
                                <div key={u.id} className="flex justify-between items-center border-b py-3">
                                    <div><span className="font-bold">{u.name}</span><div className="text-xs text-gray-500">{u.email}</div></div>
                                    <div className="flex gap-2">
                                        <button onClick={() => approve(u, 'staff')} className="bg-green-600 text-white px-3 py-1 rounded text-sm">Approve as Staff</button>
                                        <button onClick={() => approve(u, 'admin')} className="bg-blue-600 text-white px-3 py-1 rounded text-sm">Approve as Admin (Full Access)</button>
                                        <button onClick={() => reject(u)} className="bg-gray-200 px-3 py-1 rounded text-sm">Reject</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    <div className="bg-white p-4 rounded shadow max-w-2xl">
                        <h3 className="font-bold mb-2">Team Members ({active.length})</h3>
                        <p className="text-xs text-gray-500 mb-2">Admin/Owner ko hamesha full access hota hai. Staff ke liye niche "Permissions" se control karein ki wo kya-kya kar sakta hai.</p>
                        <ul>
                            {active.map(u => {
                                const perms = u.permissions || defaultPermissions();
                                return (
                                    <li key={u.id} className="border-b py-3">
                                        <div className="flex justify-between items-center">
                                            <div>
                                                <span className="font-bold">{u.name}</span> <span className="text-xs bg-gray-200 px-1 rounded">{u.role}</span>
                                                {isStaffLogin(u) && <span className="text-xs bg-orange-100 text-orange-700 px-1 rounded ml-1">Username Login</span>}
                                                <div className="text-xs text-gray-500">{isStaffLogin(u) ? 'Username: ' + u.email.replace(STAFF_EMAIL_DOMAIN, '') : u.email}</div>
                                            </div>
                                            {u.role !== 'owner' && (
                                                <div className="flex gap-2 items-center">
                                                    <select className="border p-1 rounded text-sm" value={u.role} onChange={e => changeRole(u, e.target.value)}>
                                                        <option value="staff">Staff</option>
                                                        <option value="admin">Admin (Full Access)</option>
                                                    </select>
                                                    {u.role === 'staff' && (
                                                        <button onClick={() => setExpandedId(expandedId === u.id ? null : u.id)} className="text-blue-600 text-sm border px-2 py-1 rounded">
                                                            {expandedId === u.id ? 'Hide' : 'Permissions'}
                                                        </button>
                                                    )}
                                                    <button onClick={() => disable(u)} className="text-red-600 text-sm border px-2 py-1 rounded">Disable</button>
                                                </div>
                                            )}
                                        </div>
                                        {u.role === 'staff' && expandedId === u.id && (
                                            <div className="mt-2 ml-1 grid grid-cols-2 gap-1 bg-gray-50 p-3 rounded">
                                                {Object.keys(PERMISSION_LABELS).map(key => (
                                                    <label key={key} className="flex items-center gap-2 text-sm cursor-pointer">
                                                        <input type="checkbox" checked={!!perms[key]} onChange={() => togglePermission(u, key)} />
                                                        {PERMISSION_LABELS[key]}
                                                    </label>
                                                ))}
                                            </div>
                                        )}
                                    </li>
                                );
                            })}
                            {users.filter(u => u.status === 'disabled').map(u => (
                                <li key={u.id} className="flex justify-between items-center border-b py-3 opacity-60">
                                    <div><span className="font-bold">{u.name}</span> <span className="text-xs bg-red-100 text-red-700 px-1 rounded">disabled</span></div>
                                    <button onClick={() => reEnable(u)} className="text-green-600 text-sm border px-2 py-1 rounded">Re-enable</button>
                                </li>
                            ))}
                        </ul>
                    </div>
                </div>
            );
        };

        // ============================================================
        // 10. SETTINGS (org profile used on printed bills)
        // ============================================================
        const Settings = ({ orgId, org }) => {
            const [form, setForm] = useState({ name: org.name || '', address: org.address || '', mobile: org.mobile || '', gstin: org.gstin || '' });
            const [saved, setSaved] = useState(false);

            const save = async (e) => {
                e.preventDefault();
                await db.collection('orgs').doc(orgId).update(form);
                setSaved(true); setTimeout(() => setSaved(false), 1500);
            };

            return (
                <div className="p-6 overflow-auto">
                    <h2 className="text-xl font-bold mb-4">Business Settings</h2>
                    <form onSubmit={save} className="bg-white p-6 rounded shadow max-w-xl space-y-4">
                        <div><label className="text-sm font-bold block mb-1">Business Name</label><input className="w-full border p-2 rounded" value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} required /></div>
                        <div><label className="text-sm font-bold block mb-1">Address</label><input className="w-full border p-2 rounded" value={form.address} onChange={e => setForm({ ...form, address: e.target.value })} /></div>
                        <div><label className="text-sm font-bold block mb-1">Mobile</label><input className="w-full border p-2 rounded" value={form.mobile} onChange={e => setForm({ ...form, mobile: e.target.value })} /></div>
                        <div><label className="text-sm font-bold block mb-1">GSTIN (optional)</label><input className="w-full border p-2 rounded" value={form.gstin} onChange={e => setForm({ ...form, gstin: e.target.value })} /></div>
                        <button className="bg-orange-600 text-white px-4 py-2 rounded font-bold">{saved ? 'Saved ✓' : 'Save'}</button>
                    </form>
                </div>
            );
        };

        // ============================================================
        // 11. KHATA BOOK — Udhar diya (customers) / Udhar liya (suppliers)
        // ============================================================
        const KhataBook = ({ orgId, userDoc, firebaseUser }) => {
            const [tab, setTab] = useState('customer'); // customer | supplier
            const [parties, setParties] = useState([]);
            const [search, setSearch] = useState('');
            const [openParty, setOpenParty] = useState(null); // party being viewed/paid
            const [txns, setTxns] = useState([]);
            const [payAmount, setPayAmount] = useState('');
            const [payNote, setPayNote] = useState('');
            const [showNewParty, setShowNewParty] = useState(false);
            const [newParty, setNewParty] = useState({ name: '', mobile: '', opening: '' });

            const partiesRef = db.collection('orgs').doc(orgId).collection('parties');

            useEffect(() => {
                const unsub = partiesRef.where('type', '==', tab).onSnapshot(snap => {
                    setParties(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                return unsub;
            }, [orgId, tab]);

            useEffect(() => {
                if (!openParty) { setTxns([]); return; }
                const unsub = partiesRef.doc(openParty.id).collection('transactions').orderBy('createdAt', 'desc').limit(50).onSnapshot(snap => {
                    setTxns(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                return unsub;
            }, [openParty]);

            const filtered = parties.filter(p => p.name.toLowerCase().includes(search.toLowerCase()) || (p.mobile || '').includes(search))
                .sort((a, b) => (b.balance || 0) - (a.balance || 0));

            const totalOutstanding = parties.reduce((s, p) => s + (p.balance || 0), 0);

            const addManualTxn = async (isCredit) => {
                // isCredit: customer -> "Udhar Diya" (+) / supplier -> "Udhar Liya" (+)
                // !isCredit: "Payment Mila/Diya" (-)
                const amt = Number(payAmount);
                if (!amt || amt <= 0) return alert('Sahi amount daalein');
                const sign = isCredit ? 1 : -1;
                const type = tab === 'customer'
                    ? (isCredit ? 'sale_credit' : 'payment_received')
                    : (isCredit ? 'purchase_credit' : 'payment_made');
                await partiesRef.doc(openParty.id).update({ balance: FieldValue.increment(sign * amt) });
                await partiesRef.doc(openParty.id).collection('transactions').add({
                    type, amount: amt, note: payNote || '',
                    date: new Date().toISOString(), createdAt: FieldValue.serverTimestamp(),
                    staffUid: firebaseUser.uid, staffName: userDoc.name
                });
                setPayAmount(''); setPayNote('');

            const createParty = async (e) => {
                e.preventDefault();
                if (!newParty.name.trim()) return;
                const opening = Number(newParty.opening) || 0;
                const ref = await partiesRef.add({
                    name: newParty.name.trim(), mobile: newParty.mobile.trim(), type: tab,
                    balance: opening, createdAt: FieldValue.serverTimestamp()
                });

                    await ref.collection('transactions').add({
                        type: 'opening_balance', amount: opening, note: 'Opening balance',
                        date: new Date().toISOString(), createdAt: FieldValue.serverTimestamp(),
                        staffUid: firebaseUser.uid, staffName: userDoc.name
                    });
                }
                setNewParty({ name: '', mobile: '', opening: '' });
                setShowNewParty(false);
            };

            const txnLabel = { sale_credit: 'Udhar Diya', purchase_credit: 'Udhar Liya', payment_received: 'Payment Mila', payment_made: 'Payment Diya', opening_balance: 'Opening Balance' };

            return (
                <div className="p-6 overflow-auto">
                    <h2 className="text-xl font-bold mb-1">Udhar Khata Book</h2>
                    <p className="text-sm text-gray-500 mb-4">Customers ko diya hua udhar aur suppliers ka udhar — dono yahan track hote hain.</p>

                    <div className="flex gap-2 mb-4">
                        <button onClick={() => { setTab('customer'); setOpenParty(null); }} className={`px-4 py-2 rounded font-bold ${tab === 'customer' ? 'bg-slate-800 text-white' : 'bg-white border'}`}>
                            Customers (Aapko Milna Hai)
                        </button>
                        <button onClick={() => { setTab('supplier'); setOpenParty(null); }} className={`px-4 py-2 rounded font-bold ${tab === 'supplier' ? 'bg-slate-800 text-white' : 'bg-white border'}`}>
                            Suppliers (Aapko Dena Hai)
                        </button>
                    </div>

                    <div className={`mb-4 p-4 rounded shadow text-white ${tab === 'customer' ? 'bg-green-600' : 'bg-red-600'}`}>
                        <p className="text-sm opacity-90">{tab === 'customer' ? 'Total To Receive' : 'Total To Pay'}</p>
                        <h3 className="text-2xl font-bold">₹{totalOutstanding.toLocaleString()}</h3>
                    </div>

                    <div className="flex gap-2 mb-4">
                        <input className="border p-2 rounded flex-1" placeholder="Search naam/mobile..." value={search} onChange={e => setSearch(e.target.value)} />
                        <button onClick={() => setShowNewParty(true)} className="bg-slate-700 text-white px-4 py-2 rounded font-bold">+ Naya {tab === 'customer' ? 'Customer' : 'Supplier'}</button>
                    </div>

                    <div className="bg-white rounded shadow overflow-hidden">
                        {filtered.length === 0 && <div className="p-4 text-center text-gray-500">Koi record nahi hai.</div>}
                        {filtered.map(p => (
                            <div key={p.id} onClick={() => setOpenParty(p)} className="flex justify-between items-center p-3 border-b hover:bg-gray-50 cursor-pointer">
                                <div><div className="font-bold">{p.name}</div><div className="text-xs text-gray-500">{p.mobile}</div></div>
                                <div className={`font-bold ${(p.balance || 0) > 0 ? 'text-red-600' : 'text-green-600'}`}>₹{(p.balance || 0).toLocaleString()}</div>
                            </div>
                        ))}
                    </div>

                    {showNewParty && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
                            <form onSubmit={createParty} className="bg-white p-6 rounded shadow-xl w-96">
                                <h3 className="font-bold text-lg mb-4">Naya {tab === 'customer' ? 'Customer' : 'Supplier'}</h3>
                                <div className="space-y-3">
                                    <input autoFocus className="w-full border p-2 rounded" placeholder="Naam" value={newParty.name} onChange={e => setNewParty({ ...newParty, name: e.target.value })} required />
                                    <input className="w-full border p-2 rounded" placeholder="Mobile" value={newParty.mobile} onChange={e => setNewParty({ ...newParty, mobile: e.target.value })} />
                                    <input type="number" className="w-full border p-2 rounded" placeholder="Opening Balance (agar pehle se udhar hai)" value={newParty.opening} onChange={e => setNewParty({ ...newParty, opening: e.target.value })} />
                                </div>
                                <div className="grid grid-cols-2 gap-2 mt-4">
                                    <button type="button" onClick={() => setShowNewParty(false)} className="bg-gray-200 p-2 rounded">Cancel</button>
                                    <button type="submit" className="bg-blue-600 text-white p-2 rounded font-bold">Create</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {openParty && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded shadow-xl w-full max-w-lg max-h-[90vh] flex flex-col">
                                <div className="p-4 border-b flex justify-between items-center">
                                    <div><h3 className="font-bold text-lg">{openParty.name}</h3><p className="text-xs text-gray-500">{openParty.mobile}</p></div>
                                    <button onClick={() => setOpenParty(null)} className="text-gray-400 text-xl">&times;</button>
                                </div>
                                <div className={`p-3 text-center font-bold text-white ${(parties.find(p => p.id === openParty.id) || openParty).balance > 0 ? 'bg-red-600' : 'bg-green-600'}`}>
                                    Balance: ₹{((parties.find(p => p.id === openParty.id) || openParty).balance || 0).toLocaleString()}
                                </div>

                                <div className="p-4 border-b bg-gray-50">
                                    <div className="flex gap-2 mb-2">
                                        <input type="number" className="border p-2 rounded flex-1" placeholder="Amount ₹" value={payAmount} onChange={e => setPayAmount(e.target.value)} />
                                        <input className="border p-2 rounded flex-1" placeholder="Note (optional)" value={payNote} onChange={e => setPayNote(e.target.value)} />
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <button onClick={() => addManualTxn(true)} className="bg-red-100 text-red-700 p-2 rounded font-bold text-sm">

                                                ₹{t.amount.toLocaleString()}

                                        </div>
                                    ))}

                        </div>
                    )}

            );
        };

        // ============================================================
        // 12. PROFIT & LOSS
        // ============================================================
        const ProfitLoss = ({ orgId, sales }) => {
            const [filter, setFilter] = useState({ from: '', to: '' });
            const [expenses, setExpenses] = useState([]);
            const [expForm, setExpForm] = useState({ category: 'Rent', amount: '', note: '', date: new Date().toISOString().split('T')[0] });

            const expensesRef = db.collection('orgs').doc(orgId).collection('expenses');

            useEffect(() => {
                const unsub = expensesRef.orderBy('date', 'desc').onSnapshot(snap => setExpenses(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                return unsub;
            }, [orgId]);

            const inRange = (dateStr) => {
                const d = dateStr.split('T')[0];
                return (!filter.from || d >= filter.from) && (!filter.to || d <= filter.to);
            };

            const filteredSales = sales.filter(s => inRange(s.date));
            const filteredExpenses = expenses.filter(e => inRange(e.date));

            const revenue = filteredSales.reduce((s, x) => s + (x.grandTotal || 0), 0);
            const cogs = filteredSales.reduce((s, x) => s + (x.cart || []).reduce((cs, item) => cs + (item.priceBuy || 0) * item.qty, 0), 0);
            const grossProfit = revenue - cogs;
            const totalExpenses = filteredExpenses.reduce((s, x) => s + (x.amount || 0), 0);
            const netProfit = grossProfit - totalExpenses;
            const margin = revenue > 0 ? ((netProfit / revenue) * 100).toFixed(1) : '0.0';

            const addExpense = async (e) => {
                e.preventDefault();
                if (!expForm.amount) return;
                await expensesRef.add({ ...expForm, amount: Number(expForm.amount), createdAt: FieldValue.serverTimestamp() });
                setExpForm({ ...expForm, amount: '', note: '' });
            };
            const deleteExpense = async (id) => {
                if (confirm('Delete this expense?')) await expensesRef.doc(id).delete();
            };

            return (
                <div className="p-6 overflow-auto">
                    <h2 className="text-xl font-bold mb-4">Profit & Loss</h2>

                    <div className="flex flex-wrap gap-4 mb-6 bg-white p-4 rounded shadow items-end">
                        <div><label className="text-xs font-bold block">From Date</label><input type="date" className="border p-2 rounded" value={filter.from} onChange={e => setFilter({ ...filter, from: e.target.value })} /></div>
                        <div><label className="text-xs font-bold block">To Date</label><input type="date" className="border p-2 rounded" value={filter.to} onChange={e => setFilter({ ...filter, to: e.target.value })} /></div>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6">
                        <div className="bg-white p-4 rounded shadow border-l-4 border-blue-500"><p className="text-xs text-gray-500">Revenue</p><h3 className="text-xl font-bold">₹{revenue.toLocaleString()}</h3></div>
                        <div className="bg-white p-4 rounded shadow border-l-4 border-gray-400"><p className="text-xs text-gray-500">Cost of Goods</p><h3 className="text-xl font-bold">₹{cogs.toLocaleString()}</h3></div>
                        <div className="bg-white p-4 rounded shadow border-l-4 border-green-500"><p className="text-xs text-gray-500">Gross Profit</p><h3 className="text-xl font-bold text-green-600">₹{grossProfit.toLocaleString()}</h3></div>
                        <div className="bg-white p-4 rounded shadow border-l-4 border-red-400"><p className="text-xs text-gray-500">Expenses</p><h3 className="text-xl font-bold text-red-600">₹{totalExpenses.toLocaleString()}</h3></div>
                        <div className={`p-4 rounded shadow border-l-4 ${netProfit >= 0 ? 'border-green-600' : 'border-red-600'}`}>
                            <p className="text-xs text-gray-500">Net Profit ({margin}%)</p>
                            <h3 className={`text-xl font-bold ${netProfit >= 0 ? 'text-green-700' : 'text-red-700'}`}>₹{netProfit.toLocaleString()}</h3>
                        </div>
                    </div>

                    <div className="bg-white p-4 rounded shadow max-w-3xl">
                        <h3 className="font-bold mb-3">Business Expenses (Rent, Salary, etc.)</h3>
                        <form onSubmit={addExpense} className="flex flex-wrap gap-2 mb-4">
                            <select className="border p-2 rounded" value={expForm.category} onChange={e => setExpForm({ ...expForm, category: e.target.value })}>
                                {EXPENSE_CATEGORIES.map(c => <option key={c}>{c}</option>)}
                            </select>
                            <input type="number" className="border p-2 rounded w-28" placeholder="Amount ₹" value={expForm.amount} onChange={e => setExpForm({ ...expForm, amount: e.target.value })} required />
                            <input type="date" className="border p-2 rounded" value={expForm.date} onChange={e => setExpForm({ ...expForm, date: e.target.value })} />
                            <input className="border p-2 rounded flex-1 min-w-[120px]" placeholder="Note (optional)" value={expForm.note} onChange={e => setExpForm({ ...expForm, note: e.target.value })} />
                            <button className="bg-orange-600 text-white px-4 rounded font-bold">Add</button>
                        </form>
                        <table className="w-full text-sm">
                            <thead className="text-left text-gray-500 border-b"><tr><th className="py-1">Date</th><th>Category</th><th>Note</th><th className="text-right">Amount</th><th></th></tr></thead>
                            <tbody>
                                {filteredExpenses.map(e => (
                                    <tr key={e.id} className="border-b">
                                        <td className="py-2">{new Date(e.date).toLocaleDateString()}</td>
                                        <td>{e.category}</td>
                                        <td className="text-gray-500">{e.note}</td>
                                        <td className="text-right font-bold">₹{e.amount.toLocaleString()}</td>
                                        <td className="text-red-500 cursor-pointer text-right" onClick={() => deleteExpense(e.id)}>x</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                        {filteredExpenses.length === 0 && <p className="text-center text-gray-400 py-4">Koi expense record nahi hai.</p>}
                    </div>
                </div>
            );
        };

        // ============================================================
        // MAIN APP (post-login, active org member)
        // ============================================================
        const MainApp = ({ firebaseUser, userDoc }) => {
            const [view, setView] = useState('pos');
            const [org, setOrg] = useState(null);
            const [products, setProducts] = useState([]);
            const [sales, setSales] = useState([]);
            const [lang, setLang] = useState(() => localStorage.getItem('buildmart_lang') || 'en');
            const orgId = userDoc.orgId;
            const isAdmin = userDoc.role === 'owner' || userDoc.role === 'admin';
            const perms = userDoc.permissions || defaultPermissions();

            const canPOS = isAdmin || perms.pos;
            const canInventory = isAdmin || perms.inventory;
            const canReports = isAdmin || perms.reports;
            const canProfit = isAdmin || perms.profit;
            const canKhata = isAdmin || perms.khata;
            const canDashboard = isAdmin || perms.dashboard;

            const changeLang = (l) => { setLang(l); localStorage.setItem('buildmart_lang', l); };

            useEffect(() => {
                const unsubOrg = db.collection('orgs').doc(orgId).onSnapshot(d => setOrg({ id: d.id, ...d.data() }));
                const unsubProd = db.collection('orgs').doc(orgId).collection('products').orderBy('name').onSnapshot(snap => setProducts(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsubSales = db.collection('orgs').doc(orgId).collection('sales').orderBy('date').onSnapshot(snap => setSales(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                return () => { unsubOrg(); unsubProd(); unsubSales(); };
            }, [orgId]);

            useEffect(() => {
                // If current view isn't accessible (e.g. permissions just changed), fall back to the first one that is.
                const allowed = { pos: canPOS, quotation: canPOS, inventory: canInventory, reports: canReports, profit: canProfit, khata: canKhata, dashboard: canDashboard, users: isAdmin, settings: isAdmin };
                if (!allowed[view]) {
                    const first = Object.keys(allowed).find(k => allowed[k]);
                    if (first) setView(first);
                }
            }, [canPOS, canInventory, canReports, canProfit, canKhata, canDashboard, isAdmin]);

            if (!org) return <div className="min-h-screen flex items-center justify-center">Loading...</div>;

            const hasAnyAccess = canPOS || canInventory || canReports || canProfit || canKhata || canDashboard || isAdmin;
            if (!hasAnyAccess) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-800">
                        <div className="bg-white p-8 rounded-lg shadow-xl w-96 text-center">
                            <h2 className="text-xl font-bold mb-2 text-red-600">Koi Access Nahi</h2>
                            <p className="text-gray-500 mb-6">Admin ne abhi tak aapko koi permission nahi di hai. Unse contact karein.</p>
                            <button onClick={() => auth.signOut()} className="bg-red-600 text-white px-4 py-2 rounded font-bold">Logout</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex h-screen overflow-hidden">
                    <div className="w-64 bg-slate-900 text-white flex flex-col no-print">
                        <div className="p-4 text-center border-b border-slate-700">
                            <h1 className="text-xl font-bold text-orange-500 truncate">{org.name}</h1>
                            {org.address && <p className="text-xs text-slate-400 truncate">{org.address}</p>}
                            <p className="text-xs mt-2 text-green-400">Welcome, {userDoc.name}</p>
                            <select value={lang} onChange={e => changeLang(e.target.value)} className="mt-2 w-full bg-slate-800 text-white text-xs p-1 rounded border border-slate-600">
                                {Object.keys(LANGUAGES).map(l => <option key={l} value={l}>{LANGUAGES[l]}</option>)}
                            </select>
                        </div>
                        <nav className="flex-1 p-2 space-y-1 overflow-auto">
                            {canDashboard && <button onClick={() => setView('dashboard')} className={`w-full text-left p-3 rounded ${view === 'dashboard' ? 'bg-slate-700' : ''}`}>{t(lang, 'nav_dashboard')}</button>}
                            {canPOS && <button onClick={() => setView('pos')} className={`w-full text-left p-3 rounded ${view === 'pos' ? 'bg-slate-700' : ''}`}>{t(lang, 'nav_pos')}</button>}
                            {canPOS && <button onClick={() => setView('quotation')} className={`w-full text-left p-3 rounded ${view === 'quotation' ? 'bg-slate-700' : ''}`}>{t(lang, 'nav_quotation')}</button>}
                            {canInventory && <button onClick={() => setView('inventory')} className={`w-full text-left p-3 rounded ${view === 'inventory' ? 'bg-slate-700' : ''}`}>{t(lang, 'nav_inventory')}</button>}
                            {canKhata && <button onClick={() => setView('khata')} className={`w-full text-left p-3 rounded ${view === 'khata' ? 'bg-slate-700' : ''}`}>{t(lang, 'nav_khata')}</button>}
                            {canReports && <button onClick={() => setView('reports')} className={`w-full text-left p-3 rounded ${view === 'reports' ? 'bg-slate-700' : ''}`}>{t(lang, 'nav_reports')}</button>}
                            {canProfit && <button onClick={() => setView('profit')} className={`w-full text-left p-3 rounded ${view === 'profit' ? 'bg-slate-700' : ''}`}>{t(lang, 'nav_profit')}</button>}
                            {isAdmin && <button onClick={() => setView('users')} className={`w-full text-left p-3 rounded ${view === 'users' ? 'bg-slate-700' : ''}`}>{t(lang, 'nav_users')}</button>}
                            {isAdmin && <button onClick={() => setView('settings')} className={`w-full text-left p-3 rounded ${view === 'settings' ? 'bg-slate-700' : ''}`}>{t(lang, 'nav_settings')}</button>}
                        </nav>
                        <button onClick={() => auth.signOut()} className="p-4 bg-red-600 hover:bg-red-700 m-2 rounded">{t(lang, 'nav_logout')}</button>
                    </div>

                    <div className="flex-1 bg-gray-100 h-full overflow-hidden flex flex-col">
                        {view === 'dashboard' && canDashboard && <Dashboard sales={sales} products={products} lang={lang} />}
                        {view === 'pos' && canPOS && <POS orgId={orgId} org={org} products={products} userDoc={userDoc} firebaseUser={firebaseUser} lang={lang} />}
                        {view === 'inventory' && canInventory && <Inventory orgId={orgId} products={products} isAdmin={isAdmin} lang={lang} />}
                        {view === 'khata' && canKhata && <KhataBook orgId={orgId} userDoc={userDoc} firebaseUser={firebaseUser} />}
                        {view === 'reports' && canReports && <SalesReport sales={sales} userDoc={userDoc} />}
                        {view === 'profit' && canProfit && <ProfitLoss orgId={orgId} sales={sales} />}
                        {view === 'quotation' && canPOS && <Quotation products={products} org={org} />}
                        {view === 'users' && isAdmin && <UserMgmt orgId={orgId} org={org} />}
                        {view === 'settings' && isAdmin && <Settings orgId={orgId} org={org} />}
                    </div>
                </div>
            );
        };

        // ============================================================
        // ROOT APP (auth state machine)
        // ============================================================
        const App = () => {
            const [authLoading, setAuthLoading] = useState(true);
            const [firebaseUser, setFirebaseUser] = useState(null);
            const [userDoc, setUserDoc] = useState(undefined); // undefined = loading, null = no profile
            const [orgNameForPending, setOrgNameForPending] = useState('');

            useEffect(() => {
                const unsub = auth.onAuthStateChanged(u => {
                    setFirebaseUser(u);
                    setAuthLoading(false);
                    if (!u) setUserDoc(undefined);
                });
                return unsub;
            }, []);

            useEffect(() => {
                if (!firebaseUser) return;
                setUserDoc(undefined);
                const unsub = db.collection('users').doc(firebaseUser.uid).onSnapshot(
                    doc => setUserDoc(doc.exists ? { id: doc.id, ...doc.data() } : null),
                    () => setUserDoc(null)
                );
                return unsub;
            }, [firebaseUser]);

            useEffect(() => {
                if (userDoc && userDoc.status === 'pending' && userDoc.orgId) {
                    db.collection('orgs').doc(userDoc.orgId).get().then(d => {
                        if (d.exists) setOrgNameForPending(d.data().name);
                    });
                }
            }, [userDoc]);

            if (authLoading) return <div className="min-h-screen flex items-center justify-center bg-slate-800 text-white">Loading...</div>;
            if (!firebaseUser) return <Login />;
            if (userDoc === undefined) return <div className="min-h-screen flex items-center justify-center bg-slate-800 text-white">Loading profile...</div>;
            if (userDoc === null) return <Onboarding user={firebaseUser} />;
            if (userDoc.status === 'pending') return <PendingApproval orgName={orgNameForPending} />;
            if (userDoc.status === 'disabled') return (
                <div className="min-h-screen flex items-center justify-center bg-slate-800">
                    <div className="bg-white p-8 rounded-lg shadow-xl w-96 text-center">
                        <h2 className="text-xl font-bold mb-2 text-red-600">Access Disabled</h2>
                        <p className="text-gray-500 mb-6">Aapka access admin ne disable kar diya hai. Unse contact karein.</p>
                        <button onClick={() => auth.signOut()} className="bg-red-600 text-white px-4 py-2 rounded font-bold">Logout</button>
                    </div>
                </div>
            );
            return <MainApp firebaseUser={firebaseUser} userDoc={userDoc} />;
        };

        // ============================================================
        // PRINT TEMPLATE GENERATOR
        // ============================================================
        function generateReceiptHTML(data, org) {
            org = org || { name: 'Business', address: '', mobile: '' };
            const isEst = data.billType === 'Estimate';
            const isQuote = data.billType === 'Quotation';

            if (!isQuote) {
                return `
                    <div class="print-thermal">
                        <center>
                            <h2 style="margin:0">${org.name.toUpperCase()}</h2>
                            <p style="margin:0; font-size:10px">${org.address || ''}</p>
                            <p style="margin:0; font-size:10px">${org.mobile ? 'Mob: ' + org.mobile : ''}</p>
                            <hr style="border-top: 1px dashed #000; margin: 5px 0;">
                            <h3 style="margin:5px 0">${isEst ? 'ESTIMATE / CHALAN' : 'TAX INVOICE'}</h3>
                        </center>
                        <div style="display:flex; justify-content:space-between; font-size:10px;">
                            <span>Bill: #${data.id.toString().slice(-6)}</span>
                            <span>Date: ${new Date(data.date).toLocaleDateString()}</span>
                        </div>
                        <div style="font-size:10px;">Customer: ${data.customer.name || 'Cash Sale'}</div>
                        <hr style="border-top: 1px dashed #000; margin: 5px 0;">
                        <table style="width:100%; text-align:left; font-size:11px;">
                            <thead><tr><th>Item</th><th style="text-align:right">Qty</th><th style="text-align:right">Amt</th></tr></thead>
                            <tbody>${data.cart.map(i => `<tr><td>${i.name}</td><td style="text-align:right">${i.qty}</td><td style="text-align:right">${i.total}</td></tr>`).join('')}</tbody>
                        </table>
                        <hr style="border-top: 1px dashed #000; margin: 5px 0;">
                        ${data.gstAmount > 0 ? `
                        <div style="display:flex; justify-content:space-between; font-size:10px;"><span>Subtotal</span><span>₹${(data.subtotal || 0).toFixed(2)}</span></div>
                        <div style="display:flex; justify-content:space-between; font-size:10px;"><span>CGST</span><span>₹${(data.gstAmount / 2).toFixed(2)}</span></div>
                        <div style="display:flex; justify-content:space-between; font-size:10px;"><span>SGST</span><span>₹${(data.gstAmount / 2).toFixed(2)}</span></div>
                        ` : ''}
                        <div style="text-align:right; font-weight:bold; font-size:14px;">Total: ₹${(data.grandTotal || 0).toFixed(2)}</div>
                        ${data.paymentMode === 'Udhar' ? '<div style="text-align:center; font-weight:bold; font-size:12px; border:1px dashed #000; padding:3px; margin-top:4px;">** UDHAR - PAYMENT PENDING **</div>' : ''}
                        <center style="margin-top:10px; font-size:10px;">** Thank You Visit Again **</center>
                    </div>`;
            }

            return `
                <div class="print-a4">
                    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #333; padding-bottom:10px;">
                        <div>
                            <h1 style="color:#e65100; margin:0;">${org.name.toUpperCase()}</h1>
                            <p style="margin:0; font-size:12px;">${org.address || ''} ${org.mobile ? '| Mob: ' + org.mobile : ''}</p>
                            ${org.gstin ? `<p style="margin:0; font-size:12px;">GSTIN: ${org.gstin}</p>` : ''}
                        </div>
                        <div style="text-align:right;">
                            <h2 style="margin:0; color:#333;">${data.billType.toUpperCase()}</h2>
                            <p>Ref: ${data.id}</p>
                            <p>Date: ${new Date(data.date).toLocaleDateString()}</p>
                        </div>
                    </div>
                    <div style="margin:20px 0; padding:10px; background:#f5f5f5; border-radius:5px;">
                        <strong>To:</strong> ${data.customer.name}<br>
                        ${data.customer.address ? data.customer.address + '<br>' : ''}
                        ${data.customer.gst ? 'GSTIN: ' + data.customer.gst : ''}
                    </div>
                    <table style="width:100%; border-collapse:collapse; margin-top:20px;">
                        <thead style="background:#333; color:white;">
                            <tr><th style="padding:10px; text-align:left;">#</th><th style="padding:10px; text-align:left;">Description</th><th style="padding:10px; text-align:center;">Qty</th><th style="padding:10px; text-align:right;">Rate</th><th style="padding:10px; text-align:right;">Total</th></tr>
                        </thead>
                        <tbody>
                            ${data.cart.map((item, index) => `
                                <tr style="border-bottom:1px solid #ddd;">
                                    <td style="padding:10px;">${index + 1}</td>
                                    <td style="padding:10px;">${item.name}</td>
                                    <td style="padding:10px; text-align:center;">${item.qty} ${item.unit}</td>
                                    <td style="padding:10px; text-align:right;">${item.price || item.priceSell}</td>
                                    <td style="padding:10px; text-align:right;">${item.total}</td>
                                </tr>`).join('')}
                        </tbody>
                    </table>
                    <div style="margin-top:20px; text-align:right;">
                        ${data.gstAmount > 0 ? `
                        <p style="margin:2px 0;">Subtotal: ₹${(data.subtotal || 0).toFixed(2)}</p>
                        <p style="margin:2px 0;">CGST: ₹${(data.gstAmount / 2).toFixed(2)} &nbsp; SGST: ₹${(data.gstAmount / 2).toFixed(2)}</p>
                        ` : ''}
                        <h3 style="margin:4px 0 0;">Grand Total: ₹${(data.grandTotal || 0).toFixed(2)}</h3>
                    </div>
                    <div style="margin-top:50px; display:flex; justify-content:space-between;">
                        <div style="border-top:1px solid #000; padding-top:5px;">Customer Signature</div>
                        <div style="border-top:1px solid #000; padding-top:5px;">Authorized Signatory</div>
                    </div>
                </div>`;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

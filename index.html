                setBusy(true);

                    const provider = new firebase.auth.GoogleAuthProvider();
                    await auth.signInWithPopup(provider);
                } catch (e) {
                    setErr(e.message);
                } finally {
                    setBusy(false);
                }
            };

            const handleStaffLogin = async (e) => {
                e.preventDefault();
                if (!username.trim() || !password) return;
                setErr('');
                setBusy(true);
                try {
                    await auth.signInWithEmailAndPassword(username.trim().toLowerCase() + STAFF_EMAIL_DOMAIN, password);
                } catch (e2) {
                    setErr('Galat username ya password.');
                } finally {
                    setBusy(false);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-slate-800">
                    <div className="bg-white p-8 rounded-lg shadow-xl w-96 text-center">
                        <h1 className="text-2xl font-bold text-slate-800 mb-1">BuildMart POS</h1>
                        <p className="text-gray-500 mb-6">Hardware & Building Material Store</p>

                        <div className="flex mb-5 border rounded overflow-hidden">
                            <button onClick={() => { setMode('google'); setErr(''); }} className={`flex-1 py-2 text-sm font-bold ${mode === 'google' ? 'bg-slate-800 text-white' : 'bg-white text-gray-500'}`}>Owner / Admin</button>
                            <button onClick={() => { setMode('staff'); setErr(''); }} className={`flex-1 py-2 text-sm font-bold ${mode === 'staff' ? 'bg-slate-800 text-white' : 'bg-white text-gray-500'}`}>Staff Login</button>
                        </div>

                        {mode === 'google' && (
                            <>
                                <button
                                    onClick={handleGoogleLogin}
                                    disabled={busy}
                                    className="w-full flex items-center justify-center gap-3 border-2 border-gray-200 hover:bg-gray-50 text-gray-700 p-3 rounded font-bold disabled:opacity-50">
                                    <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5h-1.9V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3 16.3 3 9.7 7.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 45c5.5 0 10.5-2.1 14.3-5.6l-6.6-5.6C29.6 35.6 27 36.5 24 36.5c-5.2 0-9.6-3.3-11.3-8l-6.6 5.1C9.6 40.6 16.3 45 24 45z"/><path fill="#1976D2" d="M43.6 20.5H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.6 5.6C41.4 36.6 45 30.9 45 24c0-1.4-.1-2.7-.4-3.5z"/></svg>
                                    {busy ? 'Signing in...' : 'Continue with Google'}
                                </button>
                                <p className="text-xs text-gray-400 mt-6">Naye users ko admin approval chahiye hoga.</p>
                            </>
                        )}

                        {mode === 'staff' && (
                            <form onSubmit={handleStaffLogin} className="space-y-3 text-left">
                                <div>
                                    <label className="block text-sm font-medium mb-1">Username</label>
                                    <input autoFocus autoCapitalize="off" className="w-full border p-2 rounded" value={username} onChange={e => setUsername(e.target.value)} required />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium mb-1">Password</label>
                                    <input type="password" className="w-full border p-2 rounded" value={password} onChange={e => setPassword(e.target.value)} required />
                                </div>
                                <button disabled={busy} className="w-full bg-orange-600 hover:bg-orange-700 text-white p-3 rounded font-bold disabled:opacity-50">{busy ? 'Signing in...' : 'Login'}</button>
                                <p className="text-xs text-gray-400 text-center">Ye login admin ne banaya hoga. Agar nahi hai to admin se banwayein.</p>
                            </form>
                        )}
                        {err && <p className="text-red-500 text-sm mt-3">{err}</p>}
                    </div>
                </div>
            );
        };

        // ============================================================
        // 2. ONBOARDING (first-time user: create new business OR join existing)
        // ============================================================
        // Single-business mode: no matter how many org documents technically
        // exist, the app always attaches every new sign-in to the FIRST org it
        // finds. The very first person to ever sign in creates it and becomes
        // owner; everyone after that is auto-attached as a pending staff
        // request — no invite codes, no "create another business" option.
        // (Multi-business/SaaS mode can be re-enabled later if ever needed.)
        const Onboarding = ({ user }) => {
            const [checking, setChecking] = useState(true);
            const [existingOrg, setExistingOrg] = useState(null); // { id, name } or null
            const [orgName, setOrgName] = useState('');
            const [busy, setBusy] = useState(false);
            const [err, setErr] = useState('');

            useEffect(() => {
                db.collection('orgs').limit(1).get().then(snap => {
                    if (!snap.empty) setExistingOrg({ id: snap.docs[0].id, name: snap.docs[0].data().name });
                    setChecking(false);
                });
            }, []);

            const createOrg = async (e) => {
                e.preventDefault();
                if (!orgName.trim()) return;
                setBusy(true); setErr('');
                try {
                    const orgRef = db.collection('orgs').doc();
                    await orgRef.set({
                        name: orgName.trim(), address: '', mobile: '', gstin: '',
                        ownerId: user.uid, createdAt: FieldValue.serverTimestamp()
                    });
                    await db.collection('users').doc(user.uid).set({
                        uid: user.uid, name: user.displayName || 'Owner', email: user.email,
                        photoURL: user.photoURL || '', orgId: orgRef.id,
                        role: 'owner', status: 'active', createdAt: FieldValue.serverTimestamp()
                    });
                } catch (e2) {
                    setErr(e2.message);
                    setBusy(false);
                }
            };

            const requestAccess = async () => {
                setBusy(true); setErr('');
                try {
                    await db.collection('users').doc(user.uid).set({
                        uid: user.uid, name: user.displayName || 'Staff', email: user.email,
                        photoURL: user.photoURL || '', orgId: existingOrg.id,
                        role: 'staff', status: 'pending', createdAt: FieldValue.serverTimestamp()
                    });
                } catch (e2) {
                    setErr(e2.message);
                    setBusy(false);
                }
            };

            if (checking) return <div className="min-h-screen flex items-center justify-center bg-slate-800 text-white">Loading...</div>;

            return (
                <div className="min-h-screen flex items-center justify-center bg-slate-800 p-4">
                    <div className="bg-white p-8 rounded-lg shadow-xl w-full max-w-md text-center">
                        <h2 className="text-xl font-bold mb-1">Namaste, {user.displayName}!</h2>

                        {!existingOrg && (
                            <>
                                <p className="text-gray-500 mb-6 text-sm">Aap sabse pehle login karne wale hain — apna business set up karein.</p>
                                <form onSubmit={createOrg} className="space-y-4 text-left">
                                    <label className="block text-sm font-medium">Business / Shop Ka Naam</label>
                                    <input autoFocus className="w-full border p-2 rounded" placeholder="e.g. Mirza Traders" value={orgName} onChange={e => setOrgName(e.target.value)} required />
                                    {err && <p className="text-red-500 text-sm">{err}</p>}
                                    <button disabled={busy} className="w-full bg-orange-600 hover:bg-orange-700 text-white p-3 rounded font-bold disabled:opacity-50">{busy ? 'Setting up...' : 'Business Shuru Karein'}</button>
                                </form>
                            </>
                        )}

                        {existingOrg && (
                            <>
                                <p className="text-gray-500 mb-6 text-sm"><strong>{existingOrg.name}</strong> me access ke liye admin ko request bhejein. Approve hote hi aap login kar sakenge.</p>
                                {err && <p className="text-red-500 text-sm mb-3">{err}</p>}
                                <button onClick={requestAccess} disabled={busy} className="w-full bg-blue-600 hover:bg-blue-700 text-white p-3 rounded font-bold disabled:opacity-50">
                                    {busy ? 'Sending...' : 'Access Request Bhejein'}
                                </button>
                            </>
                        )}
                    </div>
                </div>
            );
        };

        // ============================================================
        // 3. PENDING APPROVAL SCREEN
        // ============================================================
        const PendingApproval = ({ orgName }) => (
            <div className="min-h-screen flex items-center justify-center bg-slate-800">
                <div className="bg-white p-8 rounded-lg shadow-xl w-96 text-center">
                    <div className="text-5xl mb-4">⏳</div>
                    <h2 className="text-xl font-bold mb-2">Approval Pending</h2>
                    <p className="text-gray-500 mb-6">Aapka request <strong>{orgName || 'business'}</strong> ke admin ko bhej diya gaya hai. Approve hote hi aap login kar sakenge.</p>
                    <button onClick={() => auth.signOut()} className="bg-red-600 text-white px-4 py-2 rounded font-bold">Logout</button>
                </div>
            </div>
        );

        // ============================================================
        // 4. DASHBOARD
        // ============================================================
        const Dashboard = ({ sales, products, lang }) => {
            const stats = useMemo(() => {
                const totalSales = sales.reduce((sum, s) => sum + (s.grandTotal || 0), 0);
                const totalProfit = sales.reduce((sum, s) => sum + (s.totalProfit || 0), 0);
                const lowStockItems = products.filter(p => p.stock < 10).sort((a, b) => a.stock - b.stock);
                const prodMap = {};
                sales.forEach(s => (s.cart || []).forEach(c => { prodMap[c.name] = (prodMap[c.name] || 0) + c.qty; }));
                const hero = Object.entries(prodMap).sort((a, b) => b[1] - a[1])[0];

                // Category-wise breakdown: stock value, low stock count, units sold, revenue, hero product
                const catMap = {};
                const ensure = (cat) => { if (!catMap[cat]) catMap[cat] = { items: 0, stockValue: 0, lowStock: 0, unitsSold: 0, revenue: 0, heroMap: {} }; return catMap[cat]; };
                products.forEach(p => {
                    const c = ensure(p.category || 'Other');
                    c.items++;
                    c.stockValue += (p.priceBuy || 0) * p.stock;
                    if (p.stock < 10) c.lowStock++;
                });
                sales.forEach(s => (s.cart || []).forEach(item => {
                    const c = ensure(item.category || 'Other');
                    c.unitsSold += item.qty;
                    c.revenue += item.total;
                    c.heroMap[item.name] = (c.heroMap[item.name] || 0) + item.qty;
                }));
                const categoryStats = Object.entries(catMap).map(([cat, d]) => {
                    const heroSorted = Object.entries(d.heroMap).sort((a, b) => b[1] - a[1]);
                    return { category: cat, items: d.items, stockValue: d.stockValue, lowStock: d.lowStock, unitsSold: d.unitsSold, revenue: d.revenue, hero: heroSorted[0] ? heroSorted[0][0] : '—' };
                }).sort((a, b) => b.revenue - a.revenue);

                return { totalSales, totalProfit, lowStockItems, hero: hero ? hero[0] : 'None', categoryStats };
            }, [sales, products]);

            return (
                <div className="p-6 overflow-auto">
                    <h2 className="text-2xl font-bold mb-6">Business Overview</h2>
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                        <div className="bg-white p-4 rounded shadow border-l-4 border-blue-500">
                            <p className="text-gray-500">Total Revenue</p>
                            <h3 className="text-2xl font-bold">₹{stats.totalSales.toLocaleString()}</h3>
                        </div>
                        <div className="bg-white p-4 rounded shadow border-l-4 border-green-500">
                            <p className="text-gray-500">Net Profit</p>
                            <h3 className="text-2xl font-bold text-green-600">₹{stats.totalProfit.toLocaleString()}</h3>
                        </div>
                        <div className="bg-white p-4 rounded shadow border-l-4 border-red-500">
                            <p className="text-gray-500">Low Stock Items</p>
                            <h3 className="text-2xl font-bold text-red-600">{stats.lowStockItems.length}</h3>
                        </div>
                        <div className="bg-white p-4 rounded shadow border-l-4 border-yellow-500">
                            <p className="text-gray-500">Top Selling (Hero)</p>
                            <h3 className="text-lg font-bold truncate">{stats.hero}</h3>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                        <div className="bg-white rounded shadow overflow-hidden">
                            <div className="p-3 bg-gray-50 border-b font-bold">Category Performance</div>
                            <table className="w-full text-sm">
                                <thead className="text-left text-gray-500 border-b">
                                    <tr><th className="p-2">Category</th><th className="p-2">Stock Value</th><th className="p-2">Low</th><th className="p-2">Sold</th><th className="p-2">Revenue</th><th className="p-2">Hero</th></tr>
                                </thead>
                                <tbody>
                                    {stats.categoryStats.map(c => (
                                        <tr key={c.category} className="border-b hover:bg-gray-50">
                                            <td className="p-2 font-bold">{catLabel(lang, c.category)}</td>
                                            <td className="p-2">₹{c.stockValue.toLocaleString()}</td>
                                            <td className={`p-2 font-bold ${c.lowStock > 0 ? 'text-red-600' : 'text-gray-400'}`}>{c.lowStock}</td>
                                            <td className="p-2">{c.unitsSold}</td>
                                            <td className="p-2 font-bold">₹{c.revenue.toLocaleString()}</td>
                                            <td className="p-2 text-xs truncate max-w-[120px]" title={c.hero}>{c.hero}</td>
                                        </tr>
                                    ))}
                                    {stats.categoryStats.length === 0 && <tr><td colSpan="6" className="p-4 text-center text-gray-400">Koi data nahi hai abhi.</td></tr>}
                                </tbody>
                            </table>
                        </div>

                        <div className="bg-white rounded shadow overflow-hidden">
                            <div className="p-3 bg-gray-50 border-b font-bold text-red-600">⚠ Low Stock Alert (&lt; 10)</div>
                            <div className="max-h-80 overflow-auto">
                                {stats.lowStockItems.map(p => (
                                    <div key={p.id} className="flex justify-between items-center p-2 border-b text-sm">
                                        <div>
                                            <div className="font-bold">{p.name}</div>
                                            <div className="text-xs text-gray-500">{catLabel(lang, p.category)}{p.brand ? ' · ' + p.brand : ''}</div>
                                        </div>
                                        <div className="text-red-600 font-bold">{p.stock} {unitLabel(lang, p.unit)}</div>
                                    </div>
                                ))}
                                {stats.lowStockItems.length === 0 && <div className="p-4 text-center text-gray-400 text-sm">Sab stock theek hai 👍</div>}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // ============================================================
        // 5. INVENTORY (Firestore-backed)
        // ============================================================
        const Inventory = ({ orgId, products, isAdmin, lang }) => {
            const [form, setForm] = useState({ name: '', category: 'Hardware', unit: 'Pcs', priceBuy: '', priceSell: '', stock: '', gst: 18, discount: 0, brand: '', spec: '' });
            const [search, setSearch] = useState('');
            const [suggestions, setSuggestions] = useState([]);
            const [restockProd, setRestockProd] = useState(null); // set when an existing product is picked
            const [supplier, setSupplier] = useState({ name: '', mobile: '' });
            const [purchaseMode, setPurchaseMode] = useState('Cash'); // Cash | Udhar (admin only, tracks supplier khata)
            const [purchaseGstIncluded, setPurchaseGstIncluded] = useState(false); // is GST already included in Purchase Rate?
            const [quickBase, setQuickBase] = useState(''); // base item picked from catalog, e.g. "TMT Steel Bar"
            const nameRef = useRef();

            const productsRef = db.collection('orgs').doc(orgId).collection('products');
            const catalogEntry = CATALOG[form.category];

            const resetForm = () => {
                setForm({ name: '', category: 'Hardware', unit: 'Pcs', priceBuy: '', priceSell: '', stock: '', gst: 18, discount: 0, brand: '', spec: '' });
                setRestockProd(null);
                setSuggestions([]);
                setSupplier({ name: '', mobile: '' });
                setPurchaseMode('Cash');
                setPurchaseGstIncluded(false);
                setQuickBase('');
            };

            // Recompute the final product name whenever spec/brand/base item change
            const composeName = (base, spec, brand) => [spec, base, brand ? `- ${brand}` : ''].filter(Boolean).join(' ').trim();

            const handleCategoryChange = (cat) => {
                const entry = CATALOG[cat];
                setForm({ ...form, category: cat, unit: (entry && !restockProd) ? entry.unit : form.unit, gst: (entry && !restockProd) ? entry.gst : form.gst });
                setQuickBase('');
            };

            const pickQuickItem = (item) => {
                setQuickBase(item);
                setForm({ ...form, name: item });
            };

            const updateSpecOrBrand = (field, val) => {
                const cleanVal = val === '__other__' ? '' : val;
                const next = { ...form, [field]: cleanVal };
                if (quickBase) next.name = composeName(quickBase, next.spec, next.brand);
                setForm(next);
            };

            const handleNameChange = (val) => {
                setForm({ ...form, name: val });
                setQuickBase(''); // manual typing overrides quick-pick composition
                if (restockProd && val !== restockProd.name) setRestockProd(null); // typing again = fresh search
                if (val.trim().length > 1) {
                    setSuggestions(products.filter(p => p.name.toLowerCase().includes(val.toLowerCase())).slice(0, 6));
                } else {
                    setSuggestions([]);
                }
            };

            const pickSuggestion = (p) => {
                setForm({
                    name: p.name, category: p.category, unit: p.unit,
                    priceBuy: p.priceBuy, priceSell: p.priceSell,
                    stock: '', gst: p.gst, discount: p.discount,
                    brand: p.brand || '', spec: p.spec || ''
                });
                setRestockProd(p);
                setSuggestions([]);
                setQuickBase('');
            };

            const handleAdd = async (e) => {
                e.preventDefault();
                if (!form.name || !form.priceSell) return;

                const stockQty = Number(form.stock) || 0;
                const buyRate = Number(form.priceBuy) || 0;
                const gstPct = Number(form.gst) || 0;
                const purchaseCost = buyRate * stockQty;
                const purchaseGstAmt = purchaseGstIncluded ? 0 : purchaseCost * (gstPct / 100);
                const purchaseTotal = purchaseCost + purchaseGstAmt; // what's actually payable to the supplier
                const isSupplierUdhar = isAdmin && purchaseMode === 'Udhar' && supplier.name.trim() && stockQty > 0;

                let supplierPartyRef = null;
                if (isSupplierUdhar) {
                    const partiesRef = db.collection('orgs').doc(orgId).collection('parties');
                    let existing = null;
                    if (supplier.mobile) {
                        const snap = await partiesRef.where('type', '==', 'supplier').where('mobile', '==', supplier.mobile).limit(1).get();
                        if (!snap.empty) existing = snap.docs[0];
                    }
                    supplierPartyRef = existing ? existing.ref : partiesRef.doc();
                }

                const batch = db.batch();
                const productRef = restockProd ? productsRef.doc(restockProd.id) : productsRef.doc();

                if (restockProd) {
                    batch.update(productRef, {
                        category: form.category, unit: form.unit, brand: form.brand || '', spec: form.spec || '',
                        priceBuy: buyRate, priceSell: Number(form.priceSell),
                        gst: gstPct, discount: Number(form.discount) || 0,
                        stock: FieldValue.increment(stockQty)
                    });
                } else {
                    batch.set(productRef, {
                        name: form.name, category: form.category, unit: form.unit, brand: form.brand || '', spec: form.spec || '',
                        priceBuy: buyRate, priceSell: Number(form.priceSell),
                        stock: stockQty, gst: gstPct, discount: Number(form.discount) || 0,
                        createdAt: FieldValue.serverTimestamp()
                    });
                }

                if (isSupplierUdhar) {
                    batch.set(supplierPartyRef, {
                        name: supplier.name, mobile: supplier.mobile || '', type: 'supplier',
                        balance: FieldValue.increment(purchaseTotal),
                        createdAt: FieldValue.serverTimestamp()
                    }, { merge: true });
                    const txnRef = supplierPartyRef.collection('transactions').doc();
                    batch.set(txnRef, {
                        type: 'purchase_credit', amount: purchaseTotal,
                        note: `${form.name} x ${stockQty} ${form.unit}${purchaseGstAmt > 0 ? ` (incl. GST ₹${purchaseGstAmt.toFixed(2)})` : ''}`,
                        date: new Date().toISOString(), createdAt: FieldValue.serverTimestamp()
                    });
                }

                await batch.commit();
                resetForm();
                nameRef.current.focus();
            };

            const handleDelete = async (id) => {
                if (!isAdmin) return alert('Access Denied');
                if (confirm('Delete product?')) await productsRef.doc(id).delete();
            };

            const filtered = products.filter(p => p.name.toLowerCase().includes(search.toLowerCase()) || p.category.toLowerCase().includes(search.toLowerCase()) || (p.brand || '').toLowerCase().includes(search.toLowerCase()));

            return (
                <div className="p-4 h-full overflow-auto">
                    <div className="bg-white p-4 rounded shadow mb-6">
                        <div className="flex justify-between items-center mb-2">
                            <h3 className="font-bold">{restockProd ? `${t(lang, 'inv_restocking')}: ${restockProd.name}` : t(lang, 'inv_addNew')}</h3>
                            {restockProd && <button type="button" onClick={resetForm} className="text-xs bg-gray-200 px-2 py-1 rounded">{t(lang, 'inv_newProduct')}</button>}
                        </div>
                        {restockProd && (
                            <div className="text-xs bg-blue-50 text-blue-700 border border-blue-200 rounded p-2 mb-3">
                                Ye material pehle se hai (Current Stock: {restockProd.stock} {unitLabel(lang, restockProd.unit)}). Neeche jo quantity daloge wo isme <strong>add</strong> ho jayegi — naya duplicate item nahi banega.
                            </div>
                        )}

                        {/* Category selector first, so Quick Pick can react to it */}
                        <div className="mb-3">
                            <label className="text-xs font-bold text-gray-500 block mb-1">{t(lang, 'inv_category')}</label>
                            <div className="flex flex-wrap gap-1">
                                {CATEGORIES.map(c => (
                                    <button type="button" key={c} onClick={() => handleCategoryChange(c)}
                                        className={`px-3 py-1 rounded-full text-sm border ${form.category === c ? 'bg-orange-600 text-white border-orange-600' : 'bg-white text-gray-600'}`}>
                                        {catLabel(lang, c)}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {!restockProd && catalogEntry && (
                            <div className="mb-3 bg-orange-50 border border-orange-200 rounded p-3">
                                <p className="text-xs font-bold text-orange-700 mb-2">{t(lang, 'inv_quickPick')}</p>
                                <div className="flex flex-wrap gap-1 mb-2">
                                    {catalogEntry.items.map(it => (
                                        <button type="button" key={it} onClick={() => pickQuickItem(it)}
                                            className={`px-2 py-1 rounded text-xs border ${quickBase === it ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-700 hover:bg-blue-50'}`}>
                                            {itemLabel(lang, it)}
                                        </button>
                                    ))}
                                </div>
                                {quickBase && (
                                    <div className="grid grid-cols-2 gap-2">
                                        <select className="border p-2 rounded text-sm" value={form.spec} onChange={e => updateSpecOrBrand('spec', e.target.value)}>
                                            <option value="">{t(lang, 'inv_spec')}...</option>
                                            {catalogEntry.specs.map(s => <option key={s} value={s}>{s}</option>)}
                                            <option value="__other__">{t(lang, 'inv_other')}</option>
                                        </select>
                                        <select className="border p-2 rounded text-sm" value={form.brand} onChange={e => updateSpecOrBrand('brand', e.target.value)}>
                                            <option value="">{t(lang, 'inv_brand')}...</option>
                                            {catalogEntry.brands.map(b => <option key={b} value={b}>{b}</option>)}
                                            <option value="__other__">{t(lang, 'inv_other')}</option>
                                        </select>
                                    </div>
                                )}
                            </div>
                        )}

                        <form onSubmit={handleAdd} className="grid grid-cols-2 md:grid-cols-4 gap-4">
                            <div className="relative">
                                <input ref={nameRef} autoComplete="off" placeholder={t(lang, 'inv_productName')} className="border p-2 rounded w-full" value={form.name} onChange={e => handleNameChange(e.target.value)} required />
                                {suggestions.length > 0 && (
                                    <div className="absolute top-full left-0 w-full bg-white border shadow-lg z-20 max-h-48 overflow-auto rounded-b">
                                        {suggestions.map(p => (
                                            <div key={p.id} onClick={() => pickSuggestion(p)} className="p-2 hover:bg-blue-50 cursor-pointer text-sm border-b last:border-b-0">
                                                <div className="font-bold">{p.name}</div>
                                                <div className="text-xs text-gray-500">{catLabel(lang, p.category)} · Stock: {p.stock} {unitLabel(lang, p.unit)} · ₹{p.priceSell}</div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                            <input placeholder={t(lang, 'inv_brand')} className="border p-2 rounded" value={form.brand} onChange={e => updateSpecOrBrand('brand', e.target.value)} list="brand-list" />
                            <input placeholder={t(lang, 'inv_spec')} className="border p-2 rounded" value={form.spec} onChange={e => updateSpecOrBrand('spec', e.target.value)} list="spec-list" />
                            <select className="border p-2 rounded" value={form.unit} onChange={e => setForm({ ...form, unit: e.target.value })}>
                                {UNITS.map(u => <option key={u} value={u}>{unitLabel(lang, u)}</option>)}
                            </select>
                            {isAdmin && <input type="number" placeholder={t(lang, 'inv_purchaseRate')} className="border p-2 rounded" value={form.priceBuy} onChange={e => setForm({ ...form, priceBuy: e.target.value })} />}
                            <input type="number" placeholder={t(lang, 'inv_sellRate')} className="border p-2 rounded" value={form.priceSell} onChange={e => setForm({ ...form, priceSell: e.target.value })} required />
                            <input type="number" placeholder={restockProd ? t(lang, 'inv_addStockQty') : t(lang, 'inv_initialStock')} className="border p-2 rounded" value={form.stock} onChange={e => setForm({ ...form, stock: e.target.value })} />
                            <div className="flex gap-2">
                                <input type="number" placeholder={t(lang, 'inv_gst')} className="border p-2 rounded w-1/2" value={form.gst} onChange={e => setForm({ ...form, gst: e.target.value })} />
                                <input type="number" placeholder={t(lang, 'inv_disc')} className="border p-2 rounded w-1/2" value={form.discount} onChange={e => setForm({ ...form, discount: e.target.value })} />
                            </div>
                            <button type="submit" className={`p-2 rounded text-white font-bold ${restockProd ? 'bg-blue-600 hover:bg-blue-700' : 'bg-green-600 hover:bg-green-700'}`}>
                                {restockProd ? t(lang, 'inv_addStockBtn') : t(lang, 'inv_addBtn')}
                            </button>
                        </form>
                        <datalist id="brand-list">{(catalogEntry ? catalogEntry.brands : []).map(b => <option key={b} value={b} />)}</datalist>
                        <datalist id="spec-list">{(catalogEntry ? catalogEntry.specs : []).map(s => <option key={s} value={s} />)}</datalist>

                        {isAdmin && Number(form.stock) > 0 && (
                            <div className="mt-3 pt-3 border-t">
                                <div className="flex items-center gap-3 flex-wrap">
                                    <span className="text-xs font-bold text-gray-600">{t(lang, 'inv_purchaseVia')}</span>
                                    <select className={`border p-1 rounded text-sm font-bold ${purchaseMode === 'Udhar' ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`} value={purchaseMode} onChange={e => setPurchaseMode(e.target.value)}>
                                        <option value="Cash">{t(lang, 'inv_cash')}</option>
                                        <option value="Udhar">{t(lang, 'inv_udhar')}</option>
                                    </select>
                                    {purchaseMode === 'Udhar' && (
                                        <>
                                            <input className="border p-1 rounded text-sm" placeholder={t(lang, 'inv_supplierName')} value={supplier.name} onChange={e => setSupplier({ ...supplier, name: e.target.value })} />
                                            <input className="border p-1 rounded text-sm" placeholder={t(lang, 'inv_supplierMobile')} value={supplier.mobile} onChange={e => setSupplier({ ...supplier, mobile: e.target.value })} />
                                        </>
                                    )}
                                </div>

                                {Number(form.priceBuy) > 0 && (() => {
                                    const qty = Number(form.stock) || 0;
                                    const rate = Number(form.priceBuy) || 0;
                                    const gstPct = Number(form.gst) || 0;
                                    const cost = rate * qty;
                                    const gstAmt = purchaseGstIncluded ? 0 : cost * (gstPct / 100);
                                    const total = cost + gstAmt;
                                    return (
                                        <div className="mt-2 bg-yellow-50 border border-yellow-200 rounded p-2 text-sm">
                                            <label className="flex items-center gap-2 text-xs text-gray-600 mb-2 cursor-pointer">
                                                <input type="checkbox" checked={purchaseGstIncluded} onChange={e => setPurchaseGstIncluded(e.target.checked)} />
                                                Purchase Rate me GST already included hai (supplier alag se GST nahi jodega)
                                            </label>
                                            <div className="flex justify-between"><span>Subtotal ({qty} × ₹{rate})</span><span>₹{cost.toLocaleString()}</span></div>
                                            {!purchaseGstIncluded && <div className="flex justify-between"><span>+ GST ({gstPct}%)</span><span>₹{gstAmt.toFixed(2)}</span></div>}
                                            <div className="flex justify-between font-bold border-t mt-1 pt-1"><span>Total Purchase Bill</span><span>₹{total.toLocaleString()}</span></div>
                                        </div>
                                    );
                                })()}

                                {purchaseMode === 'Udhar' && supplier.name.trim() && Number(form.priceBuy) > 0 && (
                                    <p className="text-xs text-red-600 mt-2">Ye poori total amount (GST sahit) <strong>{supplier.name}</strong> ke Khata Book me "payable" ke roop me add hogi.</p>
                                )}
                            </div>
                        )}
                    </div>

                    <div className="bg-white rounded shadow overflow-hidden">
                        <div className="p-3 bg-gray-50 border-b flex justify-between">
                            <h3 className="font-bold">{t(lang, 'inv_list')} ({products.length})</h3>
                            <input placeholder={t(lang, 'inv_search')} className="border p-1 rounded" value={search} onChange={e => setSearch(e.target.value)} />
                        </div>
                        <table className="w-full text-sm text-left">
                            <thead className="bg-gray-100">
                                <tr>
                                    <th className="p-2">{t(lang, 'inv_name')}</th>
                                    <th className="p-2">{t(lang, 'inv_brand')}</th>
                                    <th className="p-2">{t(lang, 'inv_spec')}</th>
                                    <th className="p-2">{t(lang, 'inv_category')}</th>
                                    <th className="p-2">{t(lang, 'inv_stock')}</th>
                                    <th className="p-2">{t(lang, 'inv_sellRateCol')}</th>
                                    <th className="p-2">{t(lang, 'inv_discCol')}</th>
                                    <th className="p-2">{t(lang, 'inv_action')}</th>
                                </tr>
                            </thead>
                            <tbody>
                                {filtered.map(p => (
                                    <tr key={p.id} className="border-b hover:bg-gray-50">
                                        <td className="p-2 font-bold">{p.name}</td>
                                        <td className="p-2 text-gray-600">{p.brand || '—'}</td>
                                        <td className="p-2 text-gray-600">{p.spec || '—'}</td>
                                        <td className="p-2">{catLabel(lang, p.category)}</td>
                                        <td className={`p-2 font-bold ${p.stock < 10 ? 'text-red-600' : 'text-green-600'}`}>{p.stock} {unitLabel(lang, p.unit)}</td>
                                        <td className="p-2">₹{p.priceSell}</td>
                                        <td className="p-2">{p.discount}%</td>
                                        <td className="p-2">{isAdmin && <button onClick={() => handleDelete(p.id)} className="text-red-500 hover:text-red-700">{t(lang, 'inv_delete')}</button>}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        // ============================================================
        // 6. POS / BILLING
        // ============================================================
        const POS = ({ orgId, org, products, userDoc, firebaseUser, lang }) => {
            const [cart, setCart] = useState([]);
            const [query, setQuery] = useState('');
            const [catFilter, setCatFilter] = useState('All');
            const [selectedProd, setSelectedProd] = useState(null);
            const [qtyInput, setQtyInput] = useState('');
            const [discInput, setDiscInput] = useState('');
            const [billType, setBillType] = useState('Estimate');
            const [paymentMode, setPaymentMode] = useState('Cash'); // Cash | Udhar
            const [customer, setCustomer] = useState({ name: '', mobile: '', gst: '', address: '' });
            const [saving, setSaving] = useState(false);

            const searchRef = useRef();
            const qtyRef = useRef();

            useEffect(() => {
                const handleKey = (e) => {
                    if (e.key === 'F2') { e.preventDefault(); searchRef.current && searchRef.current.focus(); }
                    if (e.key === 'F9') { e.preventDefault(); completeSale(true); }
                    if (e.key === 'F8') { e.preventDefault(); completeSale(false); }
                };
                window.addEventListener('keydown', handleKey);
                return () => window.removeEventListener('keydown', handleKey);
            }, [cart, customer]);

            // Always show a browsable list: filter by typed search AND/OR selected category chip.
            // (Previously nothing showed until you typed — now staff can browse type-wise too.)
            const filteredProducts = products
                .filter(p => !query || p.name.toLowerCase().includes(query.toLowerCase()) || (p.brand || '').toLowerCase().includes(query.toLowerCase()))
                .filter(p => catFilter === 'All' || p.category === catFilter)
                .sort((a, b) => a.category === b.category ? a.name.localeCompare(b.name) : a.category.localeCompare(b.category));

            const categoriesInStock = ['All', ...CATEGORIES.filter(c => products.some(p => p.category === c))];

            const addToCart = (e) => {
                e.preventDefault();
                if (!qtyInput || Number(qtyInput) <= 0) return;
                const qty = Number(qtyInput);
                if (selectedProd.stock < qty) { alert(`Stock kam hai! Available: ${selectedProd.stock}`); return; }
                const disc = discInput === '' ? 0 : Number(discInput);
                const finalPrice = selectedProd.priceSell - (selectedProd.priceSell * (disc / 100));
                const newItem = { ...selectedProd, qty, discount: disc, finalPrice, total: finalPrice * qty, profit: (finalPrice - selectedProd.priceBuy) * qty };
                setCart([...cart, newItem]);
                setSelectedProd(null); setQtyInput(''); setDiscInput(''); setQuery('');
                searchRef.current.focus();
            };

            const selectProduct = (prod) => {
                setSelectedProd(prod);
                setQtyInput('');
                setDiscInput(prod.discount || 0); // pre-fill with product's default discount, but staff can change it for this sale
                setTimeout(() => qtyRef.current && qtyRef.current.focus(), 100);
            };

            const fetchGST = () => {
                if (customer.gst.length === 15) {
                    setCustomer(prev => ({ ...prev, name: prev.name || 'Customer (verify GST manually)' }));
                }
            };

            const completeSale = async (shouldPrint) => {
                if (cart.length === 0) return alert('Cart Empty!');
                if (paymentMode === 'Udhar' && !customer.name.trim()) { alert('Udhar ke liye Customer Name daalna zaroori hai!'); return; }
                if (saving) return;
                setSaving(true);
                try {
                    const subtotal = cart.reduce((sum, item) => sum + item.total, 0);
                    const gstAmount = billType === 'Tax Invoice' ? cart.reduce((sum, item) => sum + item.total * ((item.gst || 0) / 100), 0) : 0;
                    const grandTotal = subtotal + gstAmount;
                    const totalProfit = cart.reduce((sum, item) => sum + (item.profit || 0), 0);
                    const saleData = {
                        date: new Date().toISOString(),
                        createdAt: FieldValue.serverTimestamp(),
                        customer, cart, subtotal, gstAmount, grandTotal, totalProfit, billType, paymentMode,
                        printed: shouldPrint,
                        staffUid: firebaseUser.uid,
                        staffName: userDoc.name,
                        staffEmail: userDoc.email
                    };

                    // If Udhar (credit) sale, find-or-create the customer's khata party
                    let partyRef = null;
                    if (paymentMode === 'Udhar') {
                        const partiesRef = db.collection('orgs').doc(orgId).collection('parties');
                        let existing = null;
                        if (customer.mobile) {
                            const snap = await partiesRef.where('type', '==', 'customer').where('mobile', '==', customer.mobile).limit(1).get();
                            if (!snap.empty) existing = snap.docs[0];
                        }
                        partyRef = existing ? existing.ref : partiesRef.doc();
                    }

                    const batch = db.batch();
                    cart.forEach(item => {
                        const ref = db.collection('orgs').doc(orgId).collection('products').doc(item.id);
                        batch.update(ref, { stock: FieldValue.increment(-item.qty) });
                    });
                    const saleRef = db.collection('orgs').doc(orgId).collection('sales').doc();
                    batch.set(saleRef, { ...saleData, partyId: partyRef ? partyRef.id : null });

                    if (partyRef) {
                        batch.set(partyRef, {
                            name: customer.name, mobile: customer.mobile || '', type: 'customer',
                            balance: FieldValue.increment(grandTotal),
                            createdAt: FieldValue.serverTimestamp()
                        }, { merge: true });
                        const txnRef = partyRef.collection('transactions').doc();
                        batch.set(txnRef, {
                            type: 'sale_credit', amount: grandTotal, note: `Bill #${saleRef.id.slice(-6)}`,
                            billId: saleRef.id, date: new Date().toISOString(), createdAt: FieldValue.serverTimestamp(),
                            staffUid: firebaseUser.uid, staffName: userDoc.name
                        });
                    }

                    // Sale is ALWAYS saved to Firestore regardless of whether it's printed —
                    // printing is just an optional extra step on top.
                    await batch.commit();

                    if (shouldPrint) {
                        document.getElementById('print-content').innerHTML = generateReceiptHTML({ ...saleData, id: saleRef.id }, org);
                        window.print();
                    }

                    setCart([]); setCustomer({ name: '', mobile: '', gst: '', address: '' }); setQuery(''); setPaymentMode('Cash');
                } catch (e) {
                    alert('Error: ' + e.message);
                } finally {
                    setSaving(false);
                }
            };

            const totals = useMemo(() => {
                const subtotal = cart.reduce((s, i) => s + i.total, 0);
                const gstAmount = billType === 'Tax Invoice' ? cart.reduce((s, i) => s + i.total * ((i.gst || 0) / 100), 0) : 0;
                return { subtotal, gstAmount, grandTotal: subtotal + gstAmount };
            }, [cart, billType]);

            return (
                <div className="flex h-full gap-4 p-4">
                    <div className="w-2/3 bg-white rounded shadow p-4 flex flex-col">
                        <div className="flex gap-2 mb-3">
                            <input ref={searchRef} className="flex-1 border-2 border-blue-500 rounded p-3 text-lg" placeholder="F2: Search Product (Cement, Pipe...)" value={query} onChange={e => setQuery(e.target.value)} />
                        </div>
                        <div className="flex flex-wrap gap-1 mb-3">
                            {categoriesInStock.map(c => (
                                <button key={c} onClick={() => setCatFilter(c)}
                                    className={`px-3 py-1 rounded-full text-sm border ${catFilter === c ? 'bg-orange-600 text-white border-orange-600' : 'bg-white text-gray-600 hover:bg-gray-50'}`}>
                                    {c === 'All' ? 'Sab' : catLabel(lang || 'en', c)}
                                </button>
                            ))}
                        </div>
                        <div className="flex-1 overflow-auto grid grid-cols-2 md:grid-cols-3 gap-3 content-start">
                            {filteredProducts.length > 0 ? filteredProducts.map(p => (
                                <div key={p.id} onClick={() => selectProduct(p)} className={`cursor-pointer border p-3 rounded hover:bg-blue-50 transition flex justify-between items-center ${p.stock < 5 ? 'bg-red-50' : ''}`}>
                                    <div>
                                        <div className="font-bold">{p.name}</div>
                                        <div className="text-xs text-gray-500">{catLabel(lang || 'en', p.category)}{p.brand ? ' · ' + p.brand : ''} | {p.stock} {unitLabel(lang || 'en', p.unit)}</div>
                                    </div>
                                    <div className="text-blue-600 font-bold">₹{p.priceSell}</div>
                                </div>
                            )) : (
                                <div className="col-span-3 text-center text-gray-400 mt-10">
                                    {products.length === 0 ? 'Inventory me abhi koi material nahi hai — pehle Inventory se add karo.' : 'Koi match nahi mila.'}
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="w-1/3 bg-gray-50 rounded shadow flex flex-col border-l">
                        <div className="p-3 bg-slate-800 text-white rounded-t flex justify-between items-center">
                            <h2 className="font-bold">Billing Details</h2>
                            {paymentMode === 'Udhar' && <span className="text-xs bg-red-500 px-2 py-1 rounded font-bold">UDHAR</span>}
                        </div>
                        <div className="p-3 space-y-2 bg-white">
                            <div className="flex gap-2">
                                <select className="border p-1 rounded text-sm font-bold bg-yellow-100" value={billType} onChange={e => setBillType(e.target.value)}>
                                    <option>Estimate</option><option>Tax Invoice</option>
                                </select>
                                <select className={`border p-1 rounded text-sm font-bold ${paymentMode === 'Udhar' ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`} value={paymentMode} onChange={e => setPaymentMode(e.target.value)}>
                                    <option value="Cash">Cash</option>
                                    <option value="Udhar">Udhar (Credit)</option>
                                </select>
                            </div>
                            <input className="border p-1 rounded w-full text-sm" placeholder={paymentMode === 'Udhar' ? 'Customer Name (zaroori)' : 'Customer Name'} value={customer.name} onChange={e => setCustomer({ ...customer, name: e.target.value })} />
                            {(paymentMode === 'Udhar' || billType === 'Tax Invoice') && (
                                <div className="flex gap-1">
                                    {billType === 'Tax Invoice' && <input className="border p-1 rounded text-sm w-2/3" placeholder="GSTIN" value={customer.gst} onChange={e => setCustomer({ ...customer, gst: e.target.value })} onBlur={fetchGST} />}
                                    <input className={`border p-1 rounded text-sm ${billType === 'Tax Invoice' ? 'w-1/3' : 'w-full'}`} placeholder="Mobile" value={customer.mobile} onChange={e => setCustomer({ ...customer, mobile: e.target.value })} />
                                </div>
                            )}
                            <p className="text-xs text-gray-400">
                                {billType === 'Tax Invoice'
                                    ? 'Tax Invoice: har item ke GST% ke hisaab se bill me tax apne aap add ho jayega.'
                                    : 'Estimate: bina GST ke, sirf rate × qty (no tax added).'}
                            </p>
                        </div>
                        <div className="flex-1 overflow-auto p-2">
                            <table className="w-full text-sm">
                                <thead className="text-gray-500 border-b"><tr><th className="text-left">Item</th><th className="w-12">Qty</th><th className="text-right">Total</th><th className="w-6"></th></tr></thead>
                                <tbody>
                                    {cart.map((item, idx) => (
                                        <tr key={idx} className="border-b">
                                            <td className="py-2"><div className="font-bold">{item.name}</div><div className="text-xs text-gray-500">₹{item.finalPrice}</div></td>
                                            <td>{item.qty}</td>
                                            <td className="text-right font-bold">₹{item.total}</td>
                                            <td className="text-red-500 cursor-pointer" onClick={() => setCart(cart.filter((_, i) => i !== idx))}>x</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                        <div className="p-4 bg-white border-t">
                            {billType === 'Tax Invoice' && totals.gstAmount > 0 && (
                                <div className="text-sm text-gray-500 space-y-0.5 mb-2">
                                    <div className="flex justify-between"><span>Subtotal</span><span>₹{totals.subtotal.toFixed(2)}</span></div>
                                    <div className="flex justify-between"><span>CGST</span><span>₹{(totals.gstAmount / 2).toFixed(2)}</span></div>
                                    <div className="flex justify-between"><span>SGST</span><span>₹{(totals.gstAmount / 2).toFixed(2)}</span></div>
                                </div>
                            )}
                            <div className="flex justify-between items-center mb-4">
                                <span className="text-gray-500">Total Items: {cart.length}</span>
                                <span className="text-3xl font-bold text-slate-800">₹{totals.grandTotal.toFixed(2)}</span>
                            </div>
                            <div className="grid grid-cols-2 gap-2">
                                <button onClick={() => completeSale(false)} disabled={saving} className="w-full bg-slate-700 hover:bg-slate-800 text-white py-3 rounded font-bold shadow disabled:opacity-50">
                                    {saving ? 'Saving...' : 'Save Only (F8)'}
                                </button>
                                <button onClick={() => completeSale(true)} disabled={saving} className={`w-full text-white py-3 rounded font-bold shadow disabled:opacity-50 ${paymentMode === 'Udhar' ? 'bg-red-600 hover:bg-red-700' : 'bg-green-600 hover:bg-green-700'}`}>
                                    {saving ? 'Saving...' : (paymentMode === 'Udhar' ? 'Save as Udhar (F9)' : 'Print & Save (F9)')}
                                </button>
                            </div>
                            <p className="text-xs text-gray-400 text-center mt-2">"Save Only" se bill data hamesha save hota hai — print karna zaroori nahi hai.</p>
                        </div>
                    </div>

                    {selectedProd && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
                            <form onSubmit={addToCart} className="bg-white p-6 rounded shadow-xl w-80">
                                <h3 className="font-bold text-lg mb-2">{selectedProd.name}</h3>
                                <div className="flex justify-between text-sm text-gray-600 mb-4"><span>Stock: {selectedProd.stock}</span><span>Rate: ₹{selectedProd.priceSell}</span></div>
                                <label className="block text-sm font-bold mb-1">Enter Quantity ({selectedProd.unit})</label>
                                <input ref={qtyRef} type="number" step="0.01" className="w-full border-2 border-blue-500 rounded p-2 text-2xl font-bold text-center mb-3" value={qtyInput} onChange={e => setQtyInput(e.target.value)} />
                                <label className="block text-sm font-bold mb-1">Discount % (is sale ke liye)</label>
                                <input type="number" step="0.01" min="0" max="100" className="w-full border-2 border-orange-400 rounded p-2 text-lg font-bold text-center mb-2" value={discInput} onChange={e => setDiscInput(e.target.value)} />
                                {qtyInput && Number(qtyInput) > 0 && (
                                    <p className="text-center text-sm text-gray-600 mb-3">
                                        Final Rate: ₹{(selectedProd.priceSell - selectedProd.priceSell * ((Number(discInput) || 0) / 100)).toFixed(2)} ×  {qtyInput} = <strong>₹{((selectedProd.priceSell - selectedProd.priceSell * ((Number(discInput) || 0) / 100)) * Number(qtyInput)).toFixed(2)}</strong>
                                    </p>
                                )}
                                <div className="grid grid-cols-2 gap-2">
                                    <button type="button" onClick={() => setSelectedProd(null)} className="bg-gray-200 p-2 rounded">Cancel</button>
                                    <button type="submit" className="bg-blue-600 text-white p-2 rounded font-bold">Add (Enter)</button>
                                </div>
                            </form>
                        </div>
                    )}
                </div>
            );
        };

        // ============================================================
        // 7. SALES REPORTS
        // ============================================================
        const SalesReport = ({ sales, userDoc }) => {
            const [filter, setFilter] = useState({ from: '', to: '' });
            const [searchTerm, setSearchTerm] = useState('');
            const isAdmin = userDoc.role === 'owner' || userDoc.role === 'admin';

            const filteredSales = sales.filter(s => {
                const sDate = (s.date || '').split('T')[0];
                const dateMatch = (!filter.from || sDate >= filter.from) && (!filter.to || sDate <= filter.to);
                const userMatch = isAdmin ? true : s.staffUid === userDoc.uid;
                const searchMatch = (s.customer.name || '').toLowerCase().includes(searchTerm.toLowerCase()) || s.id.toString().includes(searchTerm);
                return dateMatch && userMatch && searchMatch;
            }).slice().reverse();

            const downloadExcel = () => {
                let csv = 'ID,Date,Customer,Staff,Bill Type,Payment,Amount\n';
                filteredSales.forEach(s => { csv += `${s.id},${new Date(s.date).toLocaleDateString()},${s.customer.name},${s.staffName},${s.billType},${s.paymentMode || 'Cash'},${s.grandTotal}\n`; });
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = `Sales_Report_${new Date().toISOString().slice(0, 10)}.csv`; a.click();
            };

            // Staff-wise summary: who sold how much, and how much cash they should
            // physically have vs. how much went on udhar (credit, not collected yet).
            const staffSummary = useMemo(() => {
                if (!isAdmin) return [];
                const map = {};
                filteredSales.forEach(s => {
                    const key = s.staffUid || 'unknown';
                    if (!map[key]) map[key] = { staffName: s.staffName || 'Unknown', bills: 0, cashTotal: 0, udharTotal: 0, grandTotal: 0 };
                    map[key].bills++;
                    map[key].grandTotal += s.grandTotal || 0;
                    if (s.paymentMode === 'Udhar') map[key].udharTotal += s.grandTotal || 0;
                    else map[key].cashTotal += s.grandTotal || 0;
                });
                return Object.values(map).sort((a, b) => b.grandTotal - a.grandTotal);
            }, [filteredSales, isAdmin]);

            return (
                <div className="p-6 overflow-auto">
                    <div className="flex flex-wrap gap-4 mb-6 bg-white p-4 rounded shadow items-end">
                        <div><label className="text-xs font-bold block">From Date</label><input type="date" className="border p-2 rounded" value={filter.from} onChange={e => setFilter({ ...filter, from: e.target.value })} /></div>
                        <div><label className="text-xs font-bold block">To Date</label><input type="date" className="border p-2 rounded" value={filter.to} onChange={e => setFilter({ ...filter, to: e.target.value })} /></div>
                        <div className="flex-1"><label className="text-xs font-bold block">Search ID/Customer</label><input className="border p-2 rounded w-full" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} placeholder="Name or Bill ID" /></div>
                        <button onClick={downloadExcel} className="bg-green-600 text-white p-2 rounded font-bold">Export Excel</button>
                    </div>

                    {isAdmin && staffSummary.length > 0 && (
                        <div className="bg-white rounded shadow overflow-hidden mb-6">
                            <div className="p-3 bg-gray-50 border-b font-bold">Staff-wise Summary — Kisne Kitna Becha, Kitna Cash Aana Chahiye</div>
                            <table className="w-full text-sm">
                                <thead className="text-left text-gray-500 border-b">
                                    <tr><th className="p-2">Staff</th><th className="p-2">Bills</th><th className="p-2 text-right">Cash Sales</th><th className="p-2 text-right">Udhar Sales</th><th className="p-2 text-right">Total</th></tr>
                                </thead>
                                <tbody>
                                    {staffSummary.map(s => (
                                        <tr key={s.staffName} className="border-b hover:bg-gray-50">
                                            <td className="p-2 font-bold">{s.staffName}</td>
                                            <td className="p-2">{s.bills}</td>
                                            <td className="p-2 text-right text-green-700 font-bold">₹{s.cashTotal.toLocaleString()}</td>
                                            <td className="p-2 text-right text-red-600">₹{s.udharTotal.toLocaleString()}</td>
                                            <td className="p-2 text-right font-bold">₹{s.grandTotal.toLocaleString()}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                            <p className="text-xs text-gray-400 p-2">"Cash Sales" column jitna cash us staff ke paas physically hona chahiye (Udhar wale paise abhi collect nahi hue).</p>
                        </div>
                    )}

                    <div className="bg-white rounded shadow overflow-hidden">
                        <table className="w-full text-sm">
                            <thead className="bg-gray-100 border-b"><tr><th className="p-3 text-left">Bill ID</th><th className="p-3 text-left">Date</th><th className="p-3 text-left">Customer</th><th className="p-3 text-left">Type</th><th className="p-3 text-left">Payment</th><th className="p-3 text-left">Staff</th><th className="p-3 text-right">Amount</th></tr></thead>
                            <tbody>
                                {filteredSales.map(s => (
                                    <tr key={s.id} className="border-b hover:bg-gray-50">
                                        <td className="p-3 font-mono text-xs">{s.id.toString().slice(-8)}</td>
                                        <td className="p-3">{new Date(s.date).toLocaleString()}</td>
                                        <td className="p-3 font-bold">{s.customer.name || 'Walk-in'}</td>
                                        <td className="p-3"><span className={`px-2 py-1 rounded text-xs ${s.billType === 'Estimate' ? 'bg-yellow-100 text-yellow-800' : 'bg-blue-100 text-blue-800'}`}>{s.billType}</span></td>
                                        <td className="p-3"><span className={`px-2 py-1 rounded text-xs ${s.paymentMode === 'Udhar' ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`}>{s.paymentMode || 'Cash'}</span></td>
                                        <td className="p-3">{s.staffName}</td>
                                        <td className="p-3 text-right font-bold">₹{s.grandTotal}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                        {filteredSales.length === 0 && <div className="p-4 text-center text-gray-500">No records found.</div>}
                    </div>
                </div>
            );
        };

        // ============================================================
        // 8. QUOTATION (A4)
        // ============================================================
        const Quotation = ({ products, org }) => {
            const [qItems, setQItems] = useState([]);
            const [qCust, setQCust] = useState({ name: '', date: new Date().toISOString().split('T')[0] });
            const [manualItem, setManualItem] = useState({ name: '', unit: 'Pcs', price: '', qty: '' });
            const [rec, setRec] = useState([]);

            const handleManualAdd = () => {
                if (!manualItem.name || !manualItem.price) return;
                setQItems([...qItems, { ...manualItem, total: manualItem.price * manualItem.qty }]);
                setManualItem({ name: '', unit: 'Pcs', price: '', qty: '' });
                setRec([]);
            };

            const searchForRec = (val) => {
                setManualItem({ ...manualItem, name: val });
                if (val.length > 1) setRec(products.filter(p => p.name.toLowerCase().includes(val.toLowerCase())));
                else setRec([]);
            };

            const pickRec = (p) => { setManualItem({ name: p.name, unit: p.unit, price: p.priceSell, qty: 1 }); setRec([]); };

            const printQuotation = () => {
                const total = qItems.reduce((s, i) => s + i.total, 0);
                const data = { id: 'QT-' + Date.now().toString().slice(-4), date: qCust.date, customer: qCust, cart: qItems, grandTotal: total, billType: 'Quotation' };
                document.getElementById('print-content').innerHTML = generateReceiptHTML(data, org);
                window.print();
            };

            return (
                <div className="p-6 max-w-4xl mx-auto overflow-auto">
                    <div className="bg-white rounded shadow p-6">
                        <div className="flex justify-between items-center mb-6 border-b pb-4">
                            <h2 className="text-xl font-bold">Create Quotation (A4)</h2>
                            <button onClick={printQuotation} className="bg-purple-600 text-white px-4 py-2 rounded">Print / Save PDF</button>
                        </div>
                        <div className="grid grid-cols-2 gap-4 mb-6">
                            <input className="border p-2 rounded" placeholder="Customer Name" value={qCust.name} onChange={e => setQCust({ ...qCust, name: e.target.value })} />
                            <input type="date" className="border p-2 rounded" value={qCust.date} onChange={e => setQCust({ ...qCust, date: e.target.value })} />
                        </div>
                        <div className="bg-gray-50 p-4 rounded mb-6 relative">
                            <h4 className="font-bold mb-2 text-sm text-gray-600">Add Item (Stock or Manual)</h4>
                            <div className="flex gap-2">
                                <div className="flex-1 relative">
                                    <input className="w-full border p-2 rounded" placeholder="Item Name" value={manualItem.name} onChange={e => searchForRec(e.target.value)} />
                                    {rec.length > 0 && (
                                        <div className="absolute top-full left-0 w-full bg-white border shadow-lg z-10 max-h-40 overflow-auto">
                                            {rec.map(r => <div key={r.id} onClick={() => pickRec(r)} className="p-2 hover:bg-gray-100 cursor-pointer text-sm">{r.name} (Stock: {r.stock})</div>)}
                                        </div>
                                    )}
                                </div>
                                <input className="w-20 border p-2 rounded" placeholder="Qty" type="number" value={manualItem.qty} onChange={e => setManualItem({ ...manualItem, qty: e.target.value })} />
                                <select className="w-24 border p-2 rounded" value={manualItem.unit} onChange={e => setManualItem({ ...manualItem, unit: e.target.value })}>{UNITS.map(u => <option key={u}>{u}</option>)}</select>
                                <input className="w-24 border p-2 rounded" placeholder="Rate" type="number" value={manualItem.price} onChange={e => setManualItem({ ...manualItem, price: e.target.value })} />
                                <button onClick={handleManualAdd} className="bg-blue-600 text-white px-4 rounded">+</button>
                            </div>
                        </div>
                        <table className="w-full text-sm border">
                            <thead className="bg-gray-200"><tr><th className="p-2 text-left">Description</th><th className="p-2 w-20">Qty</th><th className="p-2 w-20">Unit</th><th className="p-2 text-right">Rate</th><th className="p-2 text-right">Total</th><th className="w-10"></th></tr></thead>
                            <tbody>
                                {qItems.map((item, i) => (
                                    <tr key={i} className="border-b">
                                        <td className="p-2">{item.name}</td><td className="p-2">{item.qty}</td><td className="p-2">{item.unit}</td>
                                        <td className="p-2 text-right">{item.price}</td><td className="p-2 text-right">{item.total}</td>
                                        <td className="p-2 text-red-500 cursor-pointer" onClick={() => setQItems(qItems.filter((_, idx) => idx !== i))}>x</td>
                                    </tr>
                                ))}
                            </tbody>
                            <tfoot><tr><td colSpan="4" className="p-2 text-right font-bold">Total:</td><td className="p-2 text-right font-bold">₹{qItems.reduce((s, i) => s + i.total, 0)}</td><td></td></tr></tfoot>
                        </table>
                    </div>
                </div>
            );
        };

        // ============================================================
        // 9. USER MANAGEMENT (Admin: approve/reject staff, invite code)
        // ============================================================
        const PERMISSION_LABELS = {
            pos: 'Sell (POS/Billing)',
            inventory: 'Add / Restock Inventory',
            reports: 'View Sales Reports',
            profit: 'View Profit & Loss',
            khata: 'Manage Udhar Khata',
            dashboard: 'View Dashboard'
        };

        const UserMgmt = ({ orgId, org }) => {
            const [users, setUsers] = useState([]);
            const [expandedId, setExpandedId] = useState(null);
            const [staffForm, setStaffForm] = useState({ name: '', username: '', password: '' });
            const [staffPerms, setStaffPerms] = useState(defaultPermissions());
            const [creating, setCreating] = useState(false);
            const [createErr, setCreateErr] = useState('');
            const [createOk, setCreateOk] = useState('');

            useEffect(() => {
                const unsub = db.collection('users').where('orgId', '==', orgId).onSnapshot(snap => {
                    setUsers(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                return unsub;
            }, [orgId]);

            const pending = users.filter(u => u.status === 'pending');
            const active = users.filter(u => u.status === 'active');
            const isStaffLogin = (u) => (u.email || '').endsWith(STAFF_EMAIL_DOMAIN);

            const approve = async (u, role) => {
                const update = { status: 'active', role: role || 'staff' };
                if (role === 'staff') update.permissions = defaultPermissions();
                await db.collection('users').doc(u.id).update(update);
            };
            const reject = async (u) => {
                if (confirm(`Reject ${u.name}'s request?`)) await db.collection('users').doc(u.id).delete();
            };
            const changeRole = async (u, role) => {
                if (u.role === 'owner') return alert('Owner role cannot be changed here.');
                const update = { role };
                if (role === 'staff' && !u.permissions) update.permissions = defaultPermissions();
                await db.collection('users').doc(u.id).update(update);
            };
            const togglePermission = async (u, key) => {
                const perms = { ...(u.permissions || defaultPermissions()) };
                perms[key] = !perms[key];
                await db.collection('users').doc(u.id).update({ permissions: perms });
            };
            const disable = async (u) => {
                if (u.role === 'owner') return alert('Cannot disable the owner.');
                if (confirm(`Disable ${u.name}'s access?`)) await db.collection('users').doc(u.id).update({ status: 'disabled' });
            };
            const reEnable = async (u) => { await db.collection('users').doc(u.id).update({ status: 'active' }); };

            const createStaffLogin = async (e) => {
                e.preventDefault();
                setCreateErr(''); setCreateOk('');
                const uname = staffForm.username.trim().toLowerCase().replace(/\s+/g, '');
                if (!staffForm.name.trim() || !uname || staffForm.password.length < 6) {
                    setCreateErr('Naam, username bharo aur password kam se kam 6 characters ka rakho.');
                    return;
                }
                setCreating(true);
                try {
                    const secAuth = getSecondaryAuth();
                    const cred = await secAuth.createUserWithEmailAndPassword(uname + STAFF_EMAIL_DOMAIN, staffForm.password);
                    await cred.user.updateProfile({ displayName: staffForm.name.trim() });
                    await db.collection('users').doc(cred.user.uid).set({
                        uid: cred.user.uid, name: staffForm.name.trim(), email: cred.user.email, photoURL: '',
                        orgId, role: 'staff', status: 'active', permissions: staffPerms,
                        createdAt: FieldValue.serverTimestamp()
                    });
                    await secAuth.signOut();
                    setCreateOk(`"${staffForm.name.trim()}" ka login ban gaya! Username: ${uname}`);
                    setStaffForm({ name: '', username: '', password: '' });
                    setStaffPerms(defaultPermissions());
                } catch (e2) {
                    if (e2.code === 'auth/email-already-in-use') setCreateErr('Ye username pehle se liya hua hai, dusra try karo.');
                    else if (e2.code === 'auth/weak-password') setCreateErr('Password kamzor hai, kam se kam 6 characters rakho.');
                    else setCreateErr(e2.message);
                } finally {
                    setCreating(false);
                }
            };

            return (
                <div className="p-6 overflow-auto">
                    <h2 className="text-xl font-bold mb-4">Staff & Admin Management</h2>

                    <div className="bg-white p-4 rounded shadow mb-6 max-w-2xl border-l-4 border-orange-500">
                        <h3 className="font-bold mb-1">Staff Login Banayein (Username + Password)</h3>
                        <p className="text-xs text-gray-500 mb-3">Isse staff ko Gmail ki zaroorat nahi — seedha login active ho jata hai, approval ka wait nahi karna padta.</p>
                        <form onSubmit={createStaffLogin} className="grid grid-cols-1 md:grid-cols-3 gap-2 mb-3">
                            <input placeholder="Staff ka Naam" className="border p-2 rounded" value={staffForm.name} onChange={e => setStaffForm({ ...staffForm, name: e.target.value })} required />
                            <input placeholder="Username (jaise ramesh)" className="border p-2 rounded" value={staffForm.username} onChange={e => setStaffForm({ ...staffForm, username: e.target.value })} required />
                            <input type="password" placeholder="Password (min 6 chars)" className="border p-2 rounded" value={staffForm.password} onChange={e => setStaffForm({ ...staffForm, password: e.target.value })} required />
                        </form>
                        <div className="grid grid-cols-2 gap-1 mb-3 bg-gray-50 p-3 rounded">
                            {Object.keys(PERMISSION_LABELS).map(key => (
                                <label key={key} className="flex items-center gap-2 text-sm cursor-pointer">
                                    <input type="checkbox" checked={!!staffPerms[key]} onChange={() => setStaffPerms({ ...staffPerms, [key]: !staffPerms[key] })} />
                                    {PERMISSION_LABELS[key]}
                                </label>
                            ))}
                        </div>
                        {createErr && <p className="text-red-600 text-sm mb-2">{createErr}</p>}
                        {createOk && <p className="text-green-600 text-sm mb-2 font-bold">{createOk}</p>}
                        <button onClick={createStaffLogin} disabled={creating} className="bg-orange-600 text-white px-4 py-2 rounded font-bold disabled:opacity-50">
                            {creating ? 'Banaya ja raha hai...' : 'Staff Login Banayein'}
                        </button>
                    </div>

                    <p className="text-sm text-gray-500 mb-4 max-w-2xl">
                        Isके alawa koi Google se login karke <strong>"Access Request Bhejein"</strong> bhi kar sakta hai —
                        uska request neeche "Pending Approvals" me aayega.
                    </p>

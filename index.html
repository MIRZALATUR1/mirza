                            {paymentMode !== 'Cash' && <span className="text-xs bg-red-500 px-2 py-1 rounded font-bold">{paymentMode === 'Split' ? t(lang, 'pos_partUdhar') : t(lang, 'pos_udhar')}</span>}
                        </div>
                        <div className="p-3 space-y-2 bg-white">
                            <div className="flex gap-2">
                                <select className="border p-1 rounded text-sm font-bold bg-yellow-100" value={billType} onChange={e => setBillType(e.target.value)}>
                                    <option value="Estimate">{t(lang, 'pos_estimate')}</option>
                                    <option value="Tax Invoice">{t(lang, 'pos_taxInvoice')}</option>
                                    <option value="Delivery Challan">Delivery Challan</option>
                                </select>
                                <select className={`border p-1 rounded text-sm font-bold ${paymentMode === 'Cash' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`} value={paymentMode} onChange={e => setPaymentMode(e.target.value)}>
                                    <option value="Cash">{t(lang, 'pos_cash')}</option>
                                    <option value="Udhar">{t(lang, 'pos_udharCredit')}</option>
                                    <option value="Split">{t(lang, 'pos_split')}</option>
                                </select>
                            </div>
                            {paymentMode === 'Split' && (
                                <div className="bg-yellow-50 border border-yellow-200 rounded p-2">
                                    <label className="text-xs font-bold text-gray-600 block mb-1">{t(lang, 'pos_cashReceived')}</label>
                                    <input type="number" min="0" max={totals.grandTotal} className="border p-1 rounded w-full text-sm" placeholder={t(lang, 'pos_cashAmount')} value={splitCash} onChange={e => setSplitCash(e.target.value)} />
                                    <p className="text-xs text-red-600 mt-1">{t(lang, 'pos_restUdhar')}{Math.max(0, totals.grandTotal - (Number(splitCash) || 0)).toFixed(2)}</p>
                                </div>
                            )}
                            {(paymentMode === 'Cash' || (paymentMode === 'Split' && Number(splitCash) > 0)) && (
                                <div>
                                    <label className="text-xs font-bold text-gray-500 block">{t(lang, 'pos_paidVia')}</label>
                                    <select className="border p-1 rounded w-full text-sm" value={paymentMethod} onChange={e => setPaymentMethod(e.target.value)}>
                                        {PAYMENT_METHODS.map(m => <option key={m} value={m}>{m}</option>)}
                                    </select>
                                </div>
                            )}
                            <input className="border p-1 rounded w-full text-sm" placeholder={paymentMode !== 'Cash' ? t(lang, 'pos_customerNameReq') : t(lang, 'pos_customerName')} value={customer.name} onChange={e => setCustomer({ ...customer, name: e.target.value })} />
                            <div className="flex gap-1">
                                {billType === 'Tax Invoice' && <input className="border p-1 rounded text-sm w-2/3" placeholder={t(lang, 'pos_gstin')} value={customer.gst} onChange={e => setCustomer({ ...customer, gst: e.target.value })} onBlur={fetchGST} />}
                                <input className={`border p-1 rounded text-sm ${billType === 'Tax Invoice' ? 'w-1/3' : 'w-full'}`} placeholder={t(lang, 'pos_mobile') + ' (WhatsApp ke liye)'} value={customer.mobile}
                                    onChange={e => { setCustomer({ ...customer, mobile: e.target.value }); setExistingCustomerInfo(null); }}
                                    onBlur={lookupCustomerByMobile} />
                            </div>
                            <input className="border p-1 rounded w-full text-sm" placeholder="Address (optional)" value={customer.address} onChange={e => setCustomer({ ...customer, address: e.target.value })} />
                            {lookupBusy && <p className="text-xs text-gray-400">Customer check ho raha hai...</p>}
                            {existingCustomerInfo && (
                                <div className="bg-blue-50 border border-blue-200 rounded p-2 text-xs">
                                    <p className="font-bold text-blue-700">👤 Pehchana hua customer{existingCustomerInfo.directory ? ` — ${existingCustomerInfo.directory.totalPurchases || 0} baar pehle khareeda` : ''}</p>
                                    {existingCustomerInfo.party && (existingCustomerInfo.party.balance || 0) > 0 && (
                                        <p className="text-red-600 font-bold mt-1">
                                            🔴 Pehle se udhar bakaya: ₹{existingCustomerInfo.party.balance.toLocaleString()}
                                            {existingCustomerInfo.party.creditLimit > 0 ? ` (Limit: ₹${existingCustomerInfo.party.creditLimit.toLocaleString()})` : ''}
                                        </p>
                                    )}
                                </div>
                            )}
                            {paymentMode !== 'Cash' && (
                                <div className="bg-red-50 border border-red-200 rounded p-2 space-y-1">
                                    <div>
                                        <label className="text-xs font-bold text-gray-600 block">{t(lang, 'pos_site')}</label>
                                        <input className="border p-1 rounded w-full text-sm" placeholder="e.g. Ram Colony Site" value={udharSite} onChange={e => setUdharSite(e.target.value)} />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-gray-600 block">{t(lang, 'pos_dueDate')}</label>
                                        <input type="date" className="border p-1 rounded w-full text-sm" value={udharDueDate} onChange={e => setUdharDueDate(e.target.value)} />
                                    </div>
                                </div>
                            )}
                            <div>
                                <label className="text-xs font-bold text-gray-500 block">{t(lang, 'pos_extraDiscount')}</label>
                                <input type="number" min="0" className="border p-1 rounded w-full text-sm" placeholder="0" value={billDiscount} onChange={e => setBillDiscount(e.target.value)} />
                            </div>
                            <p className="text-xs text-gray-400">
                                {billType === 'Tax Invoice' ? t(lang, 'pos_noteTax') : billType === 'Delivery Challan' ? 'Delivery Challan: sirf maal bhejne ka proof hai, rate/tax nahi dikhega print pe.' : t(lang, 'pos_noteEstimate')}
                            </p>
                        </div>
                        <div className="flex-1 overflow-auto p-2">
                            <table className="w-full text-sm">
                                <thead className="text-gray-500 border-b"><tr><th className="text-left">{t(lang, 'pos_item')}</th><th className="w-12">{t(lang, 'pos_qty')}</th><th className="text-right">{t(lang, 'pos_total')}</th><th className="w-6"></th></tr></thead>
                                <tbody>
                                    {cart.map((item, idx) => (
                                        <tr key={idx} className="border-b">
                                            <td className="py-2"><div className="font-bold">{item.name}</div><div className="text-xs text-gray-500">₹{item.finalPrice}</div></td>
                                            <td>{item.qty}</td>
                                            <td className="text-right font-bold">₹{item.total}</td>
                                            <td className="text-red-500 cursor-pointer" onClick={() => setCart(cart.filter((_, i) => i !== idx))}>x</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                        <div className="p-4 bg-white border-t">
                            <div className="text-sm text-gray-500 space-y-0.5 mb-2">
                                {billType === 'Tax Invoice' && totals.gstAmount > 0 && (
                                    <>
                                        <div className="flex justify-between"><span>{t(lang, 'pos_subtotal')}</span><span>₹{totals.subtotal.toFixed(2)}</span></div>
                                        <div className="flex justify-between"><span>CGST</span><span>₹{(totals.gstAmount / 2).toFixed(2)}</span></div>
                                        <div className="flex justify-between"><span>SGST</span><span>₹{(totals.gstAmount / 2).toFixed(2)}</span></div>
                                    </>
                                )}
                                {totals.billDiscount > 0 && <div className="flex justify-between text-orange-600"><span>{t(lang, 'pos_discount')}</span><span>− ₹{totals.billDiscount.toFixed(2)}</span></div>}
                                {Math.abs(totals.roundOff) > 0.001 && <div className="flex justify-between"><span>{t(lang, 'pos_roundOff')}</span><span>{totals.roundOff >= 0 ? '+' : ''}₹{totals.roundOff.toFixed(2)}</span></div>}
                            </div>
                            <div className="flex justify-between items-center mb-4">
                                <span className="text-gray-500">{t(lang, 'pos_totalItems')}: {cart.length}</span>
                                <span className="text-3xl font-bold text-slate-800">₹{totals.grandTotal}</span>
                            </div>
                            <div className="grid grid-cols-2 gap-2">
                                <button onClick={() => completeSale(false)} disabled={saving} className="w-full bg-slate-700 hover:bg-slate-800 text-white py-3 rounded font-bold shadow disabled:opacity-50">
                                    {saving ? '...' : t(lang, 'pos_saveOnly')}
                                </button>
                                <button onClick={() => completeSale(true)} disabled={saving} className={`w-full text-white py-3 rounded font-bold shadow disabled:opacity-50 ${paymentMode !== 'Cash' ? 'bg-red-600 hover:bg-red-700' : 'bg-green-600 hover:bg-green-700'}`}>
                                    {saving ? '...' : (paymentMode !== 'Cash' ? t(lang, 'pos_saveUdhar') : t(lang, 'pos_printSave'))}
                                </button>
                            </div>
                            <p className="text-xs text-gray-400 text-center mt-2">{t(lang, 'pos_saveOnlyNote')}</p>
                        </div>
                    </div>

                    {selectedProd && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
                            <form onSubmit={addToCart} className="bg-white p-6 rounded shadow-xl w-80">
                                <h3 className="font-bold text-lg mb-1">{selectedProd.name}</h3>
                                <div className="flex gap-1 mb-3">
                                    {selectedProd.gstApplicable === false ? <span className="text-xs bg-gray-100 text-gray-500 px-2 py-0.5 rounded">{t(lang, 'pos_noGst')}</span> : <span className="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded font-bold">{t(lang, 'pos_gstLabel')} {selectedProd.gst || 0}%</span>}
                                    {selectedProd.discountAllowed === false && <span className="text-xs bg-red-100 text-red-700 px-2 py-0.5 rounded font-bold">{t(lang, 'pos_fixedRate')}</span>}
                                </div>
                                <div className="flex justify-between text-sm text-gray-600 mb-4"><span>{t(lang, 'pos_stock')}: {selectedProd.stock}</span><span>{t(lang, 'pos_rate')}: ₹{getBasePrice(selectedProd)}{priceType === 'wholesale' && selectedProd.priceWholesale ? ' (Wholesale)' : ''}</span></div>
                                <label className="block text-sm font-bold mb-1">{t(lang, 'pos_enterQty')} ({selectedProd.unit})</label>
                                <input ref={qtyRef} type="number" step="0.01" className="w-full border-2 border-blue-500 rounded p-2 text-2xl font-bold text-center mb-3" value={qtyInput} onChange={e => setQtyInput(e.target.value)} />
                                {selectedProd.discountAllowed !== false ? (
                                    <>
                                        <div className="flex justify-between items-center mb-1">
                                            <label className="block text-sm font-bold">{t(lang, 'pos_discountLabel')} ({discType === 'percent' ? '%' : '₹ Flat'})</label>
                                            <button type="button" onClick={() => setDiscType(discType === 'percent' ? 'flat' : 'percent')} className="text-xs bg-gray-100 px-2 py-0.5 rounded">
                                                {discType === 'percent' ? t(lang, 'pos_switchRupee') : t(lang, 'pos_switchPercent')}
                                            </button>
                                        </div>
                                        <input type="number" step="0.01" className="w-full border-2 border-orange-400 rounded p-2 text-lg font-bold text-center mb-1" value={discInput} onChange={e => setDiscInput(e.target.value)} />
                                        <p className="text-xs text-gray-400 mb-2">{t(lang, 'pos_extraChargeNote')}</p>
                                    </>
                                ) : (
                                    <p className="text-xs text-red-600 mb-2 text-center">{t(lang, 'pos_fixedRateNote')}</p>
                                )}
                                {qtyInput && Number(qtyInput) > 0 && (() => {
                                    const val = Number(discInput) || 0;
                                    const fp = calcFinalPrice(selectedProd, discType, val);
                                    return (
                                        <p className="text-center text-sm text-gray-600 mb-3">
                                            {t(lang, 'pos_finalRate')}: ₹{fp.toFixed(2)} × {qtyInput} = <strong>₹{(fp * Number(qtyInput)).toFixed(2)}</strong>
                                            {fp > getBasePrice(selectedProd) && <span className="text-red-600 font-bold"> {t(lang, 'pos_extraCharge')}</span>}
                                        </p>
                                    );
                                })()}
                                <div className="grid grid-cols-2 gap-2">
                                    <button type="button" onClick={() => setSelectedProd(null)} className="bg-gray-200 p-2 rounded">{t(lang, 'pos_cancel')}</button>
                                    <button type="submit" className="bg-blue-600 text-white p-2 rounded font-bold">{t(lang, 'pos_add')}</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {showHeld && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded shadow-xl w-full max-w-md max-h-[80vh] flex flex-col">
                                <div className="p-4 border-b flex justify-between items-center">
                                    <h3 className="font-bold">Held Bills</h3>
                                    <button onClick={() => setShowHeld(false)} className="text-gray-400 text-xl">&times;</button>
                                </div>
                                <div className="flex-1 overflow-auto p-4 space-y-2">
                                    {heldBills.length === 0 && <p className="text-center text-gray-400 text-sm">Koi bill hold nahi hai.</p>}
                                    {heldBills.map(h => (
                                        <div key={h.id} className="border rounded p-3 flex justify-between items-center">
                                            <div>
                                                <div className="font-bold">{h.label}</div>
                                                <div className="text-xs text-gray-500">{(h.cart || []).length} items · {h.staffName}</div>
                                            </div>
                                            <div className="flex gap-1">
                                                <button onClick={() => resumeHeldBill(h)} className="bg-green-600 text-white text-xs px-2 py-1 rounded font-bold">Resume</button>
                                                <button onClick={() => discardHeldBill(h)} className="bg-red-100 text-red-600 text-xs px-2 py-1 rounded">Delete</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {lastSale && (
                        <div className="fixed bottom-4 right-4 bg-white shadow-xl border rounded-lg p-4 z-40 w-72">
                            <p className="text-sm font-bold mb-2">Bill save ho gaya ✓</p>
                            {lastSale.customer.mobile ? (
                                <button onClick={() => shareViaWhatsApp(lastSale, org)} className="w-full bg-green-600 text-white p-2 rounded font-bold text-sm mb-1">📱 Send PDF via WhatsApp</button>
                            ) : <p className="text-xs text-gray-400 mb-1">Customer ka mobile number nahi tha.</p>}
                            <button onClick={() => downloadBillPDF(lastSale, org)} className="w-full bg-gray-100 text-gray-600 p-2 rounded text-xs mb-1">Sirf PDF Download Karo</button>
                            <button onClick={() => setLastSale(null)} className="w-full bg-gray-100 text-gray-600 p-1 rounded text-xs">Close</button>
                        </div>
                    )}
                </div>
            );
        };

        // ============================================================
        // 7. SALES REPORTS
        // ============================================================
        const SalesReport = ({ orgId, org, sales, purchases, products, userDoc, lang }) => {
            const [reportTab, setReportTab] = useState('sales'); // sales | purchases
            const [filter, setFilter] = useState({ from: '', to: '' });
            const [searchTerm, setSearchTerm] = useState('');
            const [returnSale, setReturnSale] = useState(null);
            const [returnQtys, setReturnQtys] = useState({});
            const [busy, setBusy] = useState(false);
            const isAdmin = userDoc.role === 'owner' || userDoc.role === 'admin';

            const filteredSales = sales.filter(s => {
                const sDate = (s.date || '').split('T')[0];
                const dateMatch = (!filter.from || sDate >= filter.from) && (!filter.to || sDate <= filter.to);
                const userMatch = isAdmin ? true : s.staffUid === userDoc.uid;
                const term = searchTerm.toLowerCase();
                const searchMatch = !term || (s.customer.name || '').toLowerCase().includes(term) || s.id.toString().includes(searchTerm)
                    || (s.cart || []).some(item => item.name.toLowerCase().includes(term));
                return dateMatch && userMatch && searchMatch;
            }).slice().reverse();

            const reprintSale = (s) => {
                document.getElementById('print-content').innerHTML = generateReceiptHTML(s, org);
                window.print();
            };

            const downloadExcel = () => {
                let csv = 'ID,Date,Customer,Staff,Bill Type,Payment,Status,Amount,Returned\n';
                filteredSales.forEach(s => { csv += `${s.id},${new Date(s.date).toLocaleDateString()},${s.customer.name},${s.staffName},${s.billType},${s.paymentMode || 'Cash'},${s.voided ? 'VOID' : 'OK'},${s.grandTotal},${s.returnedTotal || 0}\n`; });
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = `Sales_Report_${new Date().toISOString().slice(0, 10)}.csv`; a.click();
            };

            const downloadPDF = () => {
                const doc = new window.jspdf.jsPDF();
                doc.setFontSize(14);
                doc.text('Sales Report', 14, 15);
                doc.setFontSize(9);
                doc.text(`${filter.from || 'Start'} to ${filter.to || 'Today'}`, 14, 21);
                doc.autoTable({
                    startY: 26,
                    head: [['Bill ID', 'Date', 'Customer', 'Type', 'Payment', 'Staff', 'Amount']],
                    body: filteredSales.map(s => [
                        s.id.toString().slice(-8), new Date(s.date).toLocaleDateString(), s.customer.name || 'Walk-in',
                        s.billType, s.paymentMode || 'Cash', s.staffName, (s.voided ? 'VOID ' : '') + 'Rs.' + s.grandTotal.toFixed(2)
                    ]),
                    styles: { fontSize: 8 }
                });
                doc.save(`Sales_Report_${new Date().toISOString().slice(0, 10)}.pdf`);
            };

            // ============================================================
            // GSTR-style export helpers. IMPORTANT: this is a helper export for
            // your CA/accountant to work from — the actual GST portal (GSTR-1,
            // GSTR-3B) has its own exact JSON/Excel format that changes with
            // government notifications, so this is not a guaranteed direct
            // upload file. Only Tax Invoice bills (not Estimates) are included,
            // since GST is only charged on those.
            // ============================================================
            const findHsn = (productId) => { const p = (products || []).find(x => x.id === productId); return (p && p.hsnCode) || ''; };

            const downloadGSTR = () => {
                const taxBills = filteredSales.filter(s => s.billType === 'Tax Invoice' && !s.voided);

                // 1) Invoice-wise register (like GSTR-1 Table 4/7)
                let csv1 = 'Invoice No,Date,Customer,GSTIN,Taxable Value,CGST,SGST,Total Tax,Invoice Total\n';
                taxBills.forEach(s => {
                    const taxable = s.subtotal || 0;
                    const totalTax = s.gstAmount || 0;
                    csv1 += `${s.id.toString().slice(-8)},${new Date(s.date).toLocaleDateString()},${s.customer.name || 'Walk-in'},${s.customer.gst || ''},${taxable.toFixed(2)},${(totalTax / 2).toFixed(2)},${(totalTax / 2).toFixed(2)},${totalTax.toFixed(2)},${s.grandTotal.toFixed(2)}\n`;
                });

                // 2) HSN-wise summary (like GSTR-1 Table 12)
                const hsnMap = {};
                taxBills.forEach(s => (s.cart || []).forEach(item => {
                    const hsn = findHsn(item.id) || 'N/A';
                    const key = hsn + '|' + (item.gst || 0);
                    if (!hsnMap[key]) hsnMap[key] = { hsn, gstRate: item.gst || 0, qty: 0, taxableValue: 0, unit: item.unit };
                    hsnMap[key].qty += item.qty;
                    hsnMap[key].taxableValue += item.total;
                }));
                let csv2 = 'HSN Code,UQC (Unit),Total Qty,Taxable Value,GST Rate,Tax Amount\n';
                Object.values(hsnMap).forEach(h => {
                    const tax = h.taxableValue * (h.gstRate / 100);
                    csv2 += `${h.hsn},${h.unit},${h.qty},${h.taxableValue.toFixed(2)},${h.gstRate}%,${tax.toFixed(2)}\n`;
                });

                [{ name: 'GSTR_Invoice_Register', data: csv1 }, { name: 'GSTR_HSN_Summary', data: csv2 }].forEach(f => {
                    const blob = new Blob([f.data], { type: 'text/csv' });
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url; a.download = `${f.name}_${new Date().toISOString().slice(0, 10)}.csv`; a.click();
                });
            };

            const [staffUsers, setStaffUsers] = useState([]);
            useEffect(() => {
                const unsub = db.collection('users').where('orgId', '==', orgId).onSnapshot(snap => {
                    setStaffUsers(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                return unsub;
            }, [orgId]);

            // Staff-wise summary: who sold how much, and how much cash they should
            // physically have vs. how much went on udhar (credit, not collected yet).
            // Also computes commission earned if the admin has set a commission % for that staff member.
            const staffSummary = useMemo(() => {
                if (!isAdmin) return [];
                const map = {};
                filteredSales.filter(s => !s.voided).forEach(s => {
                    const key = s.staffUid || 'unknown';
                    if (!map[key]) map[key] = { uid: key, staffName: s.staffName || 'Unknown', bills: 0, cashTotal: 0, udharTotal: 0, grandTotal: 0 };
                    const net = (s.grandTotal || 0) - (s.returnedTotal || 0);
                    map[key].bills++;
                    map[key].grandTotal += net;
                    map[key].udharTotal += (s.udharAmount || 0);
                    map[key].cashTotal += net - (s.udharAmount || 0);
                });
                return Object.values(map).map(row => {
                    const staffUser = staffUsers.find(u => u.id === row.uid);
                    const pct = (staffUser && staffUser.commissionPct) || 0;
                    return { ...row, commissionPct: pct, commission: row.grandTotal * (pct / 100) };
                }).sort((a, b) => b.grandTotal - a.grandTotal);
            }, [filteredSales, isAdmin, staffUsers]);

            // ------- Purchase Report (separate tab) -------
            const filteredPurchases = (purchases || []).filter(p => {
                const pDate = (p.date || '').split('T')[0];
                return (!filter.from || pDate >= filter.from) && (!filter.to || pDate <= filter.to) &&
                    (p.productName || '').toLowerCase().includes(searchTerm.toLowerCase());
            }).slice().reverse();

            const purchaseTotal = filteredPurchases.reduce((s, p) => s + (p.total || 0), 0);

            const downloadPurchaseExcel = () => {
                let csv = 'Date,Product,Category,Qty,Rate,GST,Total,Payment,Supplier,Staff\n';
                filteredPurchases.forEach(p => { csv += `${new Date(p.date).toLocaleDateString()},${p.productName},${p.category},${p.qty},${p.rate},${(p.gstAmount || 0).toFixed(2)},${p.total.toFixed(2)},${p.paymentMode},${p.supplierName || ''},${p.staffName}\n`; });
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = `Purchase_Report_${new Date().toISOString().slice(0, 10)}.csv`; a.click();
            };

            const downloadPurchasePDF = () => {
                const doc = new window.jspdf.jsPDF();
                doc.setFontSize(14);
                doc.text('Purchase Report', 14, 15);
                doc.setFontSize(9);
                doc.text(`${filter.from || 'Start'} to ${filter.to || 'Today'} · Total: Rs.${purchaseTotal.toFixed(2)}`, 14, 21);
                doc.autoTable({
                    startY: 26,
                    head: [['Date', 'Product', 'Qty', 'Rate', 'GST', 'Total', 'Payment', 'Supplier']],
                    body: filteredPurchases.map(p => [
                        new Date(p.date).toLocaleDateString(), p.productName, p.qty, 'Rs.' + p.rate,
                        'Rs.' + (p.gstAmount || 0).toFixed(2), 'Rs.' + p.total.toFixed(2), p.paymentMode, p.supplierName || '-'
                    ]),
                    styles: { fontSize: 8 }
                });
                doc.save(`Purchase_Report_${new Date().toISOString().slice(0, 10)}.pdf`);
            };

            const voidSale = async (sale) => {
                if (!confirm(`Bill #${sale.id.toString().slice(-6)} ko VOID (cancel) karna hai? Stock wapas add ho jayega.`)) return;
                setBusy(true);
                try {
                    const batch = db.batch();
                    (sale.cart || []).forEach(item => {
                        const remaining = item.qty - (item.returnedQty || 0);
                        if (remaining > 0) {
                            batch.update(db.collection('orgs').doc(orgId).collection('products').doc(item.id), { stock: FieldValue.increment(remaining) });
                        }
                    });
                    const remainingUdhar = Math.max(0, (sale.udharAmount || 0) - (sale.returnedTotal || 0));
                    if (sale.partyId && remainingUdhar > 0) {
                        const partyRef = db.collection('orgs').doc(orgId).collection('parties').doc(sale.partyId);
                        batch.update(partyRef, { balance: FieldValue.increment(-remainingUdhar) });
                        batch.set(partyRef.collection('transactions').doc(), {
                            type: 'payment_received', amount: remainingUdhar, note: `Bill #${sale.id.toString().slice(-6)} voided`,
                            date: new Date().toISOString(), createdAt: FieldValue.serverTimestamp()
                        });
                    }
                    batch.update(db.collection('orgs').doc(orgId).collection('sales').doc(sale.id), {
                        voided: true, voidedAt: FieldValue.serverTimestamp(), voidedByName: userDoc.name
                    });
                    await batch.commit();
                } catch (e) {
                    alert('Error: ' + e.message);
                } finally {
                    setBusy(false);
                }
            };

            const openReturn = (sale) => {
                setReturnSale(sale);
                setReturnQtys({});
            };

            const submitReturn = async () => {
                const items = (returnSale.cart || []).map((item, idx) => ({ item, idx, qty: Number(returnQtys[idx]) || 0 }))
                    .filter(x => x.qty > 0);
                if (items.length === 0) { alert('Kam se kam ek item ki return quantity daalo.'); return; }
                for (const x of items) {
                    const remaining = x.item.qty - (x.item.returnedQty || 0);
                    if (x.qty > remaining) { alert(`${x.item.name}: max ${remaining} hi return ho sakta hai.`); return; }
                }
                setBusy(true);
                try {
                    const totalReturnAmount = items.reduce((s, x) => s + x.item.finalPrice * x.qty, 0);
                    const totalReturnProfit = items.reduce((s, x) => s + (x.item.finalPrice - x.item.priceBuy) * x.qty, 0);
                    const newCart = returnSale.cart.map((item, idx) => {
                        const match = items.find(x => x.idx === idx);
                        return match ? { ...item, returnedQty: (item.returnedQty || 0) + match.qty } : item;
                    });

                    const batch = db.batch();
                    items.forEach(x => {
                        batch.update(db.collection('orgs').doc(orgId).collection('products').doc(x.item.id), { stock: FieldValue.increment(x.qty) });
                    });
                    batch.update(db.collection('orgs').doc(orgId).collection('sales').doc(returnSale.id), {
                        cart: newCart,
                        returnedTotal: FieldValue.increment(totalReturnAmount),
                        returnedProfit: FieldValue.increment(totalReturnProfit)
                    });

                    const remainingUdhar = Math.max(0, (returnSale.udharAmount || 0) - (returnSale.returnedTotal || 0));
                    const partyReduction = Math.min(totalReturnAmount, remainingUdhar);
                    if (returnSale.partyId && partyReduction > 0) {
                        const partyRef = db.collection('orgs').doc(orgId).collection('parties').doc(returnSale.partyId);
                        batch.update(partyRef, { balance: FieldValue.increment(-partyReduction) });
                        batch.set(partyRef.collection('transactions').doc(), {
                            type: 'payment_received', amount: partyReduction, note: `Return against Bill #${returnSale.id.toString().slice(-6)}`,
                            date: new Date().toISOString(), createdAt: FieldValue.serverTimestamp()
                        });
                    }

                    batch.set(db.collection('orgs').doc(orgId).collection('returns').doc(), {
                        type: 'sale_return', saleId: returnSale.id,
                        items: items.map(x => ({ productId: x.item.id, name: x.item.name, qty: x.qty, finalPrice: x.item.finalPrice, total: x.item.finalPrice * x.qty })),
                        totalAmount: totalReturnAmount, date: new Date().toISOString(), createdAt: FieldValue.serverTimestamp(),
                        staffUid: userDoc.uid, staffName: userDoc.name
                    });

                    await batch.commit();
                    setReturnSale(null);
                    setReturnQtys({});
                } catch (e) {
                    alert('Error: ' + e.message);
                } finally {
                    setBusy(false);
                }
            };

            return (
                <div className="p-6 overflow-auto">
                    <div className="flex gap-2 mb-4">
                        <button onClick={() => setReportTab('sales')} className={`px-4 py-2 rounded font-bold ${reportTab === 'sales' ? 'bg-slate-800 text-white' : 'bg-white border'}`}>{t(lang, 'nav_reports')}</button>
                        <button onClick={() => setReportTab('purchases')} className={`px-4 py-2 rounded font-bold ${reportTab === 'purchases' ? 'bg-slate-800 text-white' : 'bg-white border'}`}>Purchase Report</button>
                    </div>

                    {reportTab === 'sales' && (<>
                    <div className="flex flex-wrap gap-4 mb-6 bg-white p-4 rounded shadow items-end">
                        <div><label className="text-xs font-bold block">From Date</label><input type="date" className="border p-2 rounded" value={filter.from} onChange={e => setFilter({ ...filter, from: e.target.value })} /></div>
                        <div><label className="text-xs font-bold block">To Date</label><input type="date" className="border p-2 rounded" value={filter.to} onChange={e => setFilter({ ...filter, to: e.target.value })} /></div>
                        <div className="flex-1"><label className="text-xs font-bold block">Search ID/Customer</label><input className="border p-2 rounded w-full" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} placeholder="Name or Bill ID" /></div>
                        <button onClick={downloadExcel} className="bg-green-600 text-white p-2 rounded font-bold">Export Excel</button>
                        <button onClick={downloadPDF} className="bg-red-600 text-white p-2 rounded font-bold">Download PDF</button>
                        <button onClick={downloadGSTR} className="bg-purple-600 text-white p-2 rounded font-bold">GSTR Export</button>
                    </div>

                    {isAdmin && staffSummary.length > 0 && (
                        <div className="bg-white rounded shadow overflow-hidden mb-6">
                            <div className="p-3 bg-gray-50 border-b font-bold">Staff-wise Summary — Kisne Kitna Becha, Kitna Cash Aana Chahiye</div>
                            <table className="w-full text-sm">
                                <thead className="text-left text-gray-500 border-b">
                                    <tr><th className="p-2">Staff</th><th className="p-2">Bills</th><th className="p-2 text-right">Cash Sales</th><th className="p-2 text-right">Udhar Sales</th><th className="p-2 text-right">Total</th><th className="p-2 text-right">Commission</th></tr>
                                </thead>
                                <tbody>
                                    {staffSummary.map(s => (
                                        <tr key={s.uid} className="border-b hover:bg-gray-50">
                                            <td className="p-2 font-bold">{s.staffName}</td>
                                            <td className="p-2">{s.bills}</td>
                                            <td className="p-2 text-right text-green-700 font-bold">₹{s.cashTotal.toLocaleString()}</td>
                                            <td className="p-2 text-right text-red-600">₹{s.udharTotal.toLocaleString()}</td>
                                            <td className="p-2 text-right font-bold">₹{s.grandTotal.toLocaleString()}</td>
                                            <td className="p-2 text-right text-purple-700">{s.commissionPct > 0 ? `₹${s.commission.toLocaleString(undefined, { maximumFractionDigits: 0 })} (${s.commissionPct}%)` : '—'}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                            <p className="text-xs text-gray-400 p-2">Voided bills is summary me nahi ginte. Commission % User Management me set karo har staff ke liye.</p>
                        </div>
                    )}

                    <div className="bg-white rounded shadow overflow-hidden">
                        <table className="w-full text-sm">
                            <thead className="bg-gray-100 border-b"><tr><th className="p-3 text-left">Bill ID</th><th className="p-3 text-left">Date</th><th className="p-3 text-left">Customer</th><th className="p-3 text-left">Type</th><th className="p-3 text-left">Payment</th><th className="p-3 text-left">Staff</th><th className="p-3 text-right">Amount</th><th className="p-3 text-center">Action</th></tr></thead>
                            <tbody>
                                {filteredSales.map(s => (
                                    <tr key={s.id} className={`border-b hover:bg-gray-50 ${s.voided ? 'opacity-50' : ''}`}>
                                        <td className="p-3 font-mono text-xs">{s.id.toString().slice(-8)}</td>
                                        <td className="p-3">{new Date(s.date).toLocaleString()}</td>
                                        <td className="p-3 font-bold">{s.customer.name || 'Walk-in'}</td>
                                        <td className="p-3"><span className={`px-2 py-1 rounded text-xs ${s.billType === 'Estimate' ? 'bg-yellow-100 text-yellow-800' : 'bg-blue-100 text-blue-800'}`}>{s.billType}</span></td>
                                        <td className="p-3"><span className={`px-2 py-1 rounded text-xs ${(s.paymentMode || 'Cash') !== 'Cash' ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`}>{s.paymentMode || 'Cash'}</span></td>
                                        <td className="p-3">{s.staffName}</td>
                                        <td className="p-3 text-right">
                                            {s.voided && <span className="text-red-600 font-bold text-xs block">VOIDED</span>}
                                            {!!s.returnedTotal && <span className="text-orange-600 text-xs block">Returned ₹{s.returnedTotal.toFixed(2)}</span>}
                                            <span className="font-bold">₹{s.grandTotal}</span>
                                        </td>
                                        <td className="p-3 text-center whitespace-nowrap">
                                            <button onClick={() => reprintSale(s)} className="text-gray-600 text-xs border px-2 py-1 rounded mr-1">🖨 Reprint</button>
                                            <button onClick={() => downloadBillPDF(s, org)} className="text-blue-600 text-xs border px-2 py-1 rounded mr-1">📄 PDF</button>
                                            {s.customer.mobile && (
                                                <button onClick={() => shareViaWhatsApp(s, org)} className="text-green-600 text-xs border px-2 py-1 rounded mr-1">📱</button>
                                            )}
                                            {isAdmin && !s.voided && (
                                                <>
                                                    <button disabled={busy} onClick={() => openReturn(s)} className="text-blue-600 text-xs border px-2 py-1 rounded mr-1">Return</button>
                                                    <button disabled={busy} onClick={() => voidSale(s)} className="text-red-600 text-xs border px-2 py-1 rounded">Void</button>
                                                </>
                                            )}
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                        {filteredSales.length === 0 && <div className="p-4 text-center text-gray-500">No records found.</div>}
                    </div>

                    {returnSale && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded shadow-xl w-full max-w-lg max-h-[90vh] flex flex-col">
                                <div className="p-4 border-b flex justify-between items-center">
                                    <h3 className="font-bold">Return — Bill #{returnSale.id.toString().slice(-6)}</h3>
                                    <button onClick={() => setReturnSale(null)} className="text-gray-400 text-xl">&times;</button>
                                </div>
                                <div className="p-4 overflow-auto flex-1 space-y-3">
                                    {(returnSale.cart || []).map((item, idx) => {
                                        const remaining = item.qty - (item.returnedQty || 0);
                                        return (
                                            <div key={idx} className="flex justify-between items-center border-b pb-2">
                                                <div>
                                                    <div className="font-bold text-sm">{item.name}</div>
                                                    <div className="text-xs text-gray-500">Sold: {item.qty} {item.unit} · Remaining returnable: {remaining}</div>
                                                </div>
                                                <input type="number" min="0" max={remaining} disabled={remaining <= 0}
                                                    className="border p-1 rounded w-20 text-center"
                                                    value={returnQtys[idx] || ''}
                                                    onChange={e => setReturnQtys({ ...returnQtys, [idx]: e.target.value })} />
                                            </div>
                                        );
                                    })}
                                </div>
                                <div className="p-4 border-t">
                                    <button disabled={busy} onClick={submitReturn} className="w-full bg-blue-600 text-white p-3 rounded font-bold disabled:opacity-50">
                                        {busy ? 'Processing...' : 'Return Confirm Karo'}
                                    </button>
                                    <p className="text-xs text-gray-400 mt-2">Stock wapas add hoga, aur agar udhar tha to customer ka khata us hisaab se adjust hoga.</p>
                                </div>
                            </div>
                        </div>
                    )}
                    </>)}

                    {reportTab === 'purchases' && (<>
                        <div className="flex flex-wrap gap-4 mb-6 bg-white p-4 rounded shadow items-end">
                            <div><label className="text-xs font-bold block">From Date</label><input type="date" className="border p-2 rounded" value={filter.from} onChange={e => setFilter({ ...filter, from: e.target.value })} /></div>
                            <div><label className="text-xs font-bold block">To Date</label><input type="date" className="border p-2 rounded" value={filter.to} onChange={e => setFilter({ ...filter, to: e.target.value })} /></div>
                            <div className="flex-1"><label className="text-xs font-bold block">Search Product</label><input className="border p-2 rounded w-full" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} placeholder="Product name" /></div>
                            <button onClick={downloadPurchaseExcel} className="bg-green-600 text-white p-2 rounded font-bold">Export Excel</button>
                            <button onClick={downloadPurchasePDF} className="bg-red-600 text-white p-2 rounded font-bold">Download PDF</button>
                        </div>
                        <div className="bg-white p-4 rounded shadow mb-6 border-l-4 border-purple-500">
                            <p className="text-gray-500 text-sm">Total Purchases ({filteredPurchases.length} entries)</p>
                            <h3 className="text-2xl font-bold">₹{purchaseTotal.toLocaleString()}</h3>
                        </div>
                        <div className="bg-white rounded shadow overflow-hidden">
                            <table className="w-full text-sm">
                                <thead className="bg-gray-100 border-b"><tr><th className="p-3 text-left">Date</th><th className="p-3 text-left">Product</th><th className="p-3 text-left">Qty</th><th className="p-3 text-left">Rate</th><th className="p-3 text-left">GST</th><th className="p-3 text-left">Payment</th><th className="p-3 text-left">Supplier</th><th className="p-3 text-right">Total</th></tr></thead>
                                <tbody>
                                    {filteredPurchases.map(p => (
                                        <tr key={p.id} className="border-b hover:bg-gray-50">
                                            <td className="p-3">{new Date(p.date).toLocaleDateString()}</td>
                                            <td className="p-3 font-bold">{p.productName}</td>
                                            <td className="p-3">{p.qty}</td>
                                            <td className="p-3">₹{p.rate}</td>
                                            <td className="p-3">₹{(p.gstAmount || 0).toFixed(2)}</td>
                                            <td className="p-3"><span className={`px-2 py-1 rounded text-xs ${p.paymentMode === 'Udhar' ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`}>{p.paymentMode}</span></td>
                                            <td className="p-3">{p.supplierName || '-'}</td>
                                            <td className="p-3 text-right font-bold">₹{p.total.toFixed(2)}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                            {filteredPurchases.length === 0 && <div className="p-4 text-center text-gray-500">No purchase records found.</div>}
                        </div>
                    </>)}
                </div>
            );
        };

        // ============================================================
        // 8. QUOTATION (A4)
        // ============================================================
        const Quotation = ({ products, org }) => {
            const [qItems, setQItems] = useState([]);
            const [qCust, setQCust] = useState({ name: '', mobile: '', address: '', date: new Date().toISOString().split('T')[0] });
            const [manualItem, setManualItem] = useState({ name: '', unit: 'Pcs', price: '', qty: '' });
            const [rec, setRec] = useState([]);
            const [browseCat, setBrowseCat] = useState('All');
            const [browseSearch, setBrowseSearch] = useState('');

            const handleManualAdd = () => {
                if (!manualItem.name || !manualItem.price) return;
                setQItems([...qItems, { ...manualItem, total: manualItem.price * manualItem.qty }]);
                setManualItem({ name: '', unit: 'Pcs', price: '', qty: '' });
                setRec([]);
            };

            const searchForRec = (val) => {
                setManualItem({ ...manualItem, name: val });
                if (val.length > 1) setRec(products.filter(p => p.name.toLowerCase().includes(val.toLowerCase())));
                else setRec([]);
            };

            const pickRec = (p) => { setManualItem({ name: p.name, unit: p.unit, price: p.priceSell, qty: 1 }); setRec([]); };

            // Click-to-add from the full inventory list — zero typing needed.
            // Adding the same product again just bumps its quantity by 1.
            const addFromBrowse = (p) => {
                setQItems(prev => {
                    const idx = prev.findIndex(it => it.productId === p.id);
                    if (idx >= 0) {
                        const updated = [...prev];
                        const newQty = Number(updated[idx].qty) + 1;
                        updated[idx] = { ...updated[idx], qty: newQty, total: newQty * updated[idx].price };
                        return updated;
                    }
                    return [...prev, { productId: p.id, name: p.name, unit: p.unit, price: p.priceSell, qty: 1, total: p.priceSell }];
                });
            };

            const setQty = (i, val) => {
                setQItems(prev => {
                    const updated = [...prev];
                    const newQty = Math.max(0, Number(val) || 0);
                    updated[i] = { ...updated[i], qty: newQty, total: newQty * updated[i].price };
                    return updated;
                });
            };

            const categoriesInStock = ['All', ...CATEGORIES.filter(c => products.some(p => p.category === c))];
            const browseProducts = products
                .filter(p => browseCat === 'All' || p.category === browseCat)
                .filter(p => !browseSearch || p.name.toLowerCase().includes(browseSearch.toLowerCase()));

            const printQuotation = () => {
                const total = qItems.reduce((s, i) => s + i.total, 0);
                const data = { id: 'QT-' + Date.now().toString().slice(-4), date: qCust.date, customer: qCust, cart: qItems, grandTotal: total, billType: 'Quotation' };
                document.getElementById('print-content').innerHTML = generateReceiptHTML(data, org);
                window.print();
            };

            return (
                <div className="p-6 max-w-5xl mx-auto overflow-auto">
                    <div className="bg-white rounded shadow p-6">
                        <div className="flex justify-between items-center mb-6 border-b pb-4">
                            <h2 className="text-xl font-bold">Create Quotation (A4)</h2>
                            <button onClick={printQuotation} className="bg-purple-600 text-white px-4 py-2 rounded">Print / Save PDF</button>
                        </div>
                        <div className="grid grid-cols-2 gap-4 mb-6">
                            <input className="border p-2 rounded" placeholder="Customer Name" value={qCust.name} onChange={e => setQCust({ ...qCust, name: e.target.value })} />
                            <input type="date" className="border p-2 rounded" value={qCust.date} onChange={e => setQCust({ ...qCust, date: e.target.value })} />
                            <input className="border p-2 rounded" placeholder="Mobile Number" value={qCust.mobile} onChange={e => setQCust({ ...qCust, mobile: e.target.value })} />
                            <input className="border p-2 rounded" placeholder="Site / Delivery Address" value={qCust.address} onChange={e => setQCust({ ...qCust, address: e.target.value })} />
                        </div>

                        <div className="bg-blue-50 border border-blue-200 p-4 rounded mb-6">
                            <h4 className="font-bold mb-2 text-sm text-blue-700">Browse & Click to Add (typing minimum)</h4>
                            <div className="flex flex-wrap gap-1 mb-2">
                                {categoriesInStock.map(c => (
                                    <button key={c} onClick={() => setBrowseCat(c)} className={`px-2 py-1 rounded-full text-xs border ${browseCat === c ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-600'}`}>{c === 'All' ? 'Sab' : c}</button>
                                ))}
                            </div>
                            <input className="w-full border p-2 rounded mb-2 text-sm" placeholder="Ya yahan search karo..." value={browseSearch} onChange={e => setBrowseSearch(e.target.value)} />
                            <div className="grid grid-cols-2 md:grid-cols-3 gap-2 max-h-56 overflow-auto">
                                {browseProducts.map(p => (
                                    <div key={p.id} onClick={() => addFromBrowse(p)} className="cursor-pointer bg-white border rounded p-2 hover:bg-blue-100 text-sm">
                                        <div className="font-bold truncate">{p.name}</div>
                                        <div className="text-xs text-gray-500 flex justify-between"><span>{p.unit}</span><span className="font-bold text-blue-600">₹{p.priceSell}</span></div>
                                    </div>
                                ))}
                                {browseProducts.length === 0 && <p className="text-xs text-gray-400 col-span-3 text-center py-4">Koi item nahi mila.</p>}
                            </div>
                        </div>

                        <div className="bg-gray-50 p-4 rounded mb-6 relative">
                            <h4 className="font-bold mb-2 text-sm text-gray-600">Ya Manually Add Karo (naya/custom item)</h4>
                            <div className="flex gap-2">
                                <div className="flex-1 relative">
                                    <input className="w-full border p-2 rounded" placeholder="Item Name" value={manualItem.name} onChange={e => searchForRec(e.target.value)} />
                                    {rec.length > 0 && (
                                        <div className="absolute top-full left-0 w-full bg-white border shadow-lg z-10 max-h-40 overflow-auto">
                                            {rec.map(r => <div key={r.id} onClick={() => pickRec(r)} className="p-2 hover:bg-gray-100 cursor-pointer text-sm">{r.name} (Stock: {r.stock})</div>)}
                                        </div>
                                    )}
                                </div>
                                <input className="w-20 border p-2 rounded" placeholder="Qty" type="number" value={manualItem.qty} onChange={e => setManualItem({ ...manualItem, qty: e.target.value })} />
                                <select className="w-24 border p-2 rounded" value={manualItem.unit} onChange={e => setManualItem({ ...manualItem, unit: e.target.value })}>{UNITS.map(u => <option key={u}>{u}</option>)}</select>
                                <input className="w-24 border p-2 rounded" placeholder="Rate" type="number" value={manualItem.price} onChange={e => setManualItem({ ...manualItem, price: e.target.value })} />
                                <button onClick={handleManualAdd} className="bg-blue-600 text-white px-4 rounded">+</button>
                            </div>
                        </div>
                        <table className="w-full text-sm border">
                            <thead className="bg-gray-200"><tr><th className="p-2 text-left">Description</th><th className="p-2 w-28">Qty</th><th className="p-2 w-20">Unit</th><th className="p-2 text-right">Rate</th><th className="p-2 text-right">Total</th><th className="w-10"></th></tr></thead>
                            <tbody>
                                {qItems.map((item, i) => (
                                    <tr key={i} className="border-b">
                                        <td className="p-2">{item.name}</td>
                                        <td className="p-2">
                                            <input type="number" min="0" value={item.qty} onChange={e => setQty(i, e.target.value)}
                                                className="border rounded p-1 w-16 text-center" />
                                        </td>
                                        <td className="p-2">{item.unit}</td>
                                        <td className="p-2 text-right">{item.price}</td><td className="p-2 text-right">{item.total}</td>
                                        <td className="p-2 text-red-500 cursor-pointer" onClick={() => setQItems(qItems.filter((_, idx) => idx !== i))}>x</td>
                                    </tr>
                                ))}
                            </tbody>
                            <tfoot><tr><td colSpan="4" className="p-2 text-right font-bold">Total:</td><td className="p-2 text-right font-bold">₹{qItems.reduce((s, i) => s + i.total, 0)}</td><td></td></tr></tfoot>
                        </table>
                    </div>
                </div>
            );
        };

        // ============================================================
        // 9. USER MANAGEMENT (Admin: approve/reject staff, invite code)
        // ============================================================
        const PERMISSION_LABELS = {
            pos: 'Sell (POS/Billing)',
            inventory: 'Add / Restock Inventory',
            reports: 'View Sales Reports',
            profit: 'View Profit & Loss',
            khata: 'Manage Udhar Khata',
            dashboard: 'View Dashboard'
        };

        const UserMgmt = ({ orgId, org, lang }) => {
            const [users, setUsers] = useState([]);
            const [expandedId, setExpandedId] = useState(null);
            const [staffForm, setStaffForm] = useState({ name: '', username: '', password: '' });
            const [staffPerms, setStaffPerms] = useState(defaultPermissions());
            const [creating, setCreating] = useState(false);
            const [createErr, setCreateErr] = useState('');
            const [createOk, setCreateOk] = useState('');
            const [resetTargetId, setResetTargetId] = useState(null); // old user being replaced via password reset
            const [resetTargetName, setResetTargetName] = useState('');
            const formTopRef = useRef();

            useEffect(() => {
                const unsub = db.collection('users').where('orgId', '==', orgId).onSnapshot(snap => {
                    setUsers(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                return unsub;
            }, [orgId]);

            const pending = users.filter(u => u.status === 'pending');
            const active = users.filter(u => u.status === 'active');
            const isStaffLogin = (u) => (u.email || '').endsWith(STAFF_EMAIL_DOMAIN);

            const approve = async (u, role) => {
                const update = { status: 'active', role: role || 'staff' };
                if (role === 'staff') update.permissions = defaultPermissions();
                await db.collection('users').doc(u.id).update(update);
            };
            const reject = async (u) => {
                if (confirm(`Reject ${u.name}'s request?`)) await db.collection('users').doc(u.id).delete();
            };
            const changeRole = async (u, role) => {
                if (u.role === 'owner') return alert('Owner role cannot be changed here.');
                const update = { role };
                if (role === 'staff' && !u.permissions) update.permissions = defaultPermissions();
                await db.collection('users').doc(u.id).update(update);
            };
            const togglePermission = async (u, key) => {
                const perms = { ...(u.permissions || defaultPermissions()) };
                perms[key] = !perms[key];
                await db.collection('users').doc(u.id).update({ permissions: perms });
            };
            const setCommission = async (u, pct) => {
                await db.collection('users').doc(u.id).update({ commissionPct: Number(pct) || 0 });
            };
            const disable = async (u) => {
                if (u.role === 'owner') return alert('Cannot disable the owner.');
                if (confirm(`Disable ${u.name}'s access?`)) await db.collection('users').doc(u.id).update({ status: 'disabled' });
            };
            const reEnable = async (u) => { await db.collection('users').doc(u.id).update({ status: 'active' }); };

            // Firebase (client-side, no backend server) has no way for an admin to
            // directly change someone ELSE's password — only a signed-in user can
            // change their own. So "reset" here means: create a brand-new login
            // (with a new username/password, same name & permissions) and disable
            // the old one. It's two clicks instead of one, but fully self-contained
            // — no backend/Cloud Functions needed.
            const startPasswordReset = (u) => {
                const suggested = (u.email || '').replace(STAFF_EMAIL_DOMAIN, '') + '2';
                setStaffForm({ name: u.name, username: suggested, password: '' });
                setStaffPerms(u.permissions || defaultPermissions());
                setResetTargetId(u.id);
                setResetTargetName(u.name);
                setCreateErr(''); setCreateOk('');
                if (formTopRef.current) formTopRef.current.scrollIntoView({ behavior: 'smooth' });
            };
            const cancelReset = () => {
                setResetTargetId(null); setResetTargetName('');
                setStaffForm({ name: '', username: '', password: '' });
                setStaffPerms(defaultPermissions());
            };

            const createStaffLogin = async (e) => {
                e.preventDefault();
                setCreateErr(''); setCreateOk('');
                const uname = staffForm.username.trim().toLowerCase().replace(/\s+/g, '');
                if (!staffForm.name.trim() || !uname || staffForm.password.length < 6) {
                    setCreateErr('Naam, username bharo aur password kam se kam 6 characters ka rakho.');
                    return;
                }
                setCreating(true);
                try {
                    const secAuth = getSecondaryAuth();
                    const cred = await secAuth.createUserWithEmailAndPassword(uname + STAFF_EMAIL_DOMAIN, staffForm.password);
                    await cred.user.updateProfile({ displayName: staffForm.name.trim() });
                    await db.collection('users').doc(cred.user.uid).set({
                        uid: cred.user.uid, name: staffForm.name.trim(), email: cred.user.email, photoURL: '',
                        orgId, role: 'staff', status: 'active', permissions: staffPerms,
                        createdAt: FieldValue.serverTimestamp()
                    });
                    await secAuth.signOut();
                    if (resetTargetId) {
                        await db.collection('users').doc(resetTargetId).update({ status: 'disabled' });
                        setCreateOk(`Naya password set ho gaya! "${staffForm.name.trim()}" ab is naye username se login karega: ${uname}`);
                    } else {
                        setCreateOk(`"${staffForm.name.trim()}" ka login ban gaya! Username: ${uname}`);
                    }
                    setStaffForm({ name: '', username: '', password: '' });
                    setStaffPerms(defaultPermissions());
                    setResetTargetId(null); setResetTargetName('');
                } catch (e2) {
                    if (e2.code === 'auth/email-already-in-use') setCreateErr('Ye username pehle se liya hua hai, dusra try karo.');
                    else if (e2.code === 'auth/weak-password') setCreateErr('Password kamzor hai, kam se kam 6 characters rakho.');
                    else setCreateErr(e2.message);
                } finally {
                    setCreating(false);
                }
            };

            return (
                <div className="p-6 overflow-auto">
                    <h2 className="text-xl font-bold mb-4">{t(lang, 'nav_users')}</h2>

                    <div ref={formTopRef} className="bg-white p-4 rounded shadow mb-6 max-w-2xl border-l-4 border-orange-500">
                        <h3 className="font-bold mb-1">{resetTargetId ? `Password Reset — ${resetTargetName}` : 'Staff Login Banayein (Username + Password)'}</h3>
                        <p className="text-xs text-gray-500 mb-3">
                            {resetTargetId
                                ? 'Naya username + password do — purana login apne aap disable ho jayega jab naya ban jayega.'
                                : 'Isse staff ko Gmail ki zaroorat nahi — seedha login active ho jata hai, approval ka wait nahi karna padta.'}
                        </p>
                        {resetTargetId && <button onClick={cancelReset} className="text-xs bg-gray-100 px-2 py-1 rounded mb-2">Cancel Reset</button>}
                        <form onSubmit={createStaffLogin} className="grid grid-cols-1 md:grid-cols-3 gap-2 mb-3">
                            <input placeholder="Staff ka Naam" className="border p-2 rounded" value={staffForm.name} onChange={e => setStaffForm({ ...staffForm, name: e.target.value })} required />
                            <input placeholder="Username (jaise ramesh)" className="border p-2 rounded" value={staffForm.username} onChange={e => setStaffForm({ ...staffForm, username: e.target.value })} required />
                            <input type="password" placeholder="Password (min 6 chars)" className="border p-2 rounded" value={staffForm.password} onChange={e => setStaffForm({ ...staffForm, password: e.target.value })} required />
                        </form>
                        <div className="grid grid-cols-2 gap-1 mb-3 bg-gray-50 p-3 rounded">
                            {Object.keys(PERMISSION_LABELS).map(key => (
                                <label key={key} className="flex items-center gap-2 text-sm cursor-pointer">
                                    <input type="checkbox" checked={!!staffPerms[key]} onChange={() => setStaffPerms({ ...staffPerms, [key]: !staffPerms[key] })} />
                                    {PERMISSION_LABELS[key]}
                                </label>
                            ))}
                        </div>
                        {createErr && <p className="text-red-600 text-sm mb-2">{createErr}</p>}
                        {createOk && <p className="text-green-600 text-sm mb-2 font-bold">{createOk}</p>}
                        <button onClick={createStaffLogin} disabled={creating} className="bg-orange-600 text-white px-4 py-2 rounded font-bold disabled:opacity-50">
                            {creating ? 'Banaya ja raha hai...' : 'Staff Login Banayein'}
                        </button>
                    </div>

                    <p className="text-sm text-gray-500 mb-4 max-w-2xl">
                        Isके alawa koi Google se login karke <strong>"Access Request Bhejein"</strong> bhi kar sakta hai —
                        uska request neeche "Pending Approvals" me aayega.
                    </p>

                    {pending.length > 0 && (
                        <div className="bg-white p-4 rounded shadow mb-6 max-w-2xl border-l-4 border-yellow-500">
                            <h3 className="font-bold mb-2">Pending Approvals ({pending.length})</h3>
                            {pending.map(u => (
                                <div key={u.id} className="flex justify-between items-center border-b py-3">
                                    <div><span className="font-bold">{u.name}</span><div className="text-xs text-gray-500">{u.email}</div></div>
                                    <div className="flex gap-2">
                                        <button onClick={() => approve(u, 'staff')} className="bg-green-600 text-white px-3 py-1 rounded text-sm">Approve as Staff</button>
                                        <button onClick={() => approve(u, 'admin')} className="bg-blue-600 text-white px-3 py-1 rounded text-sm">Approve as Admin (Full Access)</button>
                                        <button onClick={() => reject(u)} className="bg-gray-200 px-3 py-1 rounded text-sm">Reject</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    <div className="bg-white p-4 rounded shadow max-w-2xl">
                        <h3 className="font-bold mb-2">Team Members ({active.length})</h3>
                        <p className="text-xs text-gray-500 mb-2">Admin/Owner ko hamesha full access hota hai. Staff ke liye niche "Permissions" se control karein ki wo kya-kya kar sakta hai.</p>
                        <ul>
                            {active.map(u => {
                                const perms = u.permissions || defaultPermissions();
                                return (
                                    <li key={u.id} className="border-b py-3">
                                        <div className="flex justify-between items-center">
                                            <div>
                                                <span className="font-bold">{u.name}</span> <span className="text-xs bg-gray-200 px-1 rounded">{u.role}</span>
                                                {isStaffLogin(u) && <span className="text-xs bg-orange-100 text-orange-700 px-1 rounded ml-1">Username Login</span>}
                                                <div className="text-xs text-gray-500">{isStaffLogin(u) ? 'Username: ' + u.email.replace(STAFF_EMAIL_DOMAIN, '') : u.email}</div>
                                            </div>
                                            {u.role !== 'owner' && (
                                                <div className="flex gap-2 items-center">
                                                    <select className="border p-1 rounded text-sm" value={u.role} onChange={e => changeRole(u, e.target.value)}>
                                                        <option value="staff">Staff</option>
                                                        <option value="admin">Admin (Full Access)</option>
                                                    </select>
                                                    {u.role === 'staff' && (
                                                        <button onClick={() => setExpandedId(expandedId === u.id ? null : u.id)} className="text-blue-600 text-sm border px-2 py-1 rounded">
                                                            {expandedId === u.id ? 'Hide' : 'Permissions'}
                                                        </button>
                                                    )}
                                                    {isStaffLogin(u) && (
                                                        <button onClick={() => startPasswordReset(u)} className="text-orange-600 text-sm border px-2 py-1 rounded">🔑 Reset Password</button>
                                                    )}
                                                    <button onClick={() => disable(u)} className="text-red-600 text-sm border px-2 py-1 rounded">Disable</button>
                                                </div>
                                            )}
                                        </div>
                                        {u.role === 'staff' && expandedId === u.id && (
                                            <div className="mt-2 ml-1 bg-gray-50 p-3 rounded">
                                                <div className="grid grid-cols-2 gap-1 mb-3">
                                                    {Object.keys(PERMISSION_LABELS).map(key => (
                                                        <label key={key} className="flex items-center gap-2 text-sm cursor-pointer">
                                                            <input type="checkbox" checked={!!perms[key]} onChange={() => togglePermission(u, key)} />
                                                            {PERMISSION_LABELS[key]}
                                                        </label>
                                                    ))}
                                                </div>
                                                <div className="flex items-center gap-2 pt-2 border-t">
                                                    <label className="text-sm font-bold">Commission %:</label>
                                                    <input type="number" min="0" max="100" step="0.5" defaultValue={u.commissionPct || 0}
                                                        onBlur={e => setCommission(u, e.target.value)}
                                                        className="border p-1 rounded w-20 text-sm" />
                                                    <span className="text-xs text-gray-400">(sales value ka % — bill complete hote hi calculate hota hai)</span>
                                                </div>
                                            </div>
                                        )}
                                    </li>
                                );
                            })}
                            {users.filter(u => u.status === 'disabled').map(u => (
                                <li key={u.id} className="flex justify-between items-center border-b py-3 opacity-60">
                                    <div><span className="font-bold">{u.name}</span> <span className="text-xs bg-red-100 text-red-700 px-1 rounded">disabled</span></div>
                                    <button onClick={() => reEnable(u)} className="text-green-600 text-sm border px-2 py-1 rounded">Re-enable</button>
                                </li>
                            ))}
                        </ul>
                    </div>
                </div>
            );
        };

        // ============================================================
        // 10. SETTINGS (org profile used on printed bills)
        // ============================================================
        const Settings = ({ orgId, org, lang }) => {
            const [form, setForm] = useState({ name: org.name || '', address: org.address || '', mobile: org.mobile || '', gstin: org.gstin || '' });
            const [saved, setSaved] = useState(false);
            const [backupBusy, setBackupBusy] = useState(false);
            const [restoreBusy, setRestoreBusy] = useState(false);
            const [restoreMsg, setRestoreMsg] = useState('');
            const [logoBusy, setLogoBusy] = useState(false);
            const [logoErr, setLogoErr] = useState('');
            const restoreFileRef = useRef();
            const logoFileRef = useRef();

            const save = async (e) => {
                e.preventDefault();
                await db.collection('orgs').doc(orgId).update(form);
                setSaved(true); setTimeout(() => setSaved(false), 1500);
            };

            // Resize the uploaded logo down to a small PNG before storing it as a
            // data-URL on the org doc (Firestore documents are capped at 1MB, so
            // a shrunk logo keeps everything comfortably small and fast to load).
            const handleLogoUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setLogoErr(''); setLogoBusy(true);
                const img = new Image();
                const reader = new FileReader();
                reader.onload = (ev) => {
                    img.onload = async () => {
                        try {
                            const maxW = 240;
                            const scale = Math.min(1, maxW / img.width);
                            const canvas = document.createElement('canvas');
                            canvas.width = img.width * scale;
                            canvas.height = img.height * scale;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            const dataUrl = canvas.toDataURL('image/png');
                            await db.collection('orgs').doc(orgId).update({ logoDataUrl: dataUrl });
                        } catch (err) {
                            setLogoErr('Error: ' + err.message);
                        } finally {
                            setLogoBusy(false);
                            if (logoFileRef.current) logoFileRef.current.value = '';
                        }
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            };

            const removeLogo = async () => {
                if (confirm('Logo remove karna hai?')) await db.collection('orgs').doc(orgId).update({ logoDataUrl: FieldValue.delete() });
            };

            // Full backup — everything under this business, in one downloadable
            // JSON file. Keep this safe (Google Drive / pendrive) as insurance
            // in case something ever goes wrong.
            const downloadBackup = async () => {
                setBackupBusy(true);
                try {
                    const orgRef = db.collection('orgs').doc(orgId);
                    const [productsSnap, salesSnap, purchasesSnap, expensesSnap, returnsSnap, partiesSnap] = await Promise.all([
                        orgRef.collection('products').get(),
                        orgRef.collection('sales').get(),
                        orgRef.collection('purchases').get(),
                        orgRef.collection('expenses').get(),
                        orgRef.collection('returns').get(),
                        orgRef.collection('parties').get()
                    ]);
                    const parties = [];
                    for (const p of partiesSnap.docs) {
                        const txnsSnap = await orgRef.collection('parties').doc(p.id).collection('transactions').get();
                        parties.push({ id: p.id, ...p.data(), transactions: txnsSnap.docs.map(t => ({ id: t.id, ...t.data() })) });
                    }
                    const backup = {

        function t(lang, key) { return (TRANSLATIONS[lang] && TRANSLATIONS[lang][key]) || TRANSLATIONS.en[key] || key; }

        // Opens WhatsApp (app on phone, WhatsApp Web on desktop) with a message
        // pre-filled for the given number — no backend/API needed, the staff just
        // taps Send. Assumes Indian 10-digit mobile numbers if no country code given.
        function sendWhatsApp(mobile, message) {
            if (!mobile) { alert('Mobile number nahi hai.'); return; }
            let digits = mobile.replace(/\D/g, '');
            if (digits.length === 10) digits = '91' + digits;
            window.open(`https://wa.me/${digits}?text=${encodeURIComponent(message)}`, '_blank');
        }

        // Builds a bilingual (English + Marathi) itemised bill message for
        // WhatsApp — greeting, material-wise breakdown, and clear payment status.
        function buildBillMessage(sale, org) {
            const name = sale.customer.name || '';
            const itemLines = (sale.cart || []).map((it, idx) =>
                `${idx + 1}. ${it.name} — ${it.qty} ${it.unit} = ₹${it.total.toFixed(2)}`
            ).join('\n');
            const paidAmt = sale.cashAmount != null ? sale.cashAmount : (sale.grandTotal - (sale.udharAmount || 0));
            const udharAmt = sale.udharAmount || 0;

            let msg = `🙏 नमस्कार / Namaste ${name}!\n\n`;
            msg += `*${org.name}* कडून तुमचे बिल / your bill:\nBill #${sale.id.toString().slice(-6)} · ${new Date(sale.date).toLocaleDateString()}\n\n`;
            msg += `📦 *माल / Items:*\n${itemLines}\n\n`;
            msg += `💰 एकूण / Total: ₹${sale.grandTotal.toFixed(2)}\n`;
            if (paidAmt > 0) msg += `✅ जमा / Paid: ₹${paidAmt.toFixed(2)}\n`;
            if (udharAmt > 0) msg += `🔴 उधार बाकी / Udhar Due: ₹${udharAmt.toFixed(2)}${sale.dueDate ? ` (by ${new Date(sale.dueDate).toLocaleDateString()})` : ''}\n`;
            msg += `\nधन्यवाद! Thank you for shopping with us! 🙏\n${org.name}${org.mobile ? ' · ' + org.mobile : ''}`;
            return msg;
        }

        // Builds the bill PDF document (jsPDF object) — shared by both the plain
        // "download" button and the "share with attachment" flow below.
        function buildBillPDFDoc(sale, org) {
            const doc = new window.jspdf.jsPDF();
            doc.setFontSize(16);
            doc.text(org.name, 14, 15);
            doc.setFontSize(9);
            doc.text(`${org.address || ''} ${org.mobile ? '| ' + org.mobile : ''}`, 14, 21);
            doc.setFontSize(12);
            doc.text(`Bill #${sale.id.toString().slice(-6)}  ·  ${new Date(sale.date).toLocaleDateString()}`, 14, 30);
            doc.text(`Customer: ${sale.customer.name || 'Walk-in'}${sale.customer.mobile ? ' (' + sale.customer.mobile + ')' : ''}`, 14, 37);
            doc.autoTable({
                startY: 43,
                head: [['Item', 'Qty', 'Rate', 'Total']],
                body: (sale.cart || []).map(it => [it.name, `${it.qty} ${it.unit}`, `Rs.${it.finalPrice.toFixed(2)}`, `Rs.${it.total.toFixed(2)}`]),
                styles: { fontSize: 10 }
            });
            const y = doc.lastAutoTable.finalY + 8;
            doc.setFontSize(11);
            doc.text(`Grand Total: Rs.${sale.grandTotal.toFixed(2)}`, 14, y);
            const paidAmt = sale.cashAmount != null ? sale.cashAmount : (sale.grandTotal - (sale.udharAmount || 0));
            if (paidAmt > 0) doc.text(`Paid: Rs.${paidAmt.toFixed(2)}`, 14, y + 7);
            if (sale.udharAmount > 0) doc.text(`Udhar Due: Rs.${sale.udharAmount.toFixed(2)}`, 14, y + 14);
            return doc;
        }

        function downloadBillPDF(sale, org) {
            buildBillPDFDoc(sale, org).save(`Bill_${sale.id.toString().slice(-6)}.pdf`);
        }

        // Tries to share the PDF + message TOGETHER via the phone's native Share
        // sheet (Web Share API) — on most Android/iPhone browsers this lets the
        // person pick WhatsApp and the PDF arrives already attached, message
        // pre-filled as the caption; they just tap Send. This needs no backend
        // and no paid API — it's a real browser capability, not a workaround.
        // On desktop browsers that don't support sharing files, it automatically
        // falls back to: download the PDF + open WhatsApp with the text message
        // (the old behaviour), since desktop WhatsApp Web has no way to receive
        // an auto-attached file from a webpage.
        async function shareViaWhatsApp(sale, org) {
            const message = buildBillMessage(sale, org);
            try {
                const doc = buildBillPDFDoc(sale, org);
                const blob = doc.output('blob');
                const file = new File([blob], `Bill_${sale.id.toString().slice(-6)}.pdf`, { type: 'application/pdf' });
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({ files: [file], text: message, title: 'Bill' });
                    return;
                }
            } catch (e) {
                // If the person cancels the share sheet, or sharing fails for any
                // reason, fall through to the manual-attach fallback below.
                if (e && e.name === 'AbortError') return; // they just cancelled — don't also open wa.me
            }
            // Fallback: desktop browsers / unsupported devices.
            downloadBillPDF(sale, org);
            sendWhatsApp(sale.customer.mobile, message);
            alert('Aapke browser me seedha attach karke bhejna support nahi hota — PDF download ho gaya hai, WhatsApp me use manually attach kar dena.');
        }

        function genInviteCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
            return code;
        }

        // Default permissions given to a newly-approved "staff" user.
        // Owner/Admin always get full access regardless of this object.
        function defaultPermissions() {

        // ============================================================
        // 2. ONBOARDING (first-time user: create new business OR join existing)
        // ============================================================
        // Single-business mode: no matter how many org documents technically
        // exist, the app always attaches every new sign-in to the FIRST org it
        // finds. The very first person to ever sign in creates it and becomes
        // owner; everyone after that is auto-attached as a pending staff
        // request — no invite codes, no "create another business" option.
        // (Multi-business/SaaS mode can be re-enabled later if ever needed.)
        const Onboarding = ({ user }) => {
            const [checking, setChecking] = useState(true);
            const [existingOrg, setExistingOrg] = useState(null); // { id, name } or null
            const [orgName, setOrgName] = useState('');
            const [busy, setBusy] = useState(false);
            const [err, setErr] = useState('');

            useEffect(() => {
                db.collection('orgs').limit(1).get().then(snap => {
                    if (!snap.empty) setExistingOrg({ id: snap.docs[0].id, name: snap.docs[0].data().name });

                });
            }, []);

            const createOrg = async (e) => {
                e.preventDefault();
                if (!orgName.trim()) return;
                setBusy(true); setErr('');
                try {

                    });
                } catch (e2) {
                    setErr(e2.message);
                    setBusy(false);
                }
            };

            const requestAccess = async () => {
                setBusy(true); setErr('');
                try {
                    await db.collection('users').doc(user.uid).set({
                        uid: user.uid, name: user.displayName || 'Staff', email: user.email,
                        photoURL: user.photoURL || '', orgId: existingOrg.id,
                        role: 'staff', status: 'pending', createdAt: FieldValue.serverTimestamp()
                    });
                } catch (e2) {
                    setErr(e2.message);
                    setBusy(false);
                }
            };

            if (checking) return <div className="min-h-screen flex items-center justify-center bg-slate-800 text-white">Loading...</div>;

            return (
                <div className="min-h-screen flex items-center justify-center bg-slate-800 p-4">
                    <div className="bg-white p-8 rounded-lg shadow-xl w-full max-w-md text-center">
                        <h2 className="text-xl font-bold mb-1">Namaste, {user.displayName}!</h2>

                        {!existingOrg && (
                            <>
                                <p className="text-gray-500 mb-6 text-sm">Aap sabse pehle login karne wale hain — apna business set up karein.</p>
                                <form onSubmit={createOrg} className="space-y-4 text-left">
                                    <label className="block text-sm font-medium">Business / Shop Ka Naam</label>

                                    <button disabled={busy} className="w-full bg-orange-600 hover:bg-orange-700 text-white p-3 rounded font-bold disabled:opacity-50">{busy ? 'Setting up...' : 'Business Shuru Karein'}</button>
                                </form>

                            <>
                                <p className="text-gray-500 mb-6 text-sm"><strong>{existingOrg.name}</strong> me access ke liye admin ko request bhejein. Approve hote hi aap login kar sakenge.</p>

                                <button onClick={requestAccess} disabled={busy} className="w-full bg-blue-600 hover:bg-blue-700 text-white p-3 rounded font-bold disabled:opacity-50">

        // ============================================================
        // 3. PENDING APPROVAL SCREEN
        // ============================================================
        const PendingApproval = ({ orgName }) => (
            <div className="min-h-screen flex items-center justify-center bg-slate-800">
                <div className="bg-white p-8 rounded-lg shadow-xl w-96 text-center">
                    <div className="text-5xl mb-4">⏳</div>
                    <h2 className="text-xl font-bold mb-2">Approval Pending</h2>
                    <p className="text-gray-500 mb-6">Aapka request <strong>{orgName || 'business'}</strong> ke admin ko bhej diya gaya hai. Approve hote hi aap login kar sakenge.</p>
                    <button onClick={() => auth.signOut()} className="bg-red-600 text-white px-4 py-2 rounded font-bold">Logout</button>
                </div>
            </div>
        );

        // ============================================================
        // 4. DASHBOARD
        // ============================================================
        const Dashboard = ({ sales, products, lang }) => {
            const [filter, setFilter] = useState({ from: '', to: '' });
            const [notifPermission, setNotifPermission] = useState(typeof Notification !== 'undefined' ? Notification.permission : 'unsupported');

            const stats = useMemo(() => {
                const activeSales = sales.filter(s => {
                    if (s.voided) return false;
                    const d = (s.date || '').split('T')[0];
                    if (filter.from && d < filter.from) return false;
                    if (filter.to && d > filter.to) return false;
                    return true;
                });

                const totalSales = activeSales.reduce((sum, s) => sum + (s.grandTotal || 0) - (s.returnedTotal || 0), 0);
                const totalProfit = activeSales.reduce((sum, s) => sum + (s.totalProfit || 0) - (s.returnedProfit || 0), 0);
                const lowStockItems = products.filter(p => p.stock < 10).sort((a, b) => a.stock - b.stock);
                const prodMap = {};
                activeSales.forEach(s => (s.cart || []).forEach(c => { prodMap[c.name] = (prodMap[c.name] || 0) + c.qty; }));
                const hero = Object.entries(prodMap).sort((a, b) => b[1] - a[1])[0];

                // Category-wise breakdown: stock value, low stock count, units sold, revenue, hero product
                const catMap = {};
                const ensure = (cat) => { if (!catMap[cat]) catMap[cat] = { items: 0, stockValue: 0, lowStock: 0, unitsSold: 0, revenue: 0, heroMap: {} }; return catMap[cat]; };
                products.forEach(p => {
                    const c = ensure(p.category || 'Other');
                    c.items++;
                    c.stockValue += (p.priceBuy || 0) * p.stock;
                    if (p.stock < 10) c.lowStock++;
                });
                activeSales.forEach(s => (s.cart || []).forEach(item => {
                    const c = ensure(item.category || 'Other');
                    c.unitsSold += item.qty;
                    c.revenue += item.total;
                    c.heroMap[item.name] = (c.heroMap[item.name] || 0) + item.qty;
                }));
                const categoryStats = Object.entries(catMap).map(([cat, d]) => {
                    const heroSorted = Object.entries(d.heroMap).sort((a, b) => b[1] - a[1]);
                    return { category: cat, items: d.items, stockValue: d.stockValue, lowStock: d.lowStock, unitsSold: d.unitsSold, revenue: d.revenue, hero: heroSorted[0] ? heroSorted[0][0] : '—' };
                }).sort((a, b) => b.revenue - a.revenue);

                return { totalSales, totalProfit, lowStockItems, hero: hero ? hero[0] : 'None', categoryStats, billCount: activeSales.length };
            }, [sales, products, filter]);

            // Month-over-month (or period-over-period) comparison: if no explicit
            // date filter is set, compares this calendar month vs last calendar
            // month. If a filter IS set, compares against the equal-length period
            // immediately before it.
            const comparison = useMemo(() => {
                let curFrom, curTo, prevFrom, prevTo;
                const today = new Date();
                if (filter.from || filter.to) {
                    curFrom = filter.from || '2000-01-01';
                    curTo = filter.to || today.toISOString().split('T')[0];
                    const days = Math.max(1, Math.round((new Date(curTo) - new Date(curFrom)) / 86400000) + 1);
                    const prevToDate = new Date(new Date(curFrom).getTime() - 86400000);
                    const prevFromDate = new Date(prevToDate.getTime() - (days - 1) * 86400000);
                    prevFrom = prevFromDate.toISOString().split('T')[0];
                    prevTo = prevToDate.toISOString().split('T')[0];
                } else {
                    const y = today.getFullYear(), m = today.getMonth();
                    curFrom = new Date(y, m, 1).toISOString().split('T')[0];
                    curTo = today.toISOString().split('T')[0];
                    prevFrom = new Date(y, m - 1, 1).toISOString().split('T')[0];
                    prevTo = new Date(y, m, 0).toISOString().split('T')[0];
                }
                const inRange = (dateStr, from, to) => { const d = (dateStr || '').split('T')[0]; return d >= from && d <= to; };
                const prevSales = sales.filter(s => !s.voided && inRange(s.date, prevFrom, prevTo));
                const prevRevenue = prevSales.reduce((s, x) => s + (x.grandTotal || 0) - (x.returnedTotal || 0), 0);
                const prevProfit = prevSales.reduce((s, x) => s + (x.totalProfit || 0) - (x.returnedProfit || 0), 0);
                const pctChange = (cur, prev) => prev === 0 ? (cur > 0 ? 100 : 0) : ((cur - prev) / Math.abs(prev)) * 100;
                return {
                    prevRevenue, prevProfit,
                    revenueChange: pctChange(stats.totalSales, prevRevenue),
                    profitChange: pctChange(stats.totalProfit, prevProfit),
                    isDefaultMonth: !(filter.from || filter.to)
                };
            }, [sales, filter, stats.totalSales, stats.totalProfit]);

            const [showPO, setShowPO] = useState(false);
            const [poQtys, setPoQtys] = useState({});

            const openPO = () => {
                const initial = {};
                stats.lowStockItems.forEach(p => { initial[p.id] = Math.max(20 - p.stock, 10); });
                setPoQtys(initial);
                setShowPO(true);
            };

            const downloadPO = () => {
                const doc = new window.jspdf.jsPDF();
                doc.setFontSize(14);
                doc.text('Suggested Purchase Order', 14, 15);
                doc.setFontSize(9);
                doc.text(`Generated: ${new Date().toLocaleDateString()}`, 14, 21);
                doc.autoTable({
                    startY: 26,
                    head: [['Product', 'Category', 'Current Stock', 'Suggested Qty']],
                    body: stats.lowStockItems.map(p => [p.name, p.category, `${p.stock} ${p.unit}`, poQtys[p.id] || 0]),
                    styles: { fontSize: 9 }
                });
                doc.save(`Purchase_Order_${new Date().toISOString().slice(0, 10)}.pdf`);
            };

            // ============================================================
            // MONTHLY STOCK PLANNING — based on real sales history (not just the
            // dashboard's date filter), works out each product's average monthly
            // sales, tags it Fast/Moderate/Slow/Dead Moving, and suggests how much
            // stock to keep month to month (avg monthly sales × 1.5 safety buffer).
            // ============================================================
            const [stockPlanOpen, setStockPlanOpen] = useState(false);
            const stockPlan = useMemo(() => {
                const goodSales = sales.filter(s => !s.voided);
                let months = 1;
                if (goodSales.length) {
                    const earliest = new Date(Math.min(...goodSales.map(s => new Date(s.date).getTime())));
                    const now = new Date();
                    months = Math.max(1, (now.getFullYear() - earliest.getFullYear()) * 12 + (now.getMonth() - earliest.getMonth()) + 1);
                }
                const qtyMap = {};
                goodSales.forEach(s => (s.cart || []).forEach(item => {
                    qtyMap[item.id] = (qtyMap[item.id] || 0) + item.qty - (item.returnedQty || 0);
                }));
                const rows = products.map(p => {
                    const totalSold = qtyMap[p.id] || 0;
                    const avgMonthly = totalSold / months;
                    return { ...p, totalSold, avgMonthly, recommendedStock: Math.ceil(avgMonthly * 1.5) };
                }).sort((a, b) => b.avgMonthly - a.avgMonthly);
                const n = rows.length || 1;
                rows.forEach((r, i) => {
                    if (r.totalSold === 0) r.tag = 'Dead Stock';
                    else if (i < n * 0.2) r.tag = 'Fast Moving';
                    else if (i < n * 0.7) r.tag = 'Moderate';
                    else r.tag = 'Slow Moving';
                });
                return { rows, months };
            }, [sales, products]);

            const TAG_COLORS = { 'Fast Moving': 'bg-green-100 text-green-700', 'Moderate': 'bg-blue-100 text-blue-700', 'Slow Moving': 'bg-yellow-100 text-yellow-700', 'Dead Stock': 'bg-gray-200 text-gray-500' };

            const downloadStockPlan = () => {
                const doc = new window.jspdf.jsPDF();
                doc.setFontSize(14);
                doc.text('Monthly Stock Planning', 14, 15);
                doc.setFontSize(9);
                doc.text(`Based on last ${stockPlan.months} month(s) of sales data`, 14, 21);
                doc.autoTable({
                    startY: 26,
                    head: [['Product', 'Category', 'Avg Monthly Sold', 'Current Stock', 'Recommended Stock', 'Status']],
                    body: stockPlan.rows.map(r => [r.name, r.category, r.avgMonthly.toFixed(1), `${r.stock} ${r.unit}`, r.recommendedStock, r.tag]),
                    styles: { fontSize: 8 }
                });
                doc.save(`Stock_Planning_${new Date().toISOString().slice(0, 10)}.pdf`);
            };

            // Fire a single browser notification per page-load if permission is
            // already granted and something is low in stock (opt-in via the button below).
            useEffect(() => {
                if (notifPermission === 'granted' && stats.lowStockItems.length > 0) {
                    try {
                        new Notification('BuildMart POS — Low Stock Alert', {
                            body: `${stats.lowStockItems.length} items kam stock me hain: ${stats.lowStockItems.slice(0, 3).map(p => p.name).join(', ')}${stats.lowStockItems.length > 3 ? '...' : ''}`
                        });
                    } catch (e) { /* some browsers block this silently, ignore */ }
                }
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, []); // only once per Dashboard mount, not on every stats recalculation

            const enableNotifications = () => {
                if (typeof Notification === 'undefined') return alert('Ye browser notifications support nahi karta.');
                Notification.requestPermission().then(p => setNotifPermission(p));
            };

            return (
                <div className="p-6 overflow-auto">
                    <div className="flex flex-wrap justify-between items-end gap-4 mb-6">
                        <h2 className="text-2xl font-bold">Business Overview</h2>
                        <div className="flex gap-2 items-end">
                            {notifPermission !== 'granted' && notifPermission !== 'unsupported' && (
                                <button onClick={enableNotifications} className="text-xs bg-yellow-100 text-yellow-800 px-3 py-2 rounded font-bold self-center">🔔 Low Stock Alerts On Karo</button>
                            )}
                            <div className="flex gap-2 items-end bg-white p-2 rounded shadow">
                                <div><label className="text-xs font-bold block text-gray-500">From</label><input type="date" className="border p-1 rounded text-sm" value={filter.from} onChange={e => setFilter({ ...filter, from: e.target.value })} /></div>
                                <div><label className="text-xs font-bold block text-gray-500">To</label><input type="date" className="border p-1 rounded text-sm" value={filter.to} onChange={e => setFilter({ ...filter, to: e.target.value })} /></div>
                                {(filter.from || filter.to) && <button onClick={() => setFilter({ from: '', to: '' })} className="text-xs bg-gray-100 px-2 py-1 rounded">Clear</button>}
                            </div>
                        </div>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                        <div className="bg-white p-4 rounded shadow border-l-4 border-blue-500">
                            <p className="text-gray-500">Total Revenue ({stats.billCount} bills)</p>
                            <h3 className="text-2xl font-bold">₹{stats.totalSales.toLocaleString()}</h3>
                            <p className={`text-xs font-bold mt-1 ${comparison.revenueChange >= 0 ? 'text-green-600' : 'text-red-600'}`}>
                                {comparison.revenueChange >= 0 ? '▲' : '▼'} {Math.abs(comparison.revenueChange).toFixed(1)}% vs {comparison.isDefaultMonth ? 'last month' : 'previous period'}
                            </p>
                        </div>
                        <div className="bg-white p-4 rounded shadow border-l-4 border-green-500">
                            <p className="text-gray-500">Net Profit</p>
                            <h3 className="text-2xl font-bold text-green-600">₹{stats.totalProfit.toLocaleString()}</h3>
                            <p className={`text-xs font-bold mt-1 ${comparison.profitChange >= 0 ? 'text-green-600' : 'text-red-600'}`}>
                                {comparison.profitChange >= 0 ? '▲' : '▼'} {Math.abs(comparison.profitChange).toFixed(1)}% vs {comparison.isDefaultMonth ? 'last month' : 'previous period'}
                            </p>
                        </div>
                        <div className="bg-white p-4 rounded shadow border-l-4 border-red-500">
                            <p className="text-gray-500">Low Stock Items</p>
                            <h3 className="text-2xl font-bold text-red-600">{stats.lowStockItems.length}</h3>
                        </div>
                        <div className="bg-white p-4 rounded shadow border-l-4 border-yellow-500">
                            <p className="text-gray-500">Top Selling (Hero)</p>
                            <h3 className="text-lg font-bold truncate">{stats.hero}</h3>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                        <div className="bg-white rounded shadow overflow-hidden">
                            <div className="p-3 bg-gray-50 border-b font-bold">Category Performance</div>
                            <table className="w-full text-sm">
                                <thead className="text-left text-gray-500 border-b">
                                    <tr><th className="p-2">Category</th><th className="p-2">Stock Value</th><th className="p-2">Low</th><th className="p-2">Sold</th><th className="p-2">Revenue</th><th className="p-2">Hero</th></tr>
                                </thead>
                                <tbody>
                                    {stats.categoryStats.map(c => (
                                        <tr key={c.category} className="border-b hover:bg-gray-50">
                                            <td className="p-2 font-bold">{catLabel(lang, c.category)}</td>
                                            <td className="p-2">₹{c.stockValue.toLocaleString()}</td>
                                            <td className={`p-2 font-bold ${c.lowStock > 0 ? 'text-red-600' : 'text-gray-400'}`}>{c.lowStock}</td>
                                            <td className="p-2">{c.unitsSold}</td>
                                            <td className="p-2 font-bold">₹{c.revenue.toLocaleString()}</td>
                                            <td className="p-2 text-xs truncate max-w-[120px]" title={c.hero}>{c.hero}</td>
                                        </tr>
                                    ))}
                                    {stats.categoryStats.length === 0 && <tr><td colSpan="6" className="p-4 text-center text-gray-400">Koi data nahi hai abhi.</td></tr>}
                                </tbody>
                            </table>
                        </div>

                        <div className="bg-white rounded shadow overflow-hidden">
                            <div className="p-3 bg-gray-50 border-b font-bold text-red-600 flex justify-between items-center">
                                <span>⚠ Low Stock Alert (&lt; 10)</span>
                                {stats.lowStockItems.length > 0 && <button onClick={openPO} className="text-xs bg-orange-600 text-white px-2 py-1 rounded font-bold">📝 Purchase Order</button>}
                            </div>
                            <div className="max-h-80 overflow-auto">
                                {stats.lowStockItems.map(p => (
                                    <div key={p.id} className="flex justify-between items-center p-2 border-b text-sm">
                                        <div>
                                            <div className="font-bold">{p.name}</div>
                                            <div className="text-xs text-gray-500">{catLabel(lang, p.category)}{p.brand ? ' · ' + p.brand : ''}</div>
                                        </div>
                                        <div className="text-red-600 font-bold">{p.stock} {unitLabel(lang, p.unit)}</div>
                                    </div>
                                ))}
                                {stats.lowStockItems.length === 0 && <div className="p-4 text-center text-gray-400 text-sm">Sab stock theek hai 👍</div>}
                            </div>
                        </div>
                    </div>

                    <div className="bg-white rounded shadow overflow-hidden mt-4">
                        <div className="p-3 bg-gray-50 border-b font-bold flex justify-between items-center">
                            <span>📈 Monthly Stock Planning — Kya Zyada Bikta Hai, Kitna Rakhna Chahiye</span>
                            <div className="flex gap-2">
                                <button onClick={() => setStockPlanOpen(!stockPlanOpen)} className="text-xs bg-slate-700 text-white px-2 py-1 rounded font-bold">{stockPlanOpen ? 'Chhupao' : 'Poori List Dekho'}</button>
                                <button onClick={downloadStockPlan} className="text-xs bg-red-600 text-white px-2 py-1 rounded font-bold">PDF</button>
                            </div>
                        </div>
                        <p className="text-xs text-gray-500 p-2 border-b">Pichhle {stockPlan.months} mahine ke sales data ke hisaab se — "Recommended Stock" = average monthly bikri × 1.5 (safety buffer).</p>
                        <div className={`overflow-auto ${stockPlanOpen ? 'max-h-[32rem]' : 'max-h-64'}`}>
                            <table className="w-full text-sm">
                                <thead className="text-left text-gray-500 border-b bg-gray-50 sticky top-0">
                                    <tr><th className="p-2">Product</th><th className="p-2">Category</th><th className="p-2">Avg/Month</th><th className="p-2">Current Stock</th><th className="p-2">Recommended</th><th className="p-2">Status</th></tr>
                                </thead>
                                <tbody>
                                    {(stockPlanOpen ? stockPlan.rows : stockPlan.rows.slice(0, 8)).map(r => (
                                        <tr key={r.id} className="border-b hover:bg-gray-50">
                                            <td className="p-2 font-bold">{r.name}</td>
                                            <td className="p-2">{catLabel(lang, r.category)}</td>
                                            <td className="p-2">{r.avgMonthly.toFixed(1)} {unitLabel(lang, r.unit)}</td>
                                            <td className={`p-2 font-bold ${r.stock < r.recommendedStock ? 'text-red-600' : 'text-gray-700'}`}>{r.stock} {unitLabel(lang, r.unit)}</td>
                                            <td className="p-2 font-bold text-blue-700">{r.recommendedStock} {unitLabel(lang, r.unit)}</td>
                                            <td className="p-2"><span className={`text-xs px-2 py-0.5 rounded font-bold ${TAG_COLORS[r.tag]}`}>{r.tag}</span></td>
                                        </tr>
                                    ))}
                                    {stockPlan.rows.length === 0 && <tr><td colSpan="6" className="p-4 text-center text-gray-400">Koi product nahi hai.</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {showPO && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded shadow-xl w-full max-w-lg max-h-[80vh] flex flex-col">
                                <div className="p-4 border-b flex justify-between items-center">
                                    <h3 className="font-bold">Suggested Purchase Order</h3>
                                    <button onClick={() => setShowPO(false)} className="text-gray-400 text-xl">&times;</button>
                                </div>
                                <div className="flex-1 overflow-auto p-4 space-y-2">
                                    {stats.lowStockItems.map(p => (
                                        <div key={p.id} className="flex justify-between items-center border-b pb-2">
                                            <div>
                                                <div className="font-bold text-sm">{p.name}</div>
                                                <div className="text-xs text-gray-500">Current: {p.stock} {p.unit}</div>
                                            </div>
                                            <input type="number" min="0" className="border rounded p-1 w-20 text-center text-sm"
                                                value={poQtys[p.id] || 0} onChange={e => setPoQtys({ ...poQtys, [p.id]: e.target.value })} />
                                        </div>
                                    ))}
                                </div>
                                <div className="p-4 border-t">
                                    <button onClick={downloadPO} className="w-full bg-orange-600 text-white p-3 rounded font-bold">Download PO PDF</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // ============================================================
        // 5. INVENTORY (Firestore-backed)
        // ============================================================
        const GST_SLABS = [0, 5, 12, 18, 28];

        const Inventory = ({ orgId, products, isAdmin, lang, userDoc }) => {
            const [form, setForm] = useState({ name: '', category: 'Hardware', unit: 'Pcs', priceBuy: '', priceSell: '', priceWholesale: '', stock: '', gstApplicable: true, gst: 18, discountAllowed: true, discount: 0, brand: '', spec: '', barcode: '', hsnCode: '', purchaseUnit: '', conversionFactor: 1 });
            const [search, setSearch] = useState('');
            const [suggestions, setSuggestions] = useState([]);
            const [restockProd, setRestockProd] = useState(null); // set when an existing product is picked
            const [supplier, setSupplier] = useState({ name: '', mobile: '' });
            const [purchaseMode, setPurchaseMode] = useState('Cash'); // Cash | Udhar (admin only, tracks supplier khata)
            const [purchaseGstIncluded, setPurchaseGstIncluded] = useState(false); // is GST already included in Purchase Rate?
            const [purchaseDueDate, setPurchaseDueDate] = useState(''); // when supplier payment is due (Udhar purchases)
            const [quickBase, setQuickBase] = useState(''); // base item picked from catalog, e.g. "TMT Steel Bar"
            const [importBusy, setImportBusy] = useState(false);
            const [importMsg, setImportMsg] = useState('');
            const [labelSelection, setLabelSelection] = useState({}); // productId -> qty of labels to print
            const nameRef = useRef();
            const importFileRef = useRef();

            const productsRef = db.collection('orgs').doc(orgId).collection('products');
            const catalogEntry = CATALOG[form.category];

            const resetForm = () => {
                setForm({ name: '', category: 'Hardware', unit: 'Pcs', priceBuy: '', priceSell: '', priceWholesale: '', stock: '', gstApplicable: true, gst: 18, discountAllowed: true, discount: 0, brand: '', spec: '', barcode: '', hsnCode: '', purchaseUnit: '', conversionFactor: 1 });
                setRestockProd(null);
                setSuggestions([]);
                setSupplier({ name: '', mobile: '' });
                setPurchaseMode('Cash');
                setPurchaseGstIncluded(false);
                setPurchaseDueDate('');
                setQuickBase('');
            };

            // Recompute the final product name whenever spec/brand/base item change
            const composeName = (base, spec, brand) => [spec, base, brand ? `- ${brand}` : ''].filter(Boolean).join(' ').trim();

            const handleCategoryChange = (cat) => {
                const entry = CATALOG[cat];
                setForm({ ...form, category: cat, unit: (entry && !restockProd) ? entry.unit : form.unit, gst: (entry && !restockProd) ? entry.gst : form.gst });
                setQuickBase('');
            };

            const pickQuickItem = (item) => {
                setQuickBase(item);
                setForm({ ...form, name: item });
            };

            const updateSpecOrBrand = (field, val) => {
                const cleanVal = val === '__other__' ? '' : val;
                const next = { ...form, [field]: cleanVal };
                if (quickBase) next.name = composeName(quickBase, next.spec, next.brand);
                setForm(next);
            };

            const handleNameChange = (val) => {
                setForm({ ...form, name: val });
                setQuickBase(''); // manual typing overrides quick-pick composition
                if (restockProd && val !== restockProd.name) setRestockProd(null); // typing again = fresh search
                if (val.trim().length > 1) {
                    setSuggestions(products.filter(p => p.name.toLowerCase().includes(val.toLowerCase())).slice(0, 6));
                } else {
                    setSuggestions([]);
                }
            };

            const pickSuggestion = (p) => {
                setForm({
                    name: p.name, category: p.category, unit: p.unit,
                    priceBuy: p.priceBuy, priceSell: p.priceSell, priceWholesale: p.priceWholesale || '',
                    stock: '', gstApplicable: p.gstApplicable !== false, gst: p.gst, discountAllowed: p.discountAllowed !== false, discount: p.discount,
                    brand: p.brand || '', spec: p.spec || '', barcode: p.barcode || ''
                });
                setRestockProd(p);
                setSuggestions([]);
                setQuickBase('');
            };

            const handleAdd = async (e) => {
                e.preventDefault();
                if (!form.name || !form.priceSell) return;

                // Unit conversion: admin may buy in a different unit than they sell
                // in (e.g. buy Steel by the Ton, sell by the Kg). "stock" is always
                // entered in the PURCHASE unit; we convert it into the SELL unit
                // (the unit customers are billed in) before saving.
                const factor = Number(form.conversionFactor) || 1;
                const enteredQty = Number(form.stock) || 0; // in purchase unit
                const stockQty = enteredQty * factor; // in sell unit — what's actually added to inventory
                const buyRatePerPurchaseUnit = Number(form.priceBuy) || 0;
                const buyRate = factor > 0 ? buyRatePerPurchaseUnit / factor : buyRatePerPurchaseUnit; // per sell unit, for correct profit math
                const gstPct = form.gstApplicable ? (Number(form.gst) || 0) : 0;
                const purchaseCost = buyRatePerPurchaseUnit * enteredQty; // actual amount paid to supplier, unaffected by conversion
                const purchaseGstAmt = purchaseGstIncluded ? 0 : purchaseCost * (gstPct / 100);
                const purchaseTotal = purchaseCost + purchaseGstAmt; // what's actually payable to the supplier
                const isSupplierUdhar = isAdmin && purchaseMode === 'Udhar' && supplier.name.trim() && enteredQty > 0;

                let supplierPartyRef = null;
                if (isSupplierUdhar) {
                    const partiesRef = db.collection('orgs').doc(orgId).collection('parties');
                    let existing = null;
                    if (supplier.mobile) {
                        const snap = await partiesRef.where('type', '==', 'supplier').where('mobile', '==', supplier.mobile).limit(1).get();
                        if (!snap.empty) existing = snap.docs[0];
                    }
                    supplierPartyRef = existing ? existing.ref : partiesRef.doc();
                }

                const batch = db.batch();
                const productRef = restockProd ? productsRef.doc(restockProd.id) : productsRef.doc();

                if (restockProd) {
                    batch.update(productRef, {
                        category: form.category, unit: form.unit, brand: form.brand || '', spec: form.spec || '', barcode: form.barcode || '', hsnCode: form.hsnCode || '',
                        priceBuy: buyRate, priceSell: Number(form.priceSell), priceWholesale: form.priceWholesale ? Number(form.priceWholesale) : FieldValue.delete(),
                        gstApplicable: !!form.gstApplicable, gst: gstPct,
                        discountAllowed: !!form.discountAllowed, discount: form.discountAllowed ? (Number(form.discount) || 0) : 0,
                        stock: FieldValue.increment(stockQty)
                    });
                } else {
                    batch.set(productRef, {
                        name: form.name, category: form.category, unit: form.unit, brand: form.brand || '', spec: form.spec || '', barcode: form.barcode || '', hsnCode: form.hsnCode || '',
                        priceBuy: buyRate, priceSell: Number(form.priceSell), priceWholesale: form.priceWholesale ? Number(form.priceWholesale) : null,
                        stock: stockQty, gstApplicable: !!form.gstApplicable, gst: gstPct,
                        discountAllowed: !!form.discountAllowed, discount: form.discountAllowed ? (Number(form.discount) || 0) : 0,
                        createdAt: FieldValue.serverTimestamp()
                    });
                }

                if (isSupplierUdhar) {
                    batch.set(supplierPartyRef, {
                        name: supplier.name, mobile: supplier.mobile || '', type: 'supplier',
                        balance: FieldValue.increment(purchaseTotal),
                        createdAt: FieldValue.serverTimestamp()
                    }, { merge: true });
                    const txnRef = supplierPartyRef.collection('transactions').doc();
                    const purchaseNote = `${form.name} x ${enteredQty} ${form.purchaseUnit || form.unit}${purchaseGstAmt > 0 ? ` (incl. GST ₹${purchaseGstAmt.toFixed(2)})` : ''}`;
                    batch.set(txnRef, {
                        type: 'purchase_credit', amount: purchaseTotal, dueDate: purchaseDueDate || null,
                        note: purchaseNote,
                        date: new Date().toISOString(), createdAt: FieldValue.serverTimestamp()
                    });
                    if (purchaseDueDate) {
                        batch.set(db.collection('orgs').doc(orgId).collection('dueReminders').doc(), {
                            partyId: supplierPartyRef.id, partyName: supplier.name, partyType: 'supplier', mobile: supplier.mobile || '',
                            site: '', amount: purchaseTotal, dueDate: purchaseDueDate,
                            note: purchaseNote,
                            resolved: false, createdAt: FieldValue.serverTimestamp()
                        });
                    }
                }

                // Every stock addition — Cash or Udhar — gets a permanent purchase
                // record, so the Purchase Report is always complete (previously,
                // Cash purchases left no trace at all beyond the stock count going up).
                if (stockQty > 0 && buyRate > 0) {
                    batch.set(db.collection('orgs').doc(orgId).collection('purchases').doc(), {
                        productId: productRef.id, productName: form.name, category: form.category,
                        qty: stockQty, rate: buyRate, gstAmount: purchaseGstAmt, total: purchaseTotal,
                        paymentMode: purchaseMode, supplierName: purchaseMode === 'Udhar' ? supplier.name : '',
                        date: new Date().toISOString(), createdAt: FieldValue.serverTimestamp(),
                        staffName: userDoc.name
                    });
                }

                await batch.commit();
                resetForm();
                nameRef.current.focus();
            };

            const handleDelete = async (id) => {
                if (!isAdmin) return alert('Access Denied');
                if (confirm('Delete product?')) await productsRef.doc(id).delete();
            };

            const downloadImportTemplate = () => {
                const headers = ['Name', 'Category', 'Unit', 'Brand', 'Spec', 'PriceBuy', 'PriceSell', 'Stock', 'GST', 'Discount', 'Barcode'];
                const sample = ['UltraTech Cement', 'Cement', 'Bags', 'UltraTech', '50kg Bag', 320, 380, 100, 28, 0, ''];
                const csv = headers.join(',') + '\n' + sample.join(',') + '\n';
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = 'inventory_import_template.csv'; a.click();
            };

            const handleImportFile = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setImportBusy(true); setImportMsg('');
                try {
                    const data = await file.arrayBuffer();
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });

                    // Column names are matched case-insensitively so "price sell",
                    // "PriceSell", "Sell Rate" style headers all still work.
                    const getCol = (row, ...names) => {
                        for (const key of Object.keys(row)) {
                            const norm = key.toLowerCase().replace(/[\s_]/g, '');
                            if (names.some(n => norm === n.toLowerCase().replace(/[\s_]/g, ''))) return row[key];
                        }
                        return '';
                    };

                    let imported = 0, skipped = 0;
                    const chunks = [];
                    let currentChunk = [];
                    rows.forEach(row => {
                        const name = String(getCol(row, 'name', 'productname', 'item') || '').trim();
                        const priceSell = Number(getCol(row, 'pricesell', 'sellrate', 'sellprice', 'rate'));
                        if (!name || !priceSell) { skipped++; return; }
                        const category = String(getCol(row, 'category') || 'Other').trim() || 'Other';
                        currentChunk.push({
                            name, category: CATEGORIES.includes(category) ? category : 'Other',
                            unit: String(getCol(row, 'unit') || 'Pcs').trim() || 'Pcs',
                            brand: String(getCol(row, 'brand', 'company') || '').trim(),
                            spec: String(getCol(row, 'spec', 'size', 'type') || '').trim(),
                            priceBuy: Number(getCol(row, 'pricebuy', 'purchaserate', 'costprice')) || 0,
                            priceSell,
                            stock: Number(getCol(row, 'stock', 'qty', 'quantity')) || 0,
                            gst: Number(getCol(row, 'gst', 'tax')) || 0,
                            discount: Number(getCol(row, 'discount', 'disc')) || 0,
                            barcode: String(getCol(row, 'barcode', 'ean', 'sku') || '').trim(),
                            createdAt: FieldValue.serverTimestamp()
                        });
                        imported++;
                        if (currentChunk.length === 400) { chunks.push(currentChunk); currentChunk = []; }
                    });
                    if (currentChunk.length) chunks.push(currentChunk);

                    for (const chunk of chunks) {
                        const batch = db.batch();
                        chunk.forEach(p => batch.set(productsRef.doc(), p));
                        await batch.commit();
                    }

                    setImportMsg(`✓ ${imported} products imported${skipped ? `, ${skipped} rows skipped (missing name/price)` : ''}.`);
                } catch (err) {
                    setImportMsg('Error: ' + err.message);
                } finally {
                    setImportBusy(false);
                    if (importFileRef.current) importFileRef.current.value = '';
                }
            };

            const filtered = products.filter(p => p.name.toLowerCase().includes(search.toLowerCase()) || p.category.toLowerCase().includes(search.toLowerCase()) || (p.brand || '').toLowerCase().includes(search.toLowerCase()) || (p.barcode || '').includes(search));

            // Print physical barcode labels for the selected products (each with a
            // quantity — e.g. 20 labels for a product you just restocked). If a
            // product has no barcode yet, we auto-generate one from its ID and
            // save it back, so future scans in POS will recognize it too.
            const printBarcodeLabels = async () => {
                const selected = Object.entries(labelSelection).filter(([, qty]) => Number(qty) > 0);
                if (selected.length === 0) { alert('Kam se kam ek product select karke quantity daalo.'); return; }

                const batch = db.batch();
                let needsCommit = false;
                const labelsHtml = [];

                for (const [pid, qty] of selected) {
                    let p = products.find(x => x.id === pid);
                    if (!p) continue;
                    let code = p.barcode;
                    if (!code) {
                        code = 'BM' + pid.slice(-8).toUpperCase();
                        batch.update(productsRef.doc(pid), { barcode: code });
                        needsCommit = true;
                        p = { ...p, barcode: code };
                    }
                    for (let i = 0; i < Number(qty); i++) {
                        labelsHtml.push(`
                            <div class="barcode-label">
                                <div class="label-name">${p.name}</div>
                                <svg class="label-svg" data-code="${code}"></svg>
                                <div class="label-price">₹${p.priceSell}</div>
                            </div>
                        `);
                    }
                }
                if (needsCommit) await batch.commit();

                const win = window.open('', '_blank');
                win.document.write(`
                    <html><head><title>Barcode Labels</title>
                    <script src="https://unpkg.com/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></scr` + `ipt>
                    <style>
                        body { margin: 0; font-family: sans-serif; }
                        .label-grid { display: flex; flex-wrap: wrap; gap: 4mm; padding: 4mm; }
                        .barcode-label { width: 40mm; padding: 2mm; border: 1px dashed #999; text-align: center; box-sizing: border-box; }
                        .label-name { font-size: 9px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
                        .label-price { font-size: 11px; font-weight: bold; }
                    </style>
                    </head><body>
                    <div class="label-grid">${labelsHtml.join('')}</div>
                    <script>
                        document.querySelectorAll('.label-svg').forEach(function(svg) {
                            JsBarcode(svg, svg.getAttribute('data-code'), { format: 'CODE128', width: 1.4, height: 30, fontSize: 10, margin: 2 });
                        });
                        window.onload = function() { setTimeout(function(){ window.print(); }, 300); };
                    </scr` + `ipt>
                    </body></html>
                `);
                win.document.close();
                setLabelSelection({});
            };


            return (
                <div className="p-4 h-full overflow-auto">
                    <div className="bg-white p-4 rounded shadow mb-6">
                        <div className="flex justify-between items-center mb-2">
                            <h3 className="font-bold">{restockProd ? `${t(lang, 'inv_restocking')}: ${restockProd.name}` : t(lang, 'inv_addNew')}</h3>

                    {isAdmin && (

                    <div className="bg-white rounded shadow overflow-hidden">

                        <table className="w-full text-sm text-left">

                                    <th className="p-2">{t(lang, 'inv_sellRateCol')}</th>

                                        <td className={`p-2 font-bold ${p.stock < 10 ? 'text-red-600' : 'text-green-600'}`}>{p.stock} {unitLabel(lang, p.unit)}</td>
                                        <td className="p-2">₹{p.priceSell}</td>
                                        <td className="p-2">
                                            {p.gstApplicable === false ? <span className="text-xs bg-gray-100 text-gray-500 px-2 py-0.5 rounded">No GST</span> : <span className="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded font-bold">{p.gst || 0}%</span>}
                                        </td>
                                        <td className="p-2">{p.discountAllowed === false ? <span className="text-xs text-gray-400">Fixed</span> : `${p.discount}%`}</td>

                        {isAdmin && <p className="text-xs text-gray-400 p-2">"Labels" column me kitne barcode sticker print karne hain wo quantity daalo, phir upar "Print Barcode Labels" dabao.</p>}
                    </div>
                </div>
            );
        };

        // ============================================================
        // 6. POS / BILLING
        // ============================================================
        const PAYMENT_METHODS = ['Cash', 'UPI', 'Bank Transfer', 'Cheque', 'Card'];

        const POS = ({ orgId, org, products, userDoc, firebaseUser, lang }) => {
            const [cart, setCart] = useState([]);
            const [query, setQuery] = useState('');
            const [catFilter, setCatFilter] = useState('All');
            const [selectedProd, setSelectedProd] = useState(null);
            const [qtyInput, setQtyInput] = useState('');
            const [discInput, setDiscInput] = useState('');
            const [discType, setDiscType] = useState('percent'); // 'percent' | 'flat' — negative value = EXTRA charge (common for udhar customers)
            const [priceType, setPriceType] = useState('retail'); // 'retail' | 'wholesale'
            const [billType, setBillType] = useState('Estimate');
            const [paymentMode, setPaymentMode] = useState('Cash'); // Cash | Udhar | Split
            const [paymentMethod, setPaymentMethod] = useState('Cash'); // how the paid portion was received: Cash/UPI/Bank Transfer/Cheque/Card
            const [splitCash, setSplitCash] = useState('');
            const [udharSite, setUdharSite] = useState(''); // which site/project this credit is for (contractor customers)
            const [udharDueDate, setUdharDueDate] = useState('');
            const [billDiscount, setBillDiscount] = useState(''); // extra flat ₹ discount on the whole bill
            const [customer, setCustomer] = useState({ name: '', mobile: '', gst: '', address: '' });
            const [existingCustomerInfo, setExistingCustomerInfo] = useState(null); // { fromDirectory, party } — looked up when mobile is entered
            const [lookupBusy, setLookupBusy] = useState(false);
            const [saving, setSaving] = useState(false);
            const [heldBills, setHeldBills] = useState([]);
            const [showHeld, setShowHeld] = useState(false);
            const [lastSale, setLastSale] = useState(null); // for "Send via WhatsApp" right after billing

            const searchRef = useRef();
            const qtyRef = useRef();

            // When staff finishes typing a mobile number, check if we've seen this
            // customer before (Customer Directory) and auto-fill their name/address,
            // and check the Udhar Khata for any existing pending balance so staff
            // (and the customer) can see it before billing continues.
            const lookupCustomerByMobile = async () => {
                const mobile = customer.mobile.trim();
                if (mobile.length < 10) { setExistingCustomerInfo(null); return; }
                setLookupBusy(true);
                try {
                    const [custSnap, partySnap] = await Promise.all([
                        db.collection('orgs').doc(orgId).collection('customers').where('mobile', '==', mobile).limit(1).get(),
                        db.collection('orgs').doc(orgId).collection('parties').where('type', '==', 'customer').where('mobile', '==', mobile).limit(1).get()
                    ]);
                    const dir = custSnap.empty ? null : { id: custSnap.docs[0].id, ...custSnap.docs[0].data() };
                    const party = partySnap.empty ? null : { id: partySnap.docs[0].id, ...partySnap.docs[0].data() };
                    if (dir || party) {
                        setExistingCustomerInfo({ directory: dir, party });
                        // Auto-fill only if staff hasn't already typed something different.
                        setCustomer(prev => ({
                            ...prev,
                            name: prev.name || (dir && dir.name) || (party && party.name) || '',
                            address: prev.address || (dir && dir.address) || ''
                        }));
                    } else {
                        setExistingCustomerInfo(null);
                    }
                } catch (e) {
                    console.error('Customer lookup failed:', e);
                } finally {
                    setLookupBusy(false);
                }
            };


            useEffect(() => {
                const unsub = db.collection('orgs').doc(orgId).collection('heldBills').orderBy('createdAt', 'desc').onSnapshot(snap => {
                    setHeldBills(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                return unsub;
            }, [orgId]);

            useEffect(() => {
                const handleKey = (e) => {
                    if (e.key === 'F2') { e.preventDefault(); searchRef.current && searchRef.current.focus(); }
                    if (e.key === 'F9') { e.preventDefault(); completeSale(true); }
                    if (e.key === 'F8') { e.preventDefault(); completeSale(false); }
                    if (e.key === 'F7') { e.preventDefault(); holdBill(); }
                };
                window.addEventListener('keydown', handleKey);
                return () => window.removeEventListener('keydown', handleKey);
            }, [cart, customer]);

            const holdBill = async () => {
                if (cart.length === 0) return alert('Cart khaali hai, hold karne ke liye kuch nahi hai.');
                await db.collection('orgs').doc(orgId).collection('heldBills').add({
                    cart, customer, billType, paymentMode, billDiscount,
                    label: customer.name || `${cart.length} items`,
                    staffName: userDoc.name, createdAt: FieldValue.serverTimestamp()
                });
                setCart([]); setCustomer({ name: '', mobile: '', gst: '', address: '' }); setBillDiscount('');
            };

            const resumeHeldBill = async (h) => {
                setCart(h.cart || []);
                setCustomer(h.customer || { name: '', mobile: '', gst: '', address: '' });
                setBillType(h.billType || 'Estimate');
                setBillDiscount(h.billDiscount || '');
                await db.collection('orgs').doc(orgId).collection('heldBills').doc(h.id).delete();
                setShowHeld(false);
            };

            const discardHeldBill = async (h) => {
                if (confirm(`"${h.label}" wala held bill delete karna hai?`)) {
                    await db.collection('orgs').doc(orgId).collection('heldBills').doc(h.id).delete();
                }
            };

            // Always show a browsable list: filter by typed search AND/OR selected category chip.
            // (Previously nothing showed until you typed — now staff can browse type-wise too.)
            const filteredProducts = products
                .filter(p => !query || p.name.toLowerCase().includes(query.toLowerCase()) || (p.brand || '').toLowerCase().includes(query.toLowerCase()) || (p.barcode || '') === query.trim())
                .filter(p => catFilter === 'All' || p.category === catFilter)
                .sort((a, b) => a.category === b.category ? a.name.localeCompare(b.name) : a.category.localeCompare(b.category));

            const categoriesInStock = ['All', ...CATEGORIES.filter(c => products.some(p => p.category === c))];

            const getBasePrice = (prod) => (priceType === 'wholesale' && prod.priceWholesale) ? prod.priceWholesale : prod.priceSell;
            const calcFinalPrice = (prod, type, val) => { const base = getBasePrice(prod); return type === 'flat' ? (base - val) : (base - base * (val / 100)); };

            // Adds an item to the cart. If the SAME product with the SAME discount
            // (type + value) AND same pricing tier is already in the cart, its
            // quantity is increased instead of creating a second, confusing line.
            const addLineToCart = (prod, qty, type, val) => {
                const finalPrice = calcFinalPrice(prod, type, val);
                setCart(prev => {
                    const idx = prev.findIndex(it => it.id === prod.id && it.discountType === type && it.discount === val && it.priceType === priceType);
                    if (idx >= 0) {
                        const existing = prev[idx];
                        const newQty = existing.qty + qty;
                        const updated = [...prev];
                        updated[idx] = { ...existing, qty: newQty, total: finalPrice * newQty, profit: (finalPrice - prod.priceBuy) * newQty };
                        return updated;
                    }
                    return [...prev, { ...prod, qty, discountType: type, discount: val, priceType, finalPrice, total: finalPrice * qty, profit: (finalPrice - prod.priceBuy) * qty }];
                });
            };

            // Barcode scanners behave like a keyboard that types the code then hits
            // Enter almost instantly. If the typed text exactly matches a barcode,
            // add it straight to the cart (qty 1) instead of waiting for a click.
            const handleSearchKeyDown = (e) => {
                if (e.key !== 'Enter') return;
                const q = query.trim();
                if (!q) return;
                const byBarcode = products.find(p => p.barcode && p.barcode === q);
                const exactName = !byBarcode && products.find(p => p.name.toLowerCase() === q.toLowerCase());
                const match = byBarcode || exactName;
                if (match) {
                    e.preventDefault();
                    if (match.stock < 1) { alert(`Stock khatam hai: ${match.name}`); return; }
                    addLineToCart(match, 1, 'percent', match.discountAllowed === false ? 0 : (match.discount || 0));
                    setQuery('');
                }
            };

            const addToCart = (e) => {
                e.preventDefault();
                if (!qtyInput || Number(qtyInput) <= 0) return;
                const qty = Number(qtyInput);
                const alreadyInCart = cart.filter(it => it.id === selectedProd.id).reduce((s, it) => s + it.qty, 0);
                if (selectedProd.stock < alreadyInCart + qty) { alert(`Stock kam hai! Available: ${selectedProd.stock}, cart me pehle se: ${alreadyInCart}`); return; }
                const type = selectedProd.discountAllowed === false ? 'percent' : discType;
                const val = selectedProd.discountAllowed === false ? 0 : (discInput === '' ? 0 : Number(discInput));
                addLineToCart(selectedProd, qty, type, val);
                setSelectedProd(null); setQtyInput(''); setDiscInput(''); setDiscType('percent'); setQuery('');
                searchRef.current.focus();
            };

            const selectProduct = (prod) => {
                setSelectedProd(prod);
                setQtyInput('');
                setDiscType('percent');
                setDiscInput(prod.discountAllowed === false ? 0 : (prod.discount || 0)); // pre-fill with product's default discount, but staff can change it for this sale
                setTimeout(() => qtyRef.current && qtyRef.current.focus(), 100);
            };

            const fetchGST = () => {
                if (customer.gst.length === 15) {
                    setCustomer(prev => ({ ...prev, name: prev.name || 'Customer (verify GST manually)' }));
                }
            };

            const completeSale = async (shouldPrint) => {
                if (cart.length === 0) return alert('Cart Empty!');

                const subtotal = cart.reduce((sum, item) => sum + item.total, 0);
                const gstAmount = billType === 'Tax Invoice' ? cart.reduce((sum, item) => sum + item.total * ((item.gst || 0) / 100), 0) : 0;
                const billDiscountAmt = Math.min(Number(billDiscount) || 0, subtotal + gstAmount);
                const beforeRound = subtotal + gstAmount - billDiscountAmt;
                const grandTotal = Math.round(beforeRound);
                const roundOff = grandTotal - beforeRound;

                let udharPortion = 0;
                if (paymentMode === 'Udhar') udharPortion = grandTotal;
                else if (paymentMode === 'Split') {
                    udharPortion = Math.max(0, grandTotal - (Number(splitCash) || 0));
                    if ((Number(splitCash) || 0) > grandTotal) { alert('Cash amount total se zyada nahi ho sakta.'); return; }
                }
                if (udharPortion > 0 && !customer.name.trim()) { alert('Udhar ke liye Customer Name daalna zaroori hai!'); return; }
                if (saving) return;
                setSaving(true);
                try {
                    const cashAmount = grandTotal - udharPortion;
                    const totalProfit = cart.reduce((sum, item) => sum + (item.profit || 0), 0);
                    const saleData = {
                        date: new Date().toISOString(),
                        createdAt: FieldValue.serverTimestamp(),
                        customer, cart, subtotal, gstAmount, billDiscount: billDiscountAmt, roundOff, grandTotal, totalProfit, billType, paymentMode,
                        paymentMethod: cashAmount > 0 ? paymentMethod : null,
                        cashAmount, udharAmount: udharPortion,
                        site: udharPortion > 0 ? (udharSite || '') : '',
                        dueDate: udharPortion > 0 ? (udharDueDate || null) : null,
                        voided: false,
                        returnedTotal: 0, returnedProfit: 0,
                        printed: shouldPrint,
                        staffUid: firebaseUser.uid,
                        staffName: userDoc.name,
                        staffEmail: userDoc.email
                    };

                    // If any part of this sale is on credit (Udhar or the udhar-half of
                    // a Split payment), find-or-create the customer's khata party.
                    let partyRef = null;
                    if (udharPortion > 0) {
                        const partiesRef = db.collection('orgs').doc(orgId).collection('parties');
                        let existing = null;
                        if (customer.mobile) {
                            const snap = await partiesRef.where('type', '==', 'customer').where('mobile', '==', customer.mobile).limit(1).get();
                            if (!snap.empty) existing = snap.docs[0];
                        }
                        // Credit limit check: if this customer already has a limit set
                        // and this sale would push them over it, warn before proceeding.
                        if (existing) {
                            const ed = existing.data();
                            const limit = ed.creditLimit || 0;
                            const projectedBalance = (ed.balance || 0) + udharPortion;
                            if (limit > 0 && projectedBalance > limit) {
                                const proceed = confirm(`⚠ ${customer.name} ki credit limit ₹${limit.toLocaleString()} hai. Ye sale ke baad balance ₹${projectedBalance.toLocaleString()} ho jayega — limit paar ho rahi hai.\n\nPhir bhi aage badhna hai?`);
                                if (!proceed) { setSaving(false); return; }
                            }
                        }
                        partyRef = existing ? existing.ref : partiesRef.doc();
                    }

                    // Every sale with a customer name/mobile updates a permanent
                    // Customer Directory — separate from the Udhar Khata (which is
                    // only for people who owe money). This directory keeps EVERY
                    // customer (cash or credit) for future reference/marketing.
                    let customerDirRef = null;
                    let isNewCustomer = false;
                    if (customer.name.trim() || customer.mobile.trim()) {
                        const customersRef = db.collection('orgs').doc(orgId).collection('customers');
                        let existingCust = null;
                        if (customer.mobile) {
                            const custSnap = await customersRef.where('mobile', '==', customer.mobile).limit(1).get();
                            if (!custSnap.empty) existingCust = custSnap.docs[0];
                        }
                        isNewCustomer = !existingCust;
                        customerDirRef = existingCust ? existingCust.ref : customersRef.doc();
                    }

                    const batch = db.batch();
                    cart.forEach(item => {
                        const ref = db.collection('orgs').doc(orgId).collection('products').doc(item.id);
                        batch.update(ref, { stock: FieldValue.increment(-item.qty) });
                    });
                    const saleRef = db.collection('orgs').doc(orgId).collection('sales').doc();
                    batch.set(saleRef, { ...saleData, partyId: partyRef ? partyRef.id : null });

                    if (customerDirRef) {
                        const custData = {
                            name: customer.name || '', mobile: customer.mobile || '', address: customer.address || '',
                            gst: customer.gst || '',
                            totalPurchases: FieldValue.increment(1),
                            totalSpent: FieldValue.increment(grandTotal),
                            lastPurchaseDate: new Date().toISOString(),
                            lastBillId: saleRef.id,
                            createdAt: FieldValue.serverTimestamp()
                        };
                        if (isNewCustomer) custData.firstPurchaseDate = new Date().toISOString();
                        batch.set(customerDirRef, custData, { merge: true });
                    }

                    if (partyRef) {
                        batch.set(partyRef, {
                            name: customer.name, mobile: customer.mobile || '', type: 'customer',
                            balance: FieldValue.increment(udharPortion),
                            createdAt: FieldValue.serverTimestamp()
                        }, { merge: true });
                        const txnRef = partyRef.collection('transactions').doc();
                        batch.set(txnRef, {
                            type: 'sale_credit', amount: udharPortion, site: udharSite || '', dueDate: udharDueDate || null,
                            note: `Bill #${saleRef.id.slice(-6)}${paymentMode === 'Split' ? ' (part payment)' : ''}`,
                            billId: saleRef.id, date: new Date().toISOString(), createdAt: FieldValue.serverTimestamp(),
                            staffUid: firebaseUser.uid, staffName: userDoc.name
                        });
                        if (udharDueDate) {
                            batch.set(db.collection('orgs').doc(orgId).collection('dueReminders').doc(), {
                                partyId: partyRef.id, partyName: customer.name, partyType: 'customer', mobile: customer.mobile || '',
                                site: udharSite || '', amount: udharPortion, dueDate: udharDueDate,
                                note: `Bill #${saleRef.id.slice(-6)}`,
                                resolved: false, createdAt: FieldValue.serverTimestamp()
                            });
                        }
                    }

                    // Sale is ALWAYS saved to Firestore regardless of whether it's printed —
                    // printing is just an optional extra step on top. We deliberately do
                    // NOT await the server round-trip here: Firestore's local cache commits
                    // the write immediately (so stock/cart update right away) and syncs to
                    // the server in the background — this is what keeps billing working
                    // even when the internet is down.
                    batch.commit().catch(err => console.error('Sync error (will retry automatically):', err));

                    if (shouldPrint) {
                        document.getElementById('print-content').innerHTML = generateReceiptHTML({ ...saleData, id: saleRef.id }, org);
                        window.print();
                    }

                    setLastSale({ ...saleData, id: saleRef.id });
                    setCart([]); setCustomer({ name: '', mobile: '', gst: '', address: '' }); setQuery(''); setExistingCustomerInfo(null);
                    setPaymentMode('Cash'); setPaymentMethod('Cash'); setSplitCash(''); setUdharSite(''); setUdharDueDate(''); setBillDiscount('');
                } catch (e) {
                    alert('Error: ' + e.message);
                } finally {
                    setSaving(false);
                }
            };

            const totals = useMemo(() => {
                const subtotal = cart.reduce((s, i) => s + i.total, 0);
                const gstAmount = billType === 'Tax Invoice' ? cart.reduce((s, i) => s + i.total * ((i.gst || 0) / 100), 0) : 0;
                const billDiscountAmt = Math.min(Number(billDiscount) || 0, subtotal + gstAmount);
                const beforeRound = subtotal + gstAmount - billDiscountAmt;
                const grandTotal = Math.round(beforeRound);
                const roundOff = grandTotal - beforeRound;
                return { subtotal, gstAmount, billDiscount: billDiscountAmt, roundOff, grandTotal };
            }, [cart, billType, billDiscount]);

            return (
                <div className="flex h-full gap-4 p-4">
                    <div className="w-2/3 bg-white rounded shadow p-4 flex flex-col">
                        <div className="flex gap-2 mb-3 items-center">
                            <input ref={searchRef} className="flex-1 border-2 border-blue-500 rounded p-3 text-lg" placeholder={t(lang, 'pos_search')} value={query} onChange={e => setQuery(e.target.value)} onKeyDown={handleSearchKeyDown} />
                            <div className="flex border rounded overflow-hidden shrink-0">
                                <button onClick={() => setPriceType('retail')} className={`px-3 py-2 text-sm font-bold ${priceType === 'retail' ? 'bg-blue-600 text-white' : 'bg-white text-gray-600'}`}>Retail</button>
                                <button onClick={() => setPriceType('wholesale')} className={`px-3 py-2 text-sm font-bold ${priceType === 'wholesale' ? 'bg-purple-600 text-white' : 'bg-white text-gray-600'}`}>Wholesale</button>
                            </div>
                            <button onClick={holdBill} className="shrink-0 bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-2 rounded text-sm font-bold" title="Hold Bill (F7)">⏸ Hold (F7)</button>
                            <button onClick={() => setShowHeld(true)} className="shrink-0 relative bg-slate-600 hover:bg-slate-700 text-white px-3 py-2 rounded text-sm font-bold">
                                📋 Held{heldBills.length > 0 ? ` (${heldBills.length})` : ''}
                            </button>
                        </div>
                        <div className="flex flex-wrap gap-1 mb-3">
                            {categoriesInStock.map(c => (
                                <button key={c} onClick={() => setCatFilter(c)}
                                    className={`px-3 py-1 rounded-full text-sm border ${catFilter === c ? 'bg-orange-600 text-white border-orange-600' : 'bg-white text-gray-600 hover:bg-gray-50'}`}>
                                    {c === 'All' ? t(lang, 'pos_all') : catLabel(lang || 'en', c)}
                                </button>
                            ))}
                        </div>
                        <div className="flex-1 overflow-auto grid grid-cols-2 md:grid-cols-3 gap-3 content-start">
                            {filteredProducts.length > 0 ? filteredProducts.map(p => (
                                <div key={p.id} onClick={() => selectProduct(p)} className={`cursor-pointer border p-3 rounded hover:bg-blue-50 transition flex justify-between items-center ${p.stock < 5 ? 'bg-red-50' : ''}`}>
                                    <div>
                                        <div className="font-bold">{p.name}</div>
                                        <div className="text-xs text-gray-500">{catLabel(lang || 'en', p.category)}{p.brand ? ' · ' + p.brand : ''} | {p.stock} {unitLabel(lang || 'en', p.unit)}
                                            {p.gstApplicable === false ? <span className="ml-1 text-gray-400">· {t(lang, 'pos_noGst')}</span> : <span className="ml-1 text-blue-600">· {t(lang, 'pos_gstLabel')} {p.gst || 0}%</span>}
                                        </div>
                                    </div>
                                    <div className="text-blue-600 font-bold">₹{priceType === 'wholesale' && p.priceWholesale ? p.priceWholesale : p.priceSell}</div>
                                </div>
                            )) : (
                                <div className="col-span-3 text-center text-gray-400 mt-10">
                                    {products.length === 0 ? t(lang, 'pos_noItems') : t(lang, 'pos_noMatch')}
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="w-1/3 bg-gray-50 rounded shadow flex flex-col border-l">
                        <div className="p-3 bg-slate-800 text-white rounded-t flex justify-between items-center">
                            <h2 className="font-bold">{t(lang, 'pos_billingDetails')}</h2>
